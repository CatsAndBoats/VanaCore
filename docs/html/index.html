rConvertFloat4ToU32`, `ColorConvertRGBtoHSV`, `ColorConvertHSVtoRGB`, `GetColorU32`, `GetStyleColorVec4`, `GetStyleColorName` |\n| Lists and trees | `BeginCombo`, `EndCombo`, `Combo`, `BeginListBox`, `EndListBox`, `ListBox`, `TreeNode`, `TreeNodeEx`, `TreePush`, `TreePop`, `CollapsingHeader`, `SetNextItemOpen`, `GetTreeNodeToLabelSpacing`, `PlotLines`, `PlotHistogram` |\n| Menus and popups | `BeginMenuBar`, `EndMenuBar`, `BeginMainMenuBar`, `EndMainMenuBar`, `BeginMenu`, `BeginMenuEx`, `EndMenu`, `MenuItem`, `MenuItemEx`, `OpenPopup`, `BeginPopup`, `BeginPopupModal`, `EndPopup`, `CloseCurrentPopup`, `BeginPopupContextItem/Window/Void`, `OpenPopupOnItemClick`, `IsPopupOpen`, `BeginTooltip`, `EndTooltip`, `SetTooltip`, `SetItemTooltip`, `BeginItemTooltip` |\n| Tables and columns | `BeginTable`, `EndTable`, `TableNextRow`, `TableNextColumn`, `TableSetColumnIndex`, `TableSetupColumn`, `TableSetupScrollFreeze`, `TableHeader`, `TableHeadersRow`, `TableAngledHeadersRow`, `TableGetSortSpecs`, `TableGetColumn*`, `TableGetHoveredColumn`, `TableGetRowIndex`, `TableSetColumnEnabled`, `TableSetBgColor`, `Columns`, `NextColumn`, `GetColumnIndex/Width/Offset`, `SetColumnWidth/Offset`, `GetColumnsCount` |\n| Tabs | `BeginTabBar`, `EndTabBar`, `BeginTabItem`, `EndTabItem`, `TabItemButton`, `SetTabItemClosed` |\n| Style and fonts | `PushStyleColor`, `PopStyleColor`, `PushStyleVar`, `PushStyleVarX/Y`, `PopStyleVar`, `GetStyle`, `StyleColorsDark/Light/Classic`, `PushFont`, `PopFont`, `GetFont`, `GetFontSize`, `GetFontBaked`, `GetFontTexUvWhitePixel`, `AddFontFromFileTTF`, `PushItemFlag`, `PopItemFlag` |\n| Ids and items | `PushID`, `PopID`, `GetID`, `GetItemID`, `IsItemHovered/Active/Focused/Clicked/Visible/Edited/Activated/Deactivated/DeactivatedAfterEdit/ToggledOpen/ToggledSelection`, `IsAnyItemHovered/Active/Focused`, `GetItemRectMin/Max/Size`, `SetItemDefaultFocus`, `SetKeyboardFocusHere`, `SetNextItemAllowOverlap`, `SetItemKeyOwner`, `SetNextItemSelectionUserData`, `SetNextItemStorageID`, `SetNavCursorVisible` |\n| Input state | `GetIO`, `GetPlatformIO`, `IsKeyDown/Pressed/Released`, `IsKeyChordPressed`, `GetKeyName`, `GetKeyPressedAmount`, `IsMouseDown/Clicked/Released/DoubleClicked/Dragging/HoveringRect/PosValid/ReleasedWithDelay`, `IsAnyMouseDown`, `GetMouseClickedCount`, `GetMousePos`, `GetMousePosOnOpeningCurrentPopup`, `GetMouseDragDelta`, `ResetMouseDragDelta`, `GetMouseCursor`, `SetMouseCursor`, `SetNextFrameWantCaptureKeyboard/Mouse`, `Shortcut`, `SetNextItemShortcut` |\n| Scrolling and clipping | `GetScrollX/Y`, `SetScrollX/Y`, `GetScrollMaxX/Y`, `SetScrollHereX/Y`, `SetScrollFromPosX/Y`, `PushClipRect`, `PopClipRect`, `IsRectVisible`, `CalcListClipping` |\n| Drag and drop | `BeginDragDropSource`, `EndDragDropSource`, `BeginDragDropTarget`, `EndDragDropTarget`, `SetDragDropPayload`, `AcceptDragDropPayload`, `GetDragDropPayload` |\n| Misc | `GetTime`, `GetFrameCount`, `GetVersion`, `GetMainViewport`, `GetClipboardText`, `SetClipboardText`, `ShowDemoWindow`, `ShowMetricsWindow`, `ShowStyleEditor`, `ShowAboutWindow`, `ShowUserGuide`, `ShowDebugLogWindow`, `ShowIDStackToolWindow`, `ShowFontSelector`, `ShowStyleSelector`, `DebugLog`, `DebugTextEncoding`, `DebugFlashStyleColor`, `LogToTTY/File/Clipboard`, `LogButtons`, `LogText`, `LogFinish`, `LoadIniSettingsFromDisk/Memory`, `SaveIniSettingsToDisk/Memory`, `MemAlloc`, `MemFree`, `BeginMultiSelect`, `EndMultiSelect` |\n| Docking and viewports | `DockSpace`, `DockSpaceOverViewport`, `GetWindowDockID`, `IsWindowDocked`, `SetNextWindowClass/DockID/Viewport`, `GetWindowViewport`, `FindViewportByID/PlatformHandle` |\n| Older ImGui's names (for addons written for them) | `BeginChildFrame`, `EndChildFrame`, `ListBoxHeader`, `ListBoxFooter`, `GetContentRegionMax`, `GetWindowContentRegionMin/Max/Width`, `PushAllowKeyboardFocus`, `PopAllowKeyboardFocus`, `PushButtonRepeat`, `PopButtonRepeat`, `CaptureKeyboardFromApp`, `CaptureMouseFromApp`, `SetItemAllowOverlap`, `GetKeyIndex` |\n\nDraw lists (`GetWindowDrawList()`, `GetBackgroundDrawList()`, `GetForegroundDrawList()`) have `AddLine`, `AddRect`,\n`AddRectFilled`, `AddRectFilledMultiColor`, `AddQuad(Filled)`, `AddTriangle(Filled)`, `AddCircle(Filled)`,\n`AddNgon(Filled)`, `AddEllipse(Filled)`, `AddText`, `AddBezierCubic`, `AddBezierQuadratic`, `AddPolyline`,\n`AddConvexPolyFilled`, `AddConcavePolyFilled`, `PushClipRect`, `PopClipRect`, `PushTexture`, `PopTexture`:\n\n```lua\nlocal dl = imgui.GetBackgroundDrawList()\ndl:AddRectFilled({ 10, 10 }, { 210, 40 }, 0xAA000000, 4)\ndl:AddText({ 16, 16 }, 0xFFFFFFFF, 'Behind every window')\n```\n\nImGui's structures can be made too: `imgui.types.ImGuiListClipper.new()`, `imgui.types.ImGuiTextFilter.new()`, and\nthe rest in `imgui.types`, each with its methods.\n\n`ShowDemoWindow()` draws ImGui's own demo, which shows every widget with its code: the quickest way to find the call\nyou want.\n\n### Fonts in ImGui\n\nThe default is Agave at 18 px with Font Awesome 6's icons merged in; 24 and 32 px are loaded too. `AddFontFromFileTTF`\nadds your own to the shared atlas (rebuilt before the next frame); `PushFont`/`PopFont` switch. `SetWindowFontScale`\nscales a window's text.\n\n### The player can move and scale your windows\n\nEvery top-level `Begin`/`End` goes through VanaCore's layout system (`/vana layout`: the Addons page's Layout; or the HUD\nManager's Addon View, `/hud addons`, a yellow box over each window to Shift + drag). The player can move any addon's\nwindow, and scale it, without the addon knowing: positions and scales are kept in `config\\layout.json` by window name. Your\nfonts and primitives move together, as one \"Text and shapes\" box. Two rules follow:\n\n- **Give each window a stable name.** `Begin('Timers')` keeps its place; `Begin('Timers ' .. count)` is a new window\n  every time the count changes. Use `###` for a changing title: `Begin('Timers (' .. n .. ')###timers')`.\n- **Place windows once**, with `SetNextWindowPos(pos, 4)` (`FirstUseEver`), unless it must follow something. A window\n  you place every frame (`ImGuiCond_Always`) is \"pinned\": the player's move becomes an offset from yours, so it still\n  follows what it's anchored to.\n\n```lua\nvana.layout.windows()               -- every addon's and plugin's ImGui window: { name, owner, x, y, w, h, scale, shown, pinned, saved, locked, no_pointer }\nvana.layout.set(name, x, y, scale)  -- move or scale one (nil leaves that part)\nvana.layout.flags(name, locked, no_pointer) -- lock one (the mouse can't drag or resize it) and/or let the mouse through it (nil leaves that part)\nvana.layout.reset(name)             -- forget what's set for it\nvana.layout.highlight(name)         -- outline it this frame and the next\n```\n\nWindow positions ImGui itself keeps are in `config\\imgui.ini`.\n\n### The game's windows over yours: `vana.ui.game_on_top`\n\nImGui is drawn after the game, so your windows cover the game's own (an NPC's choices, the action menu, item details,\nshops, the macro bar). An addon that sits where the game puts its windows (a chat replacement, a big HUD) can ask for\nthem to go over its windows:\n\n```lua\nvana.ui.game_on_top(true)       -- from now on, until false or unload; true when called with nothing\n```\n\nEach frame, a game window that meets one of your top-level ImGui windows (as the last frame drew it) is copied as the\ngame drew it and laid back over everything at the end of the frame. The mouse over it is the game's. It is per addon, so\nthe others stay as they are, and it is dropped when the addon unloads. Ashita and Windower addons have the `vana` global\ntoo: `if vana and vana.ui then vana.ui.game_on_top(true) end`. The player's `[client] menus.ontop=0` turns it off for\nevery addon.\n\nWhat to expect:\n\n- The game window is pasted back as a rectangle, over *everything* in it, other addons' windows included, and its\n  corners show the game's picture behind, not your window. Give it only the windows that need it. VanaCore's own panels\n  (/vana, the HUD Manager) stay over the game's windows: one that meets a panel is left where it is.\n- A window that covers the screen (a full-screen overlay) puts every game window over everything. Use it on the windows\n  that sit where the game's go.\n- Your windows' places are the last frame's, so a window being dragged is a frame behind.\n- At most 8 game windows are laid back a frame. A game window with nothing in it (under 16 of the interface's units\n  high or wide: the chat log with no lines showing, the status icons with none; one closed; the help bar's title box and\n  help line once the game has faded their frames out, with no menu open) is left where it is, not pasted back.\n- Only the game's windows count (menus, lists, the action menu, the macro bar, shops, item details, ...). Nameplates,\n  damage numbers and the target arrow are not windows and stay where they are.\n\n### Input and ImGui\n\nA press or wheel over an ImGui window is ImGui's alone: the game doesn't see it, and `mouse` handlers hear it with\n`blocked` true. While an ImGui text box has the keyboard, keys go to ImGui and the game reads no presses. A window with\n`ImGuiWindowFlags_NoMouseInputs` lets the mouse through.\n\nFor a controller: call `vana.gamepad.nav(true)` each frame your window is open and wants the pad. ImGui then navigates\nwith it and the game reads the controller at rest.\n\n`imgui.GetVisible()` and `imgui.SetVisible(false)` hide every ImGui window (they're still built). `//vana` has the same\nswitch for the player.\n", "docs/07-game-interface.md": "# 7. The game's interface: `vana.gameui`\n\nAddons can draw their own windows. What they couldn't do safely on their own is change the **game's own** interface:\nhide the party list because they draw their own, put a button in the game's Config menu, take over a menu item, move\nthe Target window. VanaCore knows how to do each of those, so an addon asks VanaCore and VanaCore does it.\n\n> **Call it and it's done.** There's no file to write and nothing for the player to allow: `vana.gameui.hide('party_list')`\n> hides the party list. In return, **say in your addon's README what it changes in the game's interface**, so the\n> player knows before they load it. /vana > Addons shows the README.\n\nTwo rules hold throughout:\n\n1. **VanaCore does the change**, through the hook it already has. Two addons never patch the same window.\n2. **Everything is put back when the addon goes.** Unloaded, crashed or reloaded, the game's interface is as it was.\n\nAn Ashita plugin asks for the same through VanaCore's plugin API: [plugins/README.md](../plugins/README.md).\n\n`vana.gameui` needs **VanaCore 0.8.0.27 or later**; on an older one it's `nil`. Hiding the party list and moving the\nTarget window have been seen working in game (2026-10-21); the other elements are built and work the same way but\nhaven't each been tried in game yet.\n\n## The calls\n\nAll one word, in pairs:\n\n```lua\nvana.gameui.hide(element)                     -- not drawn -> true\nvana.gameui.show(element)                     -- drawn again\nvana.gameui.move(element, x, y)               -- percents of the interface -> true | false, 'held by X'\nvana.gameui.move(element)                     -- back to the player's own setting\nvana.gameui.rect(element)                     -- where it is on the screen -> left, top, right, bottom | nil ('target_window')\nvana.gameui.add(menu, label, fn[, colour])    -- your button, labelled `label` (1 to 10 letters); fn() when chosen\nvana.gameui.remove(menu)                      -- the button taken out\nvana.gameui.replace(item, fn)                 -- fn() instead of the game's action -> true | false, 'held by X'\nvana.gameui.restore(item)                     -- the item given back to the game\nvana.gameui.image(element, file[, options])   -- your picture in place of the game's -> true | false, 'held by X'\nvana.gameui.image(element)                    -- the game's own picture again\nvana.gameui.elements()                        -- what VanaCore can change: { { id, name, actions = { 'hide', ... } }, ... }\nvana.gameui.hidden(element)                   -- who has it hidden: 'yunaui, other' (addons' and plugins' names) | nil\nvana.gameui.stats_dump()                      -- the Equipment window's stats, each step, into the log (/vana statsdump)\nvana.gameui.hide(window)                      -- any of the game's windows by its name ('configwi'): drawn into nothing\nvana.gameui.window(window)                    -- the window as it stands: place, cursor, rows, text, pictures | nil\nvana.gameui.windows()                         -- the windows up: { 'menuwind', 'prty1', ... }\nvana.gameui.press(window, row[, event])       -- the player's choice made for them -> true | false, why\nvana.gameui.watch(window, fn)                 -- fn(e) when it opens, changes, closes: e.what, e.name, e.window -> id\nvana.gameui.unwatch(id)\n```\n\nWhat a call returns:\n\n| Returns | Means |\n|---------|-------|\n| `true` | Done. |\n| `false, 'held by X'` | `move` and `replace` have one holder at a time, the first addon to ask. VanaCore keeps that one's, and when it lets go, the next in line gets it. Ask once; yours takes effect then. |\n| an error | An element VanaCore doesn't know, an action that element doesn't take, a label that isn't 1 to 10 letters, a colour that isn't one of the names or `#RRGGBB`. That's a bug for the author to fix, so it fails loudly. |\n\n`hide` is shared: any number of addons can hide the same element, and it's shown again once none of them do. Hiding\ndoesn't remove: a hidden window isn't drawn, but the game still has it, so targeting, menus and macros that use it work\nas before.\n\nThe player sees your hide in the **HUD Manager** (`/hud`) as if they had switched it on themselves: the element's Hide\nswitch shows on and is locked, its tooltip names your addon, and its box isn't drawn in the game. The switch goes back\nwhen you show the element again or unload. `vana.gameui.hidden(element)` answers who has an element hidden, as one string\nof names (or `nil`); fancychat counts for `chat_log` and `chat_input`. It doesn't include the player's own switch.\n\n## The elements\n\n| `element` | The player sees | `hide` | `move` | `add` | `replace` | `image` |\n|-----------|-----------------|:------:|:------:|:-----:|:---------:|:-------:|\n| `chat_log` | Chat log (both windows) | yes | | | |\n| `chat_input` | Chat line | yes | | | |\n| `party_list` | Party list | yes | | | |\n| `alliance_lists` | Alliance lists (both) | yes | | | |\n| `target_window` | Target window | yes | yes | | |\n| `target_arrow` | The arrow over the target | yes | | | | yes |\n| `status_icons` | Status icons | yes | | | |\n| `macro_bar` | Macro bar (all four palettes) | yes | | | |\n| `network_window` | Network window | yes | | | |\n| `nameplates` | The names over characters' heads | yes | | | |\n| `config_menu` | Config menu | | | yes | |\n| `party_menu.find_member` | Party > Find Member | | | | yes |\n\n### `chat_log`\n\nBoth chat windows are kept closed, the way fancychat keeps them closed. Messages still arrive, so your addon can draw\nits own log from `text_in`. Nothing flickers when a line comes in or the chat line opens.\n\n### `chat_input`\n\nThe line you type chat into is kept off the screen, as the player's `[client] input.hide` does. Typing still works, so\nyour addon can draw the line itself.\n\n### `party_list` and `alliance_lists`\n\nNot drawn. The party itself doesn't change: targeting a member works, and `vana.game.party()` still reads the members.\nUsually hidden together.\n\n### `target_window`\n\n- **`hide`**: not drawn; the target is unchanged.\n- **`move`**: `vana.gameui.move('target_window', x, y)`. `x` and `y` are percents of the game's interface from its top\n  left (`0, 0` top left, `100, 100` bottom right). `x` is where the window's **middle** goes and `y` where its **top**\n  goes, as the player's own Target window settings in /vana have it: `50, 4` is the middle of the top edge. The window\n  is kept on screen. Your place goes before the player's own `[client] target.move/x/y` while your addon holds it;\n  `vana.gameui.move('target_window')` gives it back.\n- **`rect`**: `vana.gameui.rect('target_window')` is where the window is on the screen now, in the interface's pixels\n  (`vana.ui.screen`'s): its left, top, right and bottom, for drawing by it (a mark beside the target's name). `nil` while\n  it isn't open (nothing targeted) or is hidden. It follows the window wherever it is (the player's move, yours, the HUD\n  Manager's), so read it each frame you draw. Only `target_window` has a place to give: any other element is an error.\n  Needs **VanaCore 0.8.218 or later** (`vana.gameui.rect` is `nil` before).\n\n### `target_arrow`\n\nThe arrow the game draws over the targeted character's head, 20 x 32 interface units with its point at the target.\n\n- **`hide`**: not drawn. Targeting is unchanged, and the sub-target cursor (the one `<st>` moves) stays the game's.\n- **`image`**: your own picture in its place:\n\n```lua\nvana.gameui.image('target_arrow', 'arrow.png')                 -- a PNG in your addon's folder, its pixels as units\nvana.gameui.image('target_arrow', 'arrow.png', { width = 24, height = 40, y = -4, color = '#FFD080', opacity = 0.9 })\nvana.gameui.image('target_arrow')                               -- the game's arrow again\n```\n\n  `file` is a PNG (BMP and JPEG work too), relative to your addon's folder or a full path. The options, all optional:\n  `width` and `height` in the interface's units (left out, the picture's pixels are its units: a 20 x 32 picture is the\n  game's size); `x` and `y` move it from the game's anchor, the arrow's point, which is at the picture's bottom middle\n  (`y = -4` lifts it 4 units); `color` tints it (`'#RRGGBB'`); `opacity` 0 to 1. Like `move`, one addon holds it at a\n  time (`false, 'held by X'` for the next, whose picture takes over when the first lets go), and yours goes before the\n  player's own `[client] target.arrow.image`. The picture is drawn in VanaCore's interface pass, over the game's\n  windows, where the game had the arrow; a picture that can't be read is said in vanacore.log and nothing is drawn.\n  The player's **Show the arrow over the target** off hides it, picture or not.\n\n### `status_icons`, `macro_bar`, `network_window`\n\nNot drawn. `move` isn't available for them yet.\n\n### `nameplates`\n\n**`hide`**: no name is drawn over any character's head (players', NPCs', monsters', trusts', pets', your own), nor the\nline under it (a job master's stars). Targeting, the target window and the target arrow are unchanged. Draw your own\ninstead with [widgets](18-widgets.md); they are placed where the name would be even while it's hidden. The player's\nown settings can leave out a kind of name by itself (`[graphics] nameplates.hideown`, `.hideparty`, `.hidealliance`,\n`.hideplayers`, `.hidenpcs`, `.hidemonsters`, `.hidetrusts`, `.hidepets`). An addon that draws the party's and alliance's\nnames in its own bars can ask its players to turn on `.hideparty` and `.hidealliance` (/vana > Game Options >\nNameplates), so those names aren't shown twice.\n\n### `config_menu`\n\nThe game's Config menu (Main Menu > Config). VanaCore's own buttons are already below the game's 13: VanaCore (purple),\nthen HUD, FPS Graph and Game Stats. `vana.gameui.add('config_menu', label, fn[, colour])` puts yours after them;\n`fn()` runs, on the next frame, when the player chooses it.\n\n- **Label:** 1 to 10 characters, drawn letter by letter in the game's own menu font. A to Y, a to z and spaces work;\n  **Z and the digits aren't drawn yet** and show as gaps. A label too wide is set a little tighter.\n- **Colour**, left out for the game's blue: `'blue'`, `'green'`, `'yellow'`, `'red'` (Monstrosity's), `'purple'`\n  (VanaCore's), `'grey'` (untinted), or `'#RRGGBB'` (tints a grey button, so bright colours read best). Anything else\n  raises an error.\n- **Room:** 4 buttons fit after VanaCore's, and its own three take three, so one addon's button fits, the first to ask.\n  The rest aren't shown (VanaCore's log says so).\n- **When it appears:** the list is rebuilt with your button the next time it's closed and opened.\n- **Help line:** the game's help line for your button names your addon, so the player knows whose it is.\n\n### `party_menu.find_member`\n\n`vana.gameui.replace('party_menu.find_member', fn)`: choosing Party > Find Member runs `fn()` (next frame) instead of\nthe game's search. One holder at a time; `vana.gameui.restore('party_menu.find_member')` gives the item back.\n\n## Any window: `hide`, `window`, `windows` and `press`\n\nFor an addon that draws the game's menus its own way while the game keeps running them: hide the game's window, read what\nit shows, draw that, and send the player's choice back. **Untested in game** (built 5 November 2026).\n\n```lua\nvana.gameui.hide('configwi')            -- the Config menu drawn into nothing; show('configwi') gives it back\nlocal shown = nil                       -- what to draw: the window as the game last drew it\nvana.gameui.watch('configwi', function (e)\n    shown = e.window                    -- nil once it closes\nend)\n-- in your drawing: for _, row in ipairs(shown.rows) do ... row.text 'Gameplay', row.cursor, row.x/y/w/h ... end\nvana.gameui.press('configwi', 3)              -- cursor on row 3, then select\nvana.gameui.press('configwi', nil, 'cancel')  -- back out, as the player's cancel key\n```\n\n### `hide(window)`\n\n`window` is a window's name as `menu_open` gives it (`'menuwind'`, `'configwi'`, `'prty1'`, `'searchma'`) or as\n`vana.gameui.windows()` lists them: any of the game's windows, not only the elements above. Shared, put back when the addon\ngoes and listed by `hidden(window)`, as an element's hide is. Hidden this way:\n\n- **Nothing of it is drawn**, its cursor (the hand) and the gold highlight on the cursor's row included: the game draws\n  those as part of the window. Draw your own from `window().cursor`.\n- **Its draw still runs** (into nothing), so `window()` still reads its text and pictures, and the game's own work in it\n  goes on.\n- **The keys and the controller still work it**, as before: the cursor moves, items are chosen, `on` and `catch` hear it.\n- **The mouse doesn't**: no row of it is under the pointer, so a click over where it was does nothing. Clicks on your own\n  drawing go to the game with `press`.\n- Only that window: its help line at the bottom (`'helpwind'`) and the windows it opens are their own windows.\n\n### `window(window)`\n\nThe first window of that name that's up, as it stands, or `nil`:\n\n| Field | What |\n|-------|------|\n| `name` | Its name (`'configwi'`) |\n| `x`, `y`, `w`, `h` | Its place on the screen, in the pixels addons draw in (`vana.ui.screen()`) |\n| `scale` | Those pixels to one of the game's interface units: for sizing your drawing as the game's |\n| `cursor` | The id of the row the cursor is on |\n| `count` | How many rows the cursor goes over |\n| `focused` | It's the window the keys go to |\n| `closing` | It's closing (its last frames) |\n| `hidden` | An addon hides it (`hide(window)`) |\n| `drawn` | `lines` and `pictures` are from a draw of it: `false` the first time you ask for a window (see below) |\n| `rows` | Its buttons, a list in order of id: `{ id, text, x, y, w, h, cursor, disabled, drawn, state }` each (`rows[1]` is the lowest id, not id 1: find a row by `row.id`) |\n| `lines` | The text its last draw made, in runs: `{ text, x, y, w, h, color }` each |\n| `pictures` | The pictures its last draw made that aren't letters or button bars: `{ name, x, y, w, h, color }` each |\n\n- **`rows`** are the window's buttons: the main menu's items, a Config page's, the Party menu's. `id` is the game's\n  number for the row, the one `cursor`, `press` and `on`'s `e.item` use. `text` is the button's label as the game's menu\n  data gives it (`'Status'`, `'Region Info'`), read whether the window is drawn or not; a button with no label (an item\n  list's rows, an arrow) has `''`. `disabled` is greyed out; `drawn` false is a row the window doesn't draw itself (the\n  main menu's Map, which the menu draws on its own) or doesn't show. `state` is the game's own number for the row (5\n  greyed out, 1 just chosen).\n- **`lines`** are everything the window's last draw wrote, its labels included: the item names and counts of a list, a\n  Config page's settings, an NPC's choices. Letters drawn next to each other in the same colour make one run; a gap of a\n  few pixels is a space. The text is the game's own, Shift-JIS (`vana.encoding` converts it); ASCII is as it is. `color`\n  is the colour the game draws it in, `'#RRGGBB'`.\n- **`pictures`** are the rest of what it drew, by the game's name for the picture (`'menu    keytop'`): icons, on/off\n  boxes, arrows, its frame's pieces. What a picture means depends on the window: look at a window's once with\n  `vana.gameui.window` and you'll see which names to look for.\n- **Reading starts the keeping.** `lines` and `pictures` come from the window's draws, which VanaCore keeps only for the\n  windows addons watch (`watch`, below) or have asked about in the last 3 seconds. So the first `window()` of a window\n  nobody watches has `drawn = false` and no lines. Use `watch` instead: its `e.window` is always whole.\n- Places are the screen's pixels. A window that isn't drawn still has its place, where the game would draw it.\n\n### `watch(window, fn)` and `unwatch(id)`\n\n`fn(e)` runs when the window has something new to show, with the window already read:\n\n| `e.what` | When |\n|----------|------|\n| `'open'` | Its first draw since it opened (or since your watch began, when it was already up) |\n| `'change'` | A draw that shows anything else: it moved, the cursor moved, a row was greyed out or chosen, its text or pictures changed |\n| `'close'` | Once, when it starts to close or is gone |\n\n`e.name` is the window's name, `e.window` the same table `window(e.name)` gives, whole (`drawn` true: the draw it's\nfrom is the one that just happened), `nil` at `'close'`. `window` is a name, `'main_menu'` (both pages), `'party_menu'`,\n`'config_menu'`, `'*'` for every window, or a list of those. Returns an id for `unwatch(id)`; a watch ends when your\naddon unloads too.\n\n- **No frame late.** The game draws its windows, then VanaCore runs the addons' frame, so `fn` runs in the frame the game\n  drew what it's given: draw from `e.window` in your own drawing that frame.\n- **Only on change.** A window that sits still calls `fn` once, at `'open'`. Keep the last `e.window` and draw from it\n  every frame.\n- **Kept while watched.** A watched window's draws are kept for as long as you watch it, hidden or not. Watching `'*'`\n  keeps every window's (the chat log's too, which changes often): watch the ones you draw.\n\n```lua\nlocal menus = {}   -- name -> the window as last drawn\nvana.gameui.watch({ 'main_menu', 'config_menu', 'prty1' }, function (e)\n    menus[e.name] = e.window\nend)\n```\n\n### `windows()`\n\nThe names of the windows up, in the game's order: `{ 'helpwind', 'partywin', 'menuwind', ... }`.\n\n### `press(window, row[, event])`\n\nThe player's choice made for them: the window's cursor put on `row` (a row's `id`; `nil` leaves it where it is), then\n`event` given to the window as the keys give it: `'select'` (left out), `'cancel'`, `'up'`, `'down'`, `'left'`, `'right'`,\n`'menu'`, or the game's number. It goes through the game's own key input, so the window plays its sound, marks the item,\nopens what it opens, and `on` and `catch` hear it as they hear the keys.\n\nReturns `true`, or `false` and why: `'configwi' isn't up` (or it's closing), `has no row 40` (past `count`), `isn't\ntaking keys now` (it has just taken one: try on the next frame). Press only what's up and has the row: a row past the ones the cursor goes over\nisn't one to choose.\n\n## Checking for it\n\nAn addon that should still load on an older VanaCore, or an Ashita or Windower addon that also runs in real Ashita or\nWindower (every addon has `vana` here, whatever API it's written for):\n\n```lua\nif vana ~= nil and vana.gameui ~= nil then\n    vana.gameui.hide('party_list')\nend\n```\n\n## A full example\n\nexample-minparty (`addons\\vanacore\\example-minparty`) hides the party and alliance lists, draws a small list of its own in their\ncorner, moves the Target window to sit above it, and adds a Party button to the Config menu that shows or hides its\nlist. Its header says what it changes, as a README would.\n\n```lua\nvana.events.on('load', function ()\n    vana.gameui.hide('party_list')\n    vana.gameui.hide('alliance_lists')\n    local moved, why = vana.gameui.move('target_window', 88, 70)   -- middle 88% across, top 70% down\n    if not moved then\n        vana.log('minparty: the Target window stays where it is (' .. tostring(why) .. ')')\n    end\n    vana.gameui.add('config_menu', 'Party', toggle)\nend)\n-- no unload handler needed: VanaCore puts everything back\n```\n\nOne example per task is in [examples](examples/README.md): hide the chat, add a button, hide the party list (from an\nAshita addon too), move a window, replace a menu item, catch the Equipment item and open your own window.\n\n## Triggers: `on`, `catch` and `off`\n\nEverything the player does in any of the game's menus goes from the menu's window to its handler as an event and the\nitem under the cursor: select, cancel, the cursor moving, the menu key. VanaCore hooks that one hand-over (it covers\nthe keyboard, the controller and the mouse), so an addon can hear any of it, in any menu, and keep it from the game:\n\n```lua\n-- hear it; the game acts as well\nlocal id = vana.gameui.on(menu, event[, items], fn)\n-- hear it, and the game's own action doesn't happen\nlocal id = vana.gameui.catch(menu, event[, items], fn)\nvana.gameui.off(id)\n```\n\n| Argument | What |\n|----------|------|\n| `menu` | A window's name as `menu_open` gives it (`'menuwind'`, `'prty1'`, `'inventor'`), an alias (`'main_menu'`: both pages of the main menu, `menuwind` and `socialme`; `'party_menu'`: `prty1`; `'config_menu'`: `configwi`), `'*'` for every menu, or a list of those. `e.menu` is the window's own name, never the alias |\n| `event` | `'select'`, `'cancel'`, `'up'`, `'down'`, `'left'`, `'right'`, `'menu'` (the menu key while a menu is up), `'*'` for every one, or the game's number |\n| `items` | An item id, a name VanaCore knows, or a list of them: the trigger is for those items only. Left out: every item |\n| `fn` | Always last. `fn(e)`, at the next frame: `e.menu`, `e.event` (the event's name, or the game's number for one without a name), `e.key` (the number), `e.item` (the item's id), `e.name` (its name when VanaCore knows it, else `''`), `e.caught` (the game's action was kept from it, by your catch or another addon's) |\n\n`catch` is what a custom equipment screen wants: the player picks Equipment in the main menu, your window opens, the\ngame's doesn't. The game's window has already moved its cursor, marked the item and played the select sound when the\nevent is caught, so it looks as the game's own choice does; only the handler's action is left out.\n\n```lua\nvana.gameui.catch('main_menu', 'select', 'equipment', function (e)\n    open_my_equipment()          -- e.name is 'equipment', e.item 2, e.menu 'menuwind'\nend)\n\nvana.gameui.on('*', 'select', function (e)   -- every choice in every menu, for finding items' ids\n    print(('%s: item %d%s'):format(e.menu, e.item, e.name ~= '' and ' (' .. e.name .. ')' or ''))\nend)\n```\n\nThe items VanaCore knows by name:\n\n| Menu | Items |\n|------|-------|\n| `menuwind` (main menu, page 1) | 1 `status`, 2 `equipment`, 3 `magic`, 4 `items`, 5 `abilities`, 6 `party`, 7 `trade`, 8 `search`, 9 `linkshell`, 10 `synthesis`, 11 `region_info`, 12 `map` |\n| `socialme` (main menu, page 2) | 1 `missions`, 2 `quests`, 3 `key_items`, 4 `view_house`, 5 `set_bazaar`, 6 `macro_palette`, 7 `config`, 8 `help_desk`, 9 `communication`, 10 `current_time`, 11 `shut_down`, 12 `log_out` |\n| `prty1` (Party list) | 1 `seek_party`, 2 `find_member`, 3 `request`, 4 `view_request`, 5 `autogroup`, 6 `languages`, 7 `alarm_type` |\n\nWith the player's **Single main menu** on, page 2's items are `menuwind`'s 16 to 27 and keep page 2's names, so\n`'main_menu'` with a name catches either way. Any other menu's items go by id: `vana.gameui.on('*', 'select', ...)`\nprints them as you use the menu, and `menu_open` names the windows.\n\nA trigger lasts until `off(id)` or the addon unloads (`/addon reload` included: set them in your `load` handler).\nSeveral addons can hear the same event; one catch is enough for the game's action to be left out, and every listener's\n`e.caught` says so. Triggers don't fire for the windows VanaCore draws itself (ImGui) nor for the chat line: only for\nthe game's menus. How the hook works is in [16. The character, the menus and the game's tables](16-character-menus-and-tables.md#2-menu-triggers).\n\n## The player's side\n\n- The addon's README says what it changes. The /vana window shows it on the Addons page.\n- Each addon button in the Config list has a help line saying which addon it's from.\n- To undo it: unload the addon. Everything it changed is put back at once.\n\n## What this is not\n\nIt's not a sandbox. Addons have `vana.memory.write`, Lua's `io` and LuaJIT's `ffi`, so they can patch the game any way\nthey like. What this gives is one place that does the changing (so two addons don't each patch the party list; `move`\nand `replace` have one holder, `hide` is shared), everything put back when the addon goes, even after a crash, and an\neasy way that is also the safe way.\n\n## For VanaCore's own code\n\n| File | What |\n|------|------|\n| `src/core/gameui.hpp`, `gameui.cpp` | The element list (`kKnown`), what each loaded addon has asked for, and what the hooks call (`skip`, `hidden`, `placed`, `config_items`, `replaced`) |\n| `src/core/lua_api.cpp` | `vana.gameui`'s native half (`open_gameui`): `hide`, `move`, `elements`, and the `native_add` / `native_replace` that `vana.lua` wraps |\n| `src/core/lua/vana.lua` | `add`, `remove`, `replace`, `restore`, `show`: keeps the addon's functions and calls them on the `gameui_button` and `gameui_replaced` events |\n| `src/core/addons.cpp` | `gameui::attach` when an addon loads (before its file runs), `gameui::release` in `remove()`, the two events queued for one addon at the next frame |\n| `src/core/chat.cpp`, `targetwin.cpp`, `partymenu.cpp`, `configmenu.cpp` | The hooks that ask gameui: the window draw skip, the chat log and line, the Target window's place, Find Member, the Config list's items |\n| `src/core/gamewin.hpp`, `gamewin.cpp` | `window`, `windows`, `press`: the menu manager's windows read, their buttons' labels from the game's letter sprites, each window's draw kept (or drawn into nothing for `hide(window)`, `vanacore_gfx_drop_draws`), the game's SetCursol and key input |\n| `src/core/lua_gamewin.cpp` | Their Lua half; `chatfont.cpp`'s letter printer hook and `itemslot.cpp`'s quad hook hand gamewin what a window draws, `menuhover.cpp` keeps the mouse off a hidden window |\n\nAdding an element: `hide` for any game window with a layout name is one line in `kKnown`; `move` needs the module\nthat places the window to ask `gameui::placed()` (three lines, as `targetwin.cpp` does); `add` and `replace` need that\nmenu's handler hooked. Then add it to the table above.\n", "docs/08-settings-and-files.md": "# 8. Settings and files\n\nHow an addon keeps its settings and other files: `vana.settings` for settings tables (per character or shared),\n`vana.json` for JSON, `vana.fs` and `vana.paths` for files and folders, and `vana.config` for VanaCore's own settings\nfile, `vanacore.ini`.\n\n## Where files go\n\nEverything lives under `settings\\` in VanaCore's folder (`vana.paths.install`), keyed on the addon's name as its\nfolder spells it (`Sidekick`, not `sidekick`):\n\n```\nsettings\\addons\\<Addon>\\settings.json               scope 'global': the same for every character\nsettings\\addons\\<Addon>\\<Character>\\settings.json  scope 'character': the character logged in\nsettings\\addons\\<Addon>\\<any other file>            vana.settings.write, global\nsettings\\addons\\<Addon>\\<Character>\\<any file>      vana.settings.write, per character\n```\n\nA character's folder is the character's name (letters, digits, `_` and `-` kept; the server id if nothing is left).\nThe launcher treats `settings\\` as the player's: a verify never replaces anything in it, and VanaCore backups include\nit.\n\nAshita addons that use Ashita's own `settings` library keep writing to `config\\addons\\<addon>\\<name>_<id>\\`. That is\nunchanged. Any addon can call `vana.settings`, whatever its kind.\n\n## Quick start\n\n```lua\naddon.name    = 'Sidekick'\naddon.author  = 'Seekey'\naddon.version = '3.0'\n\n-- Shared by every character: settings\\addons\\Sidekick\\settings.json\nlocal config = vana.settings.register({\n    defaults = { scale = 1, window = { x = 100, y = 200 } },\n})\n\n-- This character's: settings\\addons\\Sidekick\\<Character>\\favorites.json\nlocal favorites = vana.settings.register({\n    name     = 'favorites',\n    scope    = 'character',\n    defaults = { zones = {} },\n    changed  = function (data) print('favourites for ' .. (vana.settings.character() or 'nobody')) end,\n})\n\nvana.on('command', function (e)\n    local scale = e.command:match('^/sidekick scale (%d+%.?%d*)$')\n    if scale then\n        config.data.scale = tonumber(scale)\n        config:save()\n        return true\n    end\nend)\n\n-- Favourites keyed by zone id: whole-number keys come back as numbers\nfavorites.data.zones[230] = 'Ru\\'Lude Gardens'\n```\n\n`store.data` is a plain table: read it and change it directly. `save()` writes it now. Changes are also saved when the\naddon unloads or the game closes, and before a character switch, so a forgotten `save()` doesn't lose them.\n\n## Stores\n\n### `vana.settings.register(options)` → store\n\n| Option | Default | Meaning |\n|--------|---------|---------|\n| `name` | `'settings'` | The file: `<name>.json`. A plain name: no folders, no `.json` |\n| `scope` | `'global'` | `'global'` or `'character'` |\n| `defaults` | `{}` | What a new file starts with, and what an existing file lacks is filled in from. Must be something JSON can hold |\n| `changed` | none | `function (data, store)`, called when a per-character store's data is swapped: a character logs in, another takes over, or a logout puts the defaults back |\n\nAn option that's wrong raises an error at the call: a name with a folder or `.json`, an unknown scope, defaults with a\nfunction in them, or the same name and scope registered twice (keep the store it returned).\n\n### The store\n\n| | |\n|---|---|\n| `store.data` | The settings. The same table for the store's whole life: after a reload or a character switch its contents change, not the table, so `local config = store.data` stays good. Tables inside it are replaced, though, so don't hold on to those across a switch |\n| `store:save()` | Writes the file now. `true`, or `nil` and why: no character in yet (per-character), the file can't be written, or it's being held (below) |\n| `store:reload()` | Reads the file again and returns `store.data`. Use it after editing the file by hand while the game runs. What wasn't saved is lost |\n| `store:reset()` | The defaults again, saved. `true`, or `nil` and why |\n| `store:path()` | The file it reads and writes now, or `nil` for a per-character store with no character in |\n| `store.ready` | `true` when the store has a file: always for a global store, while a character is in for a per-character one |\n| `store.name`, `store.scope`, `store.defaults` | As registered (`defaults` is a copy) |\n\n## What happens when\n\n**Registering.** The store's file is read now. If it isn't there it's written from the defaults, so the player can find\nand edit it. If it lacks some of the defaults (a setting added in a new version), they're filled in: tables key by key,\nbut a list from the file is taken as it is, not merged with the default list. A file that then differs from what\nVanaCore would write is written again, so the file on disk always matches `store.data` after loading.\n\n**Before a character is in** (the title screen, the character select): a per-character store holds its defaults,\n`store.ready` is false, `store:path()` is nil, and `store:save()` returns `nil, 'no character is logged in'`. Global\nstores work as normal.\n\n**A character logs in.** Once a per-character store exists, the character is looked at twice a second\n(`vana.game.character()`). When one comes in, each per-character store reads that character's file and `changed` is\ncalled.\n\n**Another character, or a logout.** First each per-character store saves what changed to the character it was read\nfor. Then it reads the new character's file, or goes back to its defaults at a logout, and `changed` is called.\n\n**The addon unloads** (`/addon unload`, `/addon reload`, the game closing). After the addon's own `unload` handlers,\neach store that changed since it was last read or written is saved. That includes changes the `unload` handlers made.\n\n**Nothing changed.** A store whose data is what was last read or written isn't written at unload or a switch. So if the\nplayer edits the file by hand while the game runs, and the addon doesn't touch that store, the edit survives. To take\nit up without a restart, call `store:reload()`.\n\n**A file that isn't JSON** (a bad hand edit). A copy is kept beside it as `<name>.json.broken`, a line in the chat says\nso, the defaults are used, and the file is written again from them. If even the copy can't be written, the file is left\nexactly as it is and the store refuses to save over it (`save()` returns `nil` and why) until a `store:reload()` that\ncan keep the copy.\n\n**Writing.** Every write goes through `vana.fs.write`: `<file>.tmp` beside the file, swapped in, so a write cut short\n(the game closing, a full disk) leaves the old file whole. If another program holds the file open, or the folder is\nread-only, the write fails and says so (`can't write <path> (Windows error 32)`).\n\n## JSON: `vana.json`\n\n```lua\nlocal text, why = vana.json.encode(value)   -- the text, or nil and what can't be written (and where: value.window.f)\nlocal value, why = vana.json.decode(text)   -- the value, or nil and where the text went wrong (line 3: unexpected x)\nlocal line = vana.json.encode(value, true)  -- compact: one line, no indents (what a web request sends)\n```\n\n- **Written for people.** Keys sorted, whole-number keys first; two-space indents; a newline at the end. A file reads\n  and diffs the same from save to save.\n- **Lists and objects.** A table whose keys are 1 to n with none missing is a JSON list; any other table is an object.\n  An empty table is `{}`.\n- **Number keys.** Keys written as whole numbers (`\"230\"`, `\"-1\"`, `\"0\"`; not `\"07\"` or `\"1.5\"`) are read back as\n  numbers, so a table keyed by zone or item id round-trips. The flip side: a text key that looks like a whole number\n  comes back as the number.\n- **`null`** is read as `nil`: a key with `null` isn't there, and a list with `null` in it has a hole.\n- **Not allowed:** functions, userdata, threads, `true`/`false` or table keys, NaN or infinity, a table that holds\n  itself. Refused with an error, not written as something else.\n- **Numbers.** Whole numbers exact up to 2^53. Fractions with 14 significant digits when that reads back exactly, else\n  17, so `0.1` stays `0.1`.\n- A UTF-8 byte order mark at the start of a file is skipped. Text is written as UTF-8, as it was given.\n\n## Other files in the settings folder\n\nFor files that aren't a settings table (an XML layout, a CSV export, a cache), in the same folders:\n\n| | |\n|---|---|\n| `vana.settings.write(file, text[, scope])` | Writes `text`, making the folders it needs, whole or not at all. `true`, or `nil` and why |\n| `vana.settings.read(file[, scope])` | The file's text, or `nil` and why (`'<file> isn't there'`, no character) |\n| `vana.settings.exists(file[, scope])` | `true` or `false` |\n| `vana.settings.remove(file[, scope])` | Deletes a file (or an empty folder). `true`, or `nil` and why |\n| `vana.settings.list([scope])` | The names of the files in the folder (not subfolders), `{}` if it isn't there yet, or `nil` and why |\n| `vana.settings.path(file[, scope])` | Where `file` is, whether or not it's there, or `nil` and why |\n| `vana.settings.folder([scope])` | The folder itself, or `nil` and why |\n| `vana.settings.character()` | The logged in character's folder name, or `nil` |\n\n`scope` is `'global'` (the default) or `'character'`. With `'character'` and no character in, each returns\n`nil, 'no character is logged in'`.\n\n`file` is a path under the folder, with subfolders if you like (`'layouts/war.xml'`, `/` or `\\`). Refused, with the\nreason returned: a drive or a full path, `.` or `..`, Windows' reserved names (`con`, `nul`, `com1`, ...), the characters\n`< > : \" | ? *` and control characters, a name ending in a dot or a space.\n\n```lua\nlocal ok, why = vana.settings.write('layouts/' .. job .. '.xml', xml, 'character')\nif not ok then\n    print('Sidekick: layout not saved: ' .. why)\nend\n```\n\n## Coming from Ashita's `settings` library\n\n| Ashita (`require('settings')`) | VanaCore |\n|---|---|\n| `settings.load(defaults)` | `vana.settings.register({ scope = 'character', defaults = defaults })`, then `store.data` |\n| `settings.load(defaults, 'alias')` | `register({ name = 'alias', scope = 'character', defaults = ... })` |\n| `settings.save()` | `store:save()` |\n| `settings.reset()` | `store:reset()` |\n| `settings.register('settings', 'key', fn)` | `register({ ..., changed = fn })` |\n| `config\\addons\\<addon>\\<name>_<id>\\settings.lua` | `settings\\addons\\<Addon>\\<Character>\\settings.json` |\n\nAshita's library has no global scope; here it's the default. Its files are Lua; these are JSON, so they can't hold\nfunctions. Nothing moves an addon's existing `config\\addons` files across: an addon that wants to keep them can read the\nold file once with `io.open` and save it into its store.\n\n## Files anywhere: `vana.fs` and `vana.paths`\n\nLua's `io` library works as usual. `vana.fs` adds what it lacks:\n\n```lua\nvana.fs.exists(path)              -- true if the file or folder is there\nvana.fs.is_dir(path)              -- true if it's a folder\nvana.fs.create_dir(path)          -- the folder and any missing parents; true if it exists afterwards\nvana.fs.remove(path)              -- a file, or an empty folder; true if removed\nvana.fs.write(path, data)         -- whole or not at all (<path>.tmp swapped in); true, or nil and why\nvana.fs.list(folder[, filter[, which]])\n```\n\n`list` returns names (not paths), or `nil` and a message. `filter` is a regular expression for the whole name (empty\nfor all), matched without regard to case; `which` is `'files'` or `'folders'`, or a table\n`{ which = 'files', deep = true, case = true }` (`deep`: every subfolder's entries too, as paths from `folder`; `case`:\nthe filter matches case).\n\n```lua\nfor _, name in ipairs(vana.fs.list(addon.path .. '\\\\profiles', '.*\\\\.lua') or {}) do\n    print(name)\nend\n```\n\nPaths are in the ANSI code page, as Lua's `io` library uses. The folders you'll want:\n\n| | |\n|---|---|\n| `vana.paths.install` | VanaCore's folder (where `VanaCore.exe` is) |\n| `vana.paths.addons` | `<install>\\addons` |\n| `vana.paths.addon` | Your addon's folder |\n| `vana.paths.game` | The game's own folder (`FFXiMain.dll`, `FTABLE.DAT` and the ROMs), `''` before the game is loaded |\n\nNone ends in a backslash.\n\n## VanaCore's own settings: `vana.config`\n\n`vanacore.ini` holds VanaCore's settings (renderer, effects, window, the game's own `[ffxi]` settings, and so on).\nAddons can read and write it:\n\n```lua\nvana.config.get(section, key[, default])   -- the value as text (UTF-8), or `default` (nil) if the key isn't set\nvana.config.set(section, key, value)       -- writes it (value as text; nil removes the key); true if written\nvana.config.game(name)                     -- the game's own setting as the ini hands it to the game ('0001', 'padmode000'), or nil\nvana.config.reload()                       -- takes the file up now (below); true if it was\nvana.config.info()                         -- { upstream, changed, file }\n```\n\nEvery key is optional: what the file hasn't is VanaCore's default, so `get` returns `nil` for a default. The `[client]`,\n`[graphics]` and other sections and keys are listed in the VanaCore README.\n\n**How a change reaches the running game.** The game works from a copy of the settings file made at start. A `set`\ngoes to the copy at once and to the file three seconds later, and what reads the setting sees it at the next frame.\nGraphics settings apply at once after `vana.graphics.reload()`. A change made to the **file** by something else (an\neditor, the launcher) isn't taken up by the running game unless `[client] ini.upstream=1` is set, `vana.config.reload()`\nis called, or the game restarts; `vana.config.info().changed` is true while the file holds something the game hasn't\ntaken up, and `.file` names the file (the launcher gives each account its own, `vanacore.<hash>.ini`).\n\n`vana.config` is for VanaCore's settings. Your own settings belong in `vana.settings`.\n", "docs/09-input.md": "# 9. Input\n\nKey binds, key and mouse events, the game's DirectInput keyboard, and controllers.\n\n## Key binds: `vana.binds`\n\nA bind runs a command when a key is pressed, and the game doesn't see the key. The player makes them with `/bind` (or\nthe keybinds window, `/keybinds`); an addon can too:\n\n```lua\nvana.binds.add(spec, command[, up])   -- /bind without a word in the chat log; true, or nil and why\nvana.binds.remove(spec[, up])         -- /unbind; true if one was bound\nvana.binds.remove(bind)               -- with an entry from list()\nvana.binds.list()                     -- every bind, in the order made\nvana.binds.base()                     -- the binds boot.txt and the addons made, as list() gives them; nil until they have\nvana.binds.keys()                     -- the key names /bind takes\n```\n\n`spec` is the key as `/bind` takes it: modifiers, then the key's name.\n\n| Prefix | Modifier |\n|--------|----------|\n| `^` | Ctrl |\n| `!` | Alt |\n| `@` | Windows key |\n| `#` | Apps (menu) key |\n| `+` or `~` | Shift |\n| `%` | Only while the chat line is closed |\n| `$` | Only while the chat line is open |\n\nKey names: `a` to `z`, `0` to `9`, `f1` to `f24`, `numpad0` to `numpad9`, `up`, `down`, `left`, `right`, `insert`,\n`delete`, `home`, `end`, `pageup`, `pagedown`, `return`, `space`, `escape`, `tab`, `backspace`, and the rest\n`vana.binds.keys()` lists. `up` true binds the key's release.\n\nThe mouse's buttons bind the same way: `lbutton`, `rbutton`, `mbutton`, `xbutton1` and `xbutton2` (the side buttons:\n`mouseback` and `mouseforward` too), or `mouse1` to `mouse5`. So does its wheel: `wheelup`, `wheeldown`, and `wheelleft`\nand `wheelright` for a wheel that tilts. A bound button's press and release don't reach the game, nor a bound wheel's\nturn. A wheel bind runs once a notch (a high-resolution wheel's smaller turns add up), as a press and a release, so a\nbind made with `up` runs too; a tilt held runs it again each time the mouse repeats it. A click or wheel turn on\nVanaCore's windows (or one a plugin or addon takes) is theirs, not a bind's. `^mbutton` is Ctrl + the middle button; a\nplain `lbutton` or `rbutton` bind takes every click of that button over the game, and a plain `wheelup` or `wheeldown`\nthe camera's zoom.\n\nWindows knows five mouse buttons. A gaming mouse's further buttons (a side panel's, the G keys) reach the game as the\nkeys the mouse's own software gives them (Logitech G Hub, Razer Synapse, ...): give them keys no keyboard has, `f13` to\n`f24`, and bind those, so the keyboard's own keys stay free (a Naga's side buttons are the number row until changed).\n\n```lua\nvana.binds.add('^!f1', '/greeter toggle')      -- Ctrl+Alt+F1 runs the addon's command\nvana.binds.add('$return', '/greeter send', false)\n```\n\nEach entry of `list()`: `{ key = 'F6', vk, spec = '^f6', command, up, when = 'always' | 'closed' | 'open', ctrl, alt,\nshift, win, apps, fired_ago }` (`fired_ago` seconds since it ran; -1 never).\n\nBinds the player makes are saved by the keybinds window to `scripts\\keybinds.txt`. Binds your addon adds aren't saved\nanywhere: add them at `load`, and remove them at `unload` if the addon shouldn't leave them behind.\n\n### \"Press a key\"\n\nFor a settings window that asks the player to press the key they want:\n\n```lua\nvana.binds.capture_begin()     -- the next key pressed is captured, not acted on\nlocal c = vana.binds.capture() -- { active, done, cancelled, key = 'F6', vk, ctrl, alt, shift, win, apps }\nvana.binds.capture_end()\n```\n\nPoll `capture()` each frame: `done` with `key` set once a key was pressed, `cancelled` on Escape; the modifier fields\nfollow what's held until then. A mouse button pressed, or the wheel turned or tilted, over the game is captured too\n(`key = 'mbutton'`, `'xbutton1'`, `'wheelleft'`, ...), over your window as anywhere; left, right and the wheel's turns\nup and down only with a modifier held, so a plain click or scroll still works your window.\n\nWhile the chat line is open, binds wait (`[input] keyboard.blockbindsduringinput`, on by default), unless made with\n`$`.\n\n## Key presses: the `key` event\n\nThe game window's key messages, as they arrive. Positional arguments, not a table:\n\n```lua\nvana.on('key', function (wparam, lparam, blocked)\n    local up = bit.band(lparam, 0x80000000) ~= 0\n    local repeated = bit.band(lparam, 0x40000000) ~= 0 and not up\n    if wparam == 0x79 and not up and not repeated then   -- F10 pressed\n        toggle()\n        return true   -- the game doesn't get it\n    end\nend)\n```\n\n`wparam` is the Windows virtual-key code (`0x41` A, `0x70` F1, `0x1B` Escape, ...), `lparam` Windows': bit 31 set for\na release, bit 30 for a repeat. `blocked` is true when a plugin or an earlier addon took it; return `true` to take it.\n\nWhile the player is typing in the chat line, Ashita and Windower addons get no presses (releases still). VanaCore\naddons do, so check `vana.game.world().chat_open` before acting on a plain letter.\n\nHeld modifiers aren't in the event: ask Windows through the FFI (`GetAsyncKeyState`), as the sendkey addon does, or\nuse a bind.\n\n## The game's keyboard: `key_state` and `key_data`\n\nThe game reads its keyboard through DirectInput, once a frame. Two events sit on that read:\n\n```lua\nvana.on('key_state', function (e)\n    -- e.data: 256 bytes, the state of every key by DirectInput key code (0x80 set while down)\n    -- e.data_raw: where they are, a pointer: write through it to change what the game reads\n    -- e.size: 256\n    if hold_escape then\n        ffi.cast('uint8_t*', e.data_raw)[0x01] = 0x80   -- DIK_ESCAPE held\n    end\nend)\n\nvana.on('key_data', function (e)\n    -- each buffered key event: e.key (the DIK code), e.down, e.injected, e.blocked\n    return e.key == 0x3B   -- true: the game doesn't get F1\nend)\n```\n\nUse these to make the game see a key it didn't get, or to\nhide one from the game at the DirectInput level. For ordinary hotkeys, the `key` event or a bind is simpler.\n\nDirectInput key codes (DIK): `0x01` Escape, `0x02` to `0x0B` the digits 1 to 0, `0x0F` Tab, `0x1C` Return, `0x1D` left\nCtrl, `0x2A` left Shift, `0x38` left Alt, `0x39` Space, `0x3B` to `0x44` F1 to F10, `0x57` F11, `0x58` F12, `0xC8`\nUp, `0xD0` Down, `0xCB` Left, `0xCD` Right.\n\n## The mouse: the `mouse` event\n\nPositional arguments:\n\n```lua\nvana.on('mouse', function (type, x, y, delta, blocked, modifiers)\n    if type == 1 and not blocked and inside(x, y) then   -- left button down on my thing\n        return true   -- the game doesn't get it\n    end\nend)\n```\n\n| Argument | Meaning |\n|----------|---------|\n| `type` | The Windows message less `0x200`: 0 move, 1 left down, 2 left up, 4 right down, 5 right up, 7 middle down, 8 middle up, 10 wheel |\n| `x`, `y` | In VanaCore's interface pixels (`vana.ui.screen()`'s). Ashita addons get the game's pixels instead |\n| `delta` | The wheel's turn, 120 a notch (0 otherwise) |\n| `blocked` | A plugin, an earlier addon, or an ImGui window took it |\n| `modifiers` | Keys held: 1 Shift, 2 Ctrl, 4 Alt |\n\nA press or wheel over an ImGui window is ImGui's alone: you hear it with `blocked` true (an Ashita addon only hears it\nfor its own window). What an addon takes, the game doesn't get through its messages or DirectInput either, so a click\ntaken by an addon doesn't turn the camera.\n\nTo block the game's mouse while over your own drawing without handling the event, set `block_mouse = true` on a\n`vana.ui` box. To block every button for a moment (a modal of your own):\n\n```lua\nvana.window.block_mouse(true)          -- no mouse button reaches the game while on, and half a second after\nvana.window.block_mouse(false)\nlocal blocked = vana.window.block_mouse()   -- true while it's blocked\n```\n\n## Controllers\n\n### Events\n\n```lua\nvana.on('xinput_button', function (e)\n    -- e.button: the control (table below); e.state: 0 or 1 for a button, 0-255 for a trigger\n    -- e.injected: VanaCore or an addon pressed it; e.blocked\n    if e.button == 9 and e.state ~= 0 then   -- RB pressed\n        return true   -- the game doesn't see it\n    end\nend)\n\nvana.on('dinput_button', function (e)\n    -- e.button: the DirectInput data offset; buttons are 48 + n (n from 0); e.state: 0x80 while down\nend)\n\nvana.on('xinput_state', function (e)\n    -- each XInputGetState read: e.user (0-3), e.state (a pointer to the XINPUT_STATE the game is about to read);\n    -- e.state_modified is the same pointer (the name Ashita 4.30 addons write their changes to)\n    local state = ffi.cast('XINPUT_STATE*', e.state)   -- with your own cdef; change it in place\nend)\n```\n\nA handler may change `e.button` and `e.state` in place, to remap a button. XInput controls use Ashita's numbering:\n\n| Number | Control | Number | Control |\n|--------|---------|--------|---------|\n| 0 | D-pad up | 8 | LB (L1) |\n| 1 | D-pad down | 9 | RB (R1) |\n| 2 | D-pad left | 12 | A (Cross) |\n| 3 | D-pad right | 13 | B (Circle) |\n| 4 | Start (Options) | 14 | X (Square) |\n| 5 | Back (Share) | 15 | Y (Triangle) |\n| 6 | Left stick click (L3) | 16 | LT (L2), state 0-255 |\n| 7 | Right stick click (R3) | 17 | RT (R2), state 0-255 |\n\nThe sendkey addon (`addons\\vanacore\\sendkey`) is a worked example: it binds a controller button to a key sent to\nWindows for Discord's push to talk.\n\n### `vana.gamepad`\n\n```lua\nlocal controllers, xinput, xinput_reading = vana.gamepad.list([refresh])\n-- controllers: { { guid, name, product, type, opened, reading, xinput }, ... } DirectInput's (guid: what the game saves\n--   as padguid000; opened: the game made a device for it this session; reading: the game reads it now, through\n--   DirectInput; xinput: an XInput controller)\n-- xinput: { connected0, connected1, connected2, connected3 }; xinput_reading: the slots the game reads a pad from now\nvana.gamepad.game()              -- { known, on, xinput }: the game's gamepad switch and XInput switch as they are now\nvana.gamepad.select(guid)        -- the game uses that controller now; true, or false and why\nvana.gamepad.apply({ mode = , buttons = , buttons_ex = , guid = })   -- the pad's settings as vanacore.ini's [ffxi] has them; fields left out stay\nvana.gamepad.bindings()          -- { xinput, confirm, cancel, menu, options }: the game's own buttons (-1 unset)\nvana.gamepad.state()             -- { present, idle }: a controller read lately, and seconds since it was used\nvana.gamepad.disable(off)        -- no controller works while `off` (not saved)\nvana.gamepad.disabled()          -- true while none works\nvana.gamepad.nav(on)             -- your ImGui window has the controller for the next frame (say so each frame)\n```\n\n`vana.gamepad.nav(true)` each frame while your window is open lets ImGui navigate it with the pad, and the game reads\nthe controller at rest meanwhile.\n\n## Is the game in front?\n\n```lua\nvana.system.focused()   -- true while the game isn't in the background\n```\n", "docs/10-packets.md": "# 10. Packets\n\nEverything the server tells the game, and everything the game tells the server, goes through packets. An addon can\nread each one as it passes, change it, block it, add its own, and ask for the last one of an id.\n\n## The layout\n\nThe game sends and receives buffers, each a 28-byte header followed by packets. Every packet starts with a 4-byte\nheader:\n\n| Bytes | What |\n|-------|------|\n| 0-1 | A 16-bit word: the id in its low 9 bits, the size in 4-byte units in its high 7 |\n| 2-3 | The sequence number |\n| 4 on | The payload |\n\nIncoming and outgoing ids are separate numberings (incoming `0x00A` is the zone-in; outgoing `0x00A` is the login).\nSome you'll meet:\n\n| Incoming | | Outgoing | |\n|----------|-|----------|-|\n| `0x00A` | Zone in (the character's details, the zone) | `0x015` | Player position, every ~400 ms |\n| `0x00B` | Zone out | `0x01A` | An action (attack, cast, ability, item) |\n| `0x00D` | A player's update | `0x05B` | An event's option (menus, home points) |\n| `0x00E` | An NPC's update | `0x0B5` | A chat line |\n| `0x017` | A chat message | | |\n| `0x01B` | Job info | | |\n| `0x028` | An action (the battle log's source) | | |\n| `0x029` | An action message | | |\n| `0x037` | The player's update: buffs, status | | |\n| `0x0DD` | A party member's update | | |\n| `0x0DF` | The character's HP, MP, TP | | |\n\nThe community's packet documentation (Windower's `packets` library, Ashita's `packets` docs) describes the fields of\neach. Windower's library is in `addons\\windower\\libs\\packets` when Windower addons are installed.\n\n## Reading packets: `packet_in` and `packet_out`\n\n```lua\nvana.on('packet_in', function (e)\n    if e.id == 0x00A then\n        local zone = e.data:byte(0x31) + e.data:byte(0x32) * 256   -- bytes 0x30-0x31, 1-based for string.byte\n        print('Zoning into', zone)\n    end\nend)\n```\n\n| `e` field | What |\n|-----------|------|\n| `id` | The packet id |\n| `size` | Its length in bytes |\n| `data` | The packet as a string, header first, as the game received (or built) it |\n| `data_raw` | The same bytes, a pointer for the FFI |\n| `data_modified` | What the game will get (or send): assign a new string to change it |\n| `data_modified_raw` | A pointer to those bytes: write through it with the FFI |\n| `chunk_size`, `chunk_data`, `chunk_data_raw` | The whole buffer the packet came in |\n| `injected` | VanaCore or an addon added it |\n| `blocked` | An earlier handler blocked it |\n\nReturn `true`, or set `e.blocked = true`, to block the packet: the game doesn't get it (incoming) or it isn't sent\n(outgoing). Later addons still see it, with `blocked` true.\n\nTo change a packet, assign a string of the same length to `e.data_modified`, or write through `data_modified_raw`.\nWhat's copied back is at most the packet's size. Changes apply whether or not you block.\n\nReading fields with the FFI is faster than `string.byte` for anything you do often:\n\n```lua\nlocal ffi = require('ffi')\nvana.on('packet_in', function (e)\n    if e.id == 0x0DF then\n        local p = ffi.cast('uint8_t*', e.data_raw)\n        local hp = ffi.cast('uint32_t*', p + 0x08)[0]\n        local mp = ffi.cast('uint32_t*', p + 0x0C)[0]\n    end\nend)\n```\n\nListening for packets costs every packet; keep the handler short and check `e.id` first. An addon that doesn't listen\nisn't called.\n\n## The last packet of an id\n\n```lua\nlocal packet, at = vana.packets.last(incoming, id)   -- the packet as a string, header first (as packet_in's data), and when it came (seconds); nil if none yet\n```\n\n`incoming` true for a packet the game received, false for one it sent. `at` is on `vana.time.clock()`'s scale, each\nlater packet later. So the login's zone-in is always to hand, without listening for it:\n\n```lua\nlocal zone_in = vana.packets.last(true, 0x00A)\n```\n\n## Sending a packet\n\n```lua\nvana.packets.inject(incoming, id, data)\n```\n\nAdds `data` (the whole packet: VanaCore fills in the header's id, size and sequence) to the next buffer the game\nreceives (`incoming` true) or sends. Any thread. An injected packet goes through the other addons' `packet_in` or\n`packet_out` with `e.injected` true; an Ashita addon's own injected packet isn't shown back to it.\n\n```lua\n-- an outgoing event option (0x05B), 32 bytes\nlocal p = string.rep('\\0', 32)\nvana.packets.inject(false, 0x05B, p)\n```\n\nThe game's own outgoing queue, as Ashita's `QueuePacket` has it, for a packet the game should sequence itself:\n\n```lua\nvana.packets.queue(id, length, align, p1, p2, function (pointer)\n    local p = ffi.cast('uint8_t*', pointer)   -- the header's id is set already; fill the rest\n    p[4] = 1\nend)   -- false when the game holds that id back\n```\n\nMind what you send. The server treats an injected packet as the player's. VanaCore doesn't check it, and CatsEyeXI's\nrules on automation apply.\n\n## Zoning\n\nTwo helpers for the moments around a zone change, when the game's own structures are half there:\n\n```lua\nvana.game.zoning()               -- true between the zone-out (0x00B) and the player being back in the world\nvana.game.player_zone(listed)    -- the zone the last zone-in named, until the party list (`listed`) has caught up\n```\n\n`vana.game.world().server_time` is the server's time from its last packets. The `zone_out` and `zone_change` events\n([Events](02-events.md)) are raised from the same packets.\n\n## Which addons see what\n\nPlugins see each packet first (Ashita's `HandleIncomingPacket`), then addons in load order. An Ashita addon's own\ninjected packet is skipped for that addon, as Ashita does. The MCP server's `packets` tool shows the last 4,000 each\nway for debugging ([Developing and debugging](14-dev-workflow.md)).\n", "docs/11-memory-and-ffi.md": "# 11. Memory and FFI\n\nFor what `vana.game` doesn't hand you: reading and writing the game's memory directly, finding code and data by\npattern, patching, and calling the game's own functions with LuaJIT's FFI. Everything here can crash the game if used\nwrongly; the sections at the end say what VanaCore does about that.\n\nBefore reaching for this, check [Game data](04-game-data.md) and [Packets](10-packets.md): most of what addons want is\nthere already, kept right as the game changes.\n\n## Reading and writing: `vana.memory`\n\nAddresses are plain Lua numbers.\n\n```lua\nvana.memory.read_uint8(address)    -- also int8, int16, uint16, int32, uint32, int64, uint64, float, double\nvana.memory.read_string(address[, size])   -- up to `size` bytes (1024), stopping at a NUL\nvana.memory.read_bytes(address, size)      -- `size` bytes as a string, NULs and all; nil if unreadable\nvana.memory.read_array(address, size)      -- a table of `size` byte values (1-based); nil if unreadable\n\nvana.memory.write_uint8(address, value)    -- the same set of types; true if written\nvana.memory.write_string(address, text)    -- the text and a NUL after it\nvana.memory.write_array(address, bytes)    -- a table of byte values\n```\n\nA read of memory that isn't readable returns `0` (or `nil` for `read_bytes` and `read_array`), never a crash. A write\nto a page that isn't writable (code, constants) makes it writable for the write and puts the protection back, and\nflushes the instruction cache, so patching code is one call.\n\n## Finding things\n\n```lua\nlocal base, size = vana.memory.module('FFXiMain.dll')   -- a loaded module's base address and size; nil if not loaded\nlocal base, size = vana.memory.module()                 -- the game's own exe\n\nvana.memory.find(module, size, pattern[, offset[, count]])\n```\n\n`find` scans for a byte pattern: hex bytes, two digits each, spaces optional, `??` (or `?`) for any byte:\n`'8B 44 24 04 8B 0D ?? ?? ?? ??'`. The first argument is a module name (then `size` 0 means the whole module) or a start\naddress with `size` bytes to scan. It returns the address of the `count`th match (0 the first) plus `offset`, or `0`.\n\n```lua\nlocal at = vana.memory.find('FFXiMain.dll', 0, '8B 0D ?? ?? ?? ?? 85 C9 74', 2)\nif at ~= 0 then\n    local pointer = vana.memory.read_uint32(at)   -- the 4 bytes after 8B 0D: the address the instruction reads\n    local value = vana.memory.read_uint32(pointer)\nend\n```\n\n**FFXiMain.dll moves.** Its base address differs from run to run, so an address from a disassembly (Ghidra's base is\n`0x10000000`) is an offset: `base + (ghidra_address - 0x10000000)`. A pattern is sturdier than an offset: it survives a\nclient update that shifts code, and that's how VanaCore finds everything it uses.\n\nThe game's structures VanaCore has already found are reachable without a pattern: `vana.game` reads them, and the MCP\nserver's `game_state` tool reports their addresses.\n\n## Allocating and protecting\n\n```lua\nlocal p = vana.memory.alloc(size)          -- zeroed, readable and writable memory, or 0\nvana.memory.free(p)                        -- true if freed (freeing twice is harmless)\nvana.memory.protect(address, size, protection)   -- VirtualProtect: the old protection, or nil\nvana.memory.unprotect(address, size)       -- readable, writable and executable; true if it worked\n```\n\n## Patching code: `vana.memory.assembler`\n\nx86 assembly text, as Ashita 4.30's `ashita.memory.assembler` reads it:\n\n```lua\nlocal code, err = vana.memory.assembler.assemble(text[, base])   -- the bytes as a string, encoded to run at `base` (0); nil and the error\nlocal cave, err = vana.memory.assembler.cave(text)               -- executable memory holding the assembled text: its address; nil and the error\nvana.memory.assembler.release(cave)                              -- frees a cave; false if it isn't one\nvana.memory.assembler.call(address, target, nops)                -- a call to `target` written at `address`, then `nops` NOPs\nvana.memory.assembler.jmp(address, target, nops)                 -- a jump\nvana.memory.assembler.nop(address, count)                        -- `count` NOPs at `address`\n```\n\nA hook is a cave with your code (ending in a jump back) and a `jmp` written over the game's instruction. Keep the\noriginal bytes (`read_bytes`) and write them back at `unload`: **VanaCore doesn't undo memory patches for you.**\n\n```lua\nlocal site = vana.memory.find('FFXiMain.dll', 0, 'D9 44 24 04 D8 0D ?? ?? ?? ??')\nlocal saved = vana.memory.read_bytes(site, 5)\nvana.memory.assembler.nop(site, 5)            -- skip the instruction\nvana.on('unload', function ()\n    vana.memory.write_array(site, { saved:byte(1, -1) })\nend)\n```\n\n## Calling the game: LuaJIT's FFI\n\n```lua\nlocal ffi = require('ffi')\nffi.cdef [[\n    typedef struct { float x, y, z; } Vec3;\n]]\n```\n\nThe game's functions are called by casting an address to a function pointer. FFXiMain.dll is 32-bit; mind the calling\nconvention (`__thiscall` for methods, `__stdcall` for Windows APIs, `__cdecl` otherwise):\n\n```lua\nlocal base = vana.memory.module('FFXiMain.dll')\nlocal set_target = ffi.cast('int (__thiscall*)(void*, int)', base + 0x123456)\nset_target(this, index)\n```\n\nWindows APIs are there through `ffi.C` after a `cdef`:\n\n```lua\nffi.cdef('unsigned long GetTickCount(void);')\nlocal now = ffi.C.GetTickCount()\n```\n\nPointers VanaCore hands you (`e.data_raw`, `e.data_modified_raw`, `e.state`, `e.vertex_stream_zero_data`) are light\nuserdata: cast them, `ffi.cast('uint8_t*', e.data_raw)`.\n\n### Two LuaJIT things to know\n\n**Ctypes are never freed.** Each `ffi.typeof`, `ffi.cast`, `ffi.new`, `ffi.sizeof` with a *string* declaration parses\nit and may make a new ctype; a state has room for 65,536, and after that every new one fails with `table overflow`.\nParse each declaration once, at the top of your file, and reuse the ctype:\n\n```lua\nlocal u8ptr = ffi.typeof('uint8_t*')\nvana.on('packet_in', function (e)\n    local p = ffi.cast(u8ptr, e.data_raw)   -- no parse per packet\nend)\n```\n\n**Numbers are doubles.** An address or an `ImU32` colour is fine (53 bits), but `bit.*` works on 32 bits and a `uint64`\nneeds the FFI's `ffi.new('uint64_t')` or `ULL` literals.\n\n## When it goes wrong\n\nA hardware exception in your code (an access violation from a bad pointer, a divide by zero) is caught at the boundary\nof the call into your addon. VanaCore reports it in the chat and the log, with where it happened\n(`crashed: access violation reading 0x00000010 at FFXiMain.dll+0x1234 from VanaCore.Core.dll+0x5678 (myaddon.lua:42 in\nupdate)`), and **freezes the addon**: its Lua state is never entered again (its `unload` handlers don't run, and its\nmemory stays allocated until the game ends), because the state's stack is unknown after the fault. Everything it made\nthrough `vana` (boxes, ImGui windows, game interface changes) is removed as usual. Memory you patched stays patched.\n\n`at` is the instruction that faulted; `from` is the code that called it, which is what tells when the fault is in a C\nlibrary routine (`ffi.string` of a bad pointer faults in `strlen`, called from your code). An address with no DLL name is\ncode made as the game runs: LuaJIT's compiled Lua (your FFI call itself) or a hook. The brackets are your Lua, innermost\nfirst; in a loop LuaJIT has compiled they can name where the compiled stretch began (the loop, or the function that\ncalled the one at fault) rather than the line itself. The log has the return addresses further up the stack too.\n\nThe game itself is still running, so a crash in an addon is recoverable: fix the code, `/addon load` it again.\n\nEverything here runs on the game's thread. Don't start threads of your own with the FFI and call `vana` from them.\n\n## Tools for the work\n\n- **The MCP server** (`[mcp] enabled=1`; [Developing and debugging](14-dev-workflow.md)) gives an AI tool, or you\n  through it, memory reads and writes, a disassembler, pattern and reference searches, a value scanner (Cheat Engine's\n  first scan and next scan), hardware watchpoints that don't stop the game, and a Lua console with the FFI. It's the\n  fastest way to find an address before writing the addon.\n- **`/vana lua <addon> <code>`** runs Lua in a loaded addon, so you can try a read before committing it to the file.\n- **Windower's and Ashita's own addons** are a library of found addresses and structure layouts for the same client.\n", "docs/12-system.md": "# 12. System\n\nThe smaller tables: the game window and monitors, the clipboard, sounds and URLs, other VanaCore clients on this PC,\ngraphics information, plugins and other addons, and what's left.\n\n## `vana.system`\n\n```lua\nvana.system.open_url(url)         -- opens http:// or https:// in the default browser; true if it did\nvana.system.play_sound(path)      -- plays a .wav without waiting; true if it started\nvana.system.clipboard()           -- the clipboard's text, Shift-JIS ('' when none)\nvana.system.set_clipboard(text)   -- Shift-JIS text onto the clipboard; true if it did\nvana.system.focused()             -- true while the game isn't in the background\n```\n\n```lua\nvana.system.play_sound(addon.path .. '\\\\sounds\\\\ding.wav')\n```\n\n## `vana.window`\n\n```lua\nlocal w = vana.window.info()   -- nil before the game has a window\n```\n\n| Field | What |\n|-------|------|\n| `x`, `y`, `width`, `height` | The window on the screen (its frame) |\n| `client_width`, `client_height` | The picture's size |\n| `monitor` | Which monitor it's on, 1 the leftmost |\n| `topmost`, `minimized`, `maximized`, `covering` | Its state (`covering`: full screen) |\n| `character` | The character the window's saved position is for (`''` before login) |\n| `monitors` | `[1..n]` left to right, each `{ x, y, width, height, main }` |\n\n```lua\nvana.window.monitor(n)                    -- moves the game to monitor n (full screen: covers it); false if it can't\nvana.window.block_mouse(on[, ms])         -- no mouse button reaches the game while on, and `ms` (400) after; returns whether blocked\nvana.window.block_mouse()                 -- just asks\n```\n\nFor the size VanaCore's interface is drawn in, `vana.ui.screen()` ([Drawing](06-drawing.md)).\n\n## Other game clients on this PC: `vana.clients` and `vana.ipc`\n\nA player running several characters has several VanaCore instances. Two things connect them.\n\n### Who's running\n\n```lua\nfor _, c in ipairs(vana.clients.list()) do\n    -- c.pid, c.name (the character; '' before it's in the world), c.self (this game), c.main (the Main)\nend\nvana.clients.set_main(name)   -- that character is the Main ([characters] main in vanacore.ini); nil or '' for none\nvana.clients.copy()           -- the Main's settings to every other game running; how many, or nil and why\nvana.clients.front(pid)       -- brings that game's window in front (from this game while it's in front); true if it is now\n```\n\n### Talking between them\n\n```lua\nvana.ipc.send(text)   -- to the addon of *your addon's name* in every other instance; false if too long or no shared memory\n\nvana.on('ipc', function (e)\n    -- e.message: what another instance's copy of this addon sent\nend)\n```\n\nA message goes from an addon to the same-named addon in every other VanaCore running in this Windows session, through\nshared memory, read once a frame. At most 8,000 bytes; an instance more than 128 messages behind loses the oldest.\nThis is what Windower's `send_ipc_message` and `ipc message` map onto, so multibox addons (FastFollow, send) work.\n\n```lua\n-- tell the others to follow me\nvana.on('command', function (e)\n    if e.command == '/followme' then\n        vana.ipc.send('follow ' .. select(1, vana.game.character()))\n        return true\n    end\nend)\nvana.on('ipc', function (e)\n    local who = e.message:match('^follow (%S+)$')\n    if who then vana.chat.run('/follow ' .. who) end\nend)\n```\n\n## Graphics: `vana.graphics`\n\n```lua\nlocal g = vana.graphics.info()\n```\n\n| Field | What |\n|-------|------|\n| `renderer` | What `vanacore.ini` asks for: `'d3d8'`, `'d3d9'`, `'d3d11'`, `'d3d12'` |\n| `running` | The one the game draws with (`d3d8` when the one asked for didn't come up) |\n| `active` | True when the game draws through VanaCore's own Direct3D 8 (on 12 or 11) |\n| `effects` | True when VanaCore's scene effects can run |\n| `gpu`, `driver`, `driver_version`, `driver_date`, `driver_installed`, `driver_days` | The graphics card and its driver (`''` with the game's own Direct3D 8) |\n| `dlss`, `framegen`, `fsr`, `upscaler`, `dlss_card`, `dlss5`, `fsr_card`, `*_why`, `dlss_sized`, `stopped` | The upscalers' state |\n| `scene_width`, `scene_height` | The 3D scene's size |\n| `monitor_width`, `monitor_height`, `work_width`, `work_height` | The screen the window is on, and it less the taskbar |\n| `ui_fit_width`, `ui_fit_height` | The menus' size `[ffxi] resolution.ui=window` comes to |\n| `d3d12_unsupported` | The card can't do Direct3D 12 |\n\n```lua\nvana.graphics.reload()      -- applies vanacore.ini's live graphics settings now (after vana.config.set)\nvana.graphics.retry()       -- DLSS or FSR that stopped tried again\nvana.graphics.recompile()   -- the scene effects' shaders compiled again; false without VanaCore's renderer\nvana.graphics.damage_test(kind) -- numbers Van
