pens on the\ntab it was last on.\n\n### Reference\n\nEvery table and function of the API, with what it takes, what it returns and what it does:\n\n- The list is the tables (`vana`, `vana.events` and the events, `vana.tasks`, `vana.game`, ..., and the `addon` table).\n  Click one to open its page; its entries are listed under it.\n- A table's page has the docs page it's from, its notes (the properties `vana.ui`'s boxes take, the elements\n  `vana.gameui` knows, ...) and each entry: its signature, what it does, and for a value its value now (`vana.version`,\n  `vana.paths.*`). **Events** lists every event `vana.on` takes, with what the handler gets.\n- The filter box finds an entry by any word of its name or description.\n- **Try it** puts a call to the function in the Snippets tab's code box, to fill in and Run. **Listen** (an event's\n  entry) puts code there that counts the events and shows what the last one handed its handler; **Stop listening** (or\n  another Run) ends it. The `d3d_*` draw events, `load` and `unload` have no Listen.\n- The descriptions are this series' ([15. API reference](15-api-reference.md), [2. Events](02-events.md)), made into\n  the addon's `reference.lua` by `tools\\gen_apiexplorer_reference.py`. What's listed is read from the running\n  VanaCore's own `vana` table: an entry in red is one the docs name that this VanaCore hasn't (an older one); an entry in\n  purple is one this VanaCore has that the docs don't describe yet. `vana.imgui` lists every ImGui function by ImGui's\n  own names ([6. Drawing](06-drawing.md#whats-there)).\n\n### Snippets\n\nA window in the spirit of Postman: pick a call, **Run** it and read what it returns, with the time it took. Each run\nreplaces the last.\n\n- The calls are in groups: Character, Party and targets, Items, Abilities and spells, World, Widgets (`vana.world`), Game\n  data (`vana.gamedata`), Web requests (`vana.http`, `vana.ws`), Game interface (`vana.gameui`) and Menu triggers. The\n  filter box finds a call by name. **Uses** under a call's name are the reference entries its code uses.\n- The code box is editable: change an index or a slot and run again. **Copy code** and **Copy output** put the text on\n  the clipboard; **Clear** empties the output. **Run every second** watches a value change.\n- A call that returns a promise (Web requests) is waited for while the game goes on: the output says so, then shows what\n  the promise holds, or why it was rejected. A new Run cancels one still waiting.\n- **Widgets** draw boxes in the game's 3D space ([18. Widgets](18-widgets.md)) until **Remove** (or the addon unloads);\n  the world calls need the d3d11 or d3d12 renderer.\n- **Game interface** finds the names `vana.gameui` takes: the elements, the game's windows up now, and **Find a window's\n  name**, which lists each window as you open it until **Stop finding window names**.\n- **Menu triggers** entries are one-shot tests: Run sets the trigger and the output says what to do in the game\n  (open the main menu and pick Equipment, say); when it fires, the output reports what was caught and the trigger\n  removes itself. One test waits at a time; **Cancel a waiting test** drops it.\n\nEvery call is a complete snippet to paste into an addon. Lines calling an `apiexplorer_` function are the explorer's own\nreporting; drop them.\n", "docs/17-http-and-websockets.md": "# 17. HTTP, WebSockets and promises\n\nAn addon can fetch web pages, call web APIs, download files and keep a WebSocket open, and **none of it stops the game**.\nA call returns at once with a promise (or runs a callback you give it); the request itself runs on VanaCore's own worker\nthreads, many at a time, and the answer is handed to your code on the game's thread, in the next frame that has it. You\nnever wait, never lock, and never share a variable with another thread: your Lua is still one thread, and everything\n`vana` offers is still safe to call from your callback.\n\n```lua\n-- 1. a callback\nvana.http.get('https://example.com/api/price', function (res, err)\n    if err then print('failed: ' .. err.message) return end\n    print(res.status, #res.body)\nend)\n\n-- 2. a promise\nvana.http.get(url):next(function (res) print(res:json().name) end):catch(function (err) print(err) end)\n\n-- 3. straight-line code in a task: the task waits, the game goes on\nvana.async(function ()\n    local res = vana.http.get(url):await()\n    print(res:json().name)\nend)\n```\n\nPick whichever reads best; they are the same request. This page covers `vana.http`, `vana.ws`, `vana.promise` and\n`vana.async`.\n\n## Requests: `vana.http`\n\n```lua\nvana.http.get(url[, options][, callback])        → promise\nvana.http.head(url[, options][, callback])\nvana.http.delete(url[, options][, callback])\nvana.http.post(url, body[, options][, callback]) -- also put and patch\nvana.http.request(options_or_url[, options][, callback])\nvana.http.json(url[, options][, callback])       → promise of the decoded JSON\nvana.http.download(url, path[, options][, callback])\n```\n\nA `body` that is a table is sent as JSON (`Content-Type: application/json`); a string is sent as it is. `request` takes\neverything in one table (`{ url = ..., method = 'PUT', ... }`).\n\n### Options\n\n| Option | Meaning |\n|---|---|\n| `method` | `'GET'` unless the call says otherwise |\n| `headers` | `{ ['X-Key'] = 'value' }` |\n| `query` | a table (`{ q = 'a b', page = 2 }`) or text added to the URL as `?q=a%20b&page=2` |\n| `body` | text to send |\n| `json` | any value: sent as JSON, and `Accept: application/json` is asked for |\n| `form` | a table (or text) sent as `application/x-www-form-urlencoded`; a list value repeats its key |\n| `auth` | `'user:password'`, `{ 'user', 'password' }`, or a ready header value (`'Bearer abc'`): the `Authorization` header |\n| `timeout` | seconds one step may take: connecting, sending, waiting for the answer, or a stall while it arrives (30) |\n| `max_time` | seconds for the whole request (600) |\n| `follow` | follow redirects (`true`); `max_redirects` (10) |\n| `max_size` | the most bytes of answer that are read (16 MB; none with `save`); more fails with `too_large` |\n| `save` | write the body to this file instead of keeping it (below) |\n| `insecure` | accept any certificate (`false`): for a server on your own network with a self-signed one |\n| `strict` | reject an answer that isn't 2xx (`false`; always on for `vana.http.json` and `vana.http.download`) |\n\n`user:password@` in the URL works as `auth`. Cookies are not kept between requests (a cookie jar would be shared with\nevery other addon): send a `Cookie` header, and read `res.set_cookies`.\n\n### The response\n\nAn answer is a response **whatever its status**: a 404 is still a response, with `ok = false`. The promise is rejected\nonly when there is no answer (see Errors), or with `strict`.\n\n```lua\nres.ok          -- true for 200 to 299\nres.status      -- 200\nres.reason      -- 'OK'\nres.url         -- where it ended up, after redirects\nres.headers     -- { ['content-type'] = 'text/plain', ... }: lower case names (any case works to look one up)\nres.set_cookies -- a list of the Set-Cookie lines\nres.body        -- the body as text (any bytes); nil when it was saved to a file\nres.saved       -- the path given in `save`\nres:json()      -- the body decoded (vana.json); raises an error with code 'json' if it isn't JSON\nres:header(name) -- one header, any case\n```\n\nA header sent twice (`X-Dup`) is one value joined with `, `. gzip and deflate are undone for you.\n\n```lua\nvana.http.post('https://example.com/api/items', { name = 'Ash Log', qty = 3 }, {\n    headers = { ['X-Api-Key'] = 'secret' },\n}, function (res, err)\n    if err then return print('could not send: ' .. err.message) end\n    if not res.ok then return print('the server said ' .. res.status) end\n    print('saved as ' .. res:json().id)\nend)\n```\n\n### Errors\n\nA rejected promise (or the second argument to a callback) holds an error. `print(err)` shows its message, and\n`err.code` is a word to test it by:\n\n| `err.code` | When |\n|---|---|\n| `timeout` | a step took longer than `timeout`, or the whole request longer than `max_time` |\n| `dns` | the name could not be found |\n| `connect` | the server could not be reached, or the connection dropped |\n| `tls` | the certificate or the secure connection failed |\n| `cancelled` | you called `promise:cancel()` |\n| `too_large` | the answer is more than `max_size` |\n| `redirect` | too many redirects, or a redirect that can't be followed |\n| `file` | `save` could not be written |\n| `http` | `strict` and the answer wasn't 2xx (`err.status`, `err.response`) |\n| `json` | `res:json()` or `vana.http.json` and the body isn't JSON |\n| `invalid_request` | nothing was sent: a bad URL, a header with a line break, an option that can't be sent |\n| `busy` | too many requests at once (below) |\n| `unavailable` | WinHTTP isn't there (a very old Windows) |\n| `invalid_url` | WinHTTP refused the address or its scheme (a redirect's, say) |\n| `failed` | any other network error |\n\n### Downloads\n\n```lua\nvana.http.download('https://example.com/pack.zip', vana.paths.addon .. '\\\\pack.zip'):next(function (res)\n    print('saved ' .. res.saved)\nend)\n```\n\nThe body is written to `pack.zip.part` as it arrives and moved over `pack.zip` only when it is all there, so a failed\nor cancelled download never leaves half a file, and nothing of it sits in memory. A server answer that isn't 2xx\ndoesn't touch the file: `download` rejects with code `http` (`err.status`; `err.response.body` is the answer's first\n64 KB). With the `save` option on another call (and `strict` off), that response is the value instead.\n\n### Stopping a request\n\n```lua\nlocal request = vana.http.get(url)\nrequest:cancel()    -- true; the promise is rejected with code 'cancelled'\n```\n\n`cancel` works on the promise a call returned and on one made from it with `:next(...)`. When your addon unloads or\nreloads, everything it had going is stopped.\n\n## Promises: `vana.promise`\n\nA promise stands for a value that arrives later. Everything below works on any promise, yours or a request's.\n\n```lua\nlocal p = vana.promise.new(function (resolve, reject)\n    vana.tasks.once(2, resolve, 'done')      -- resolve(value) or reject(reason), once\nend)\n\np:next(on_fulfilled, on_rejected)   -- → a new promise for what the function returns (`then` is a Lua keyword: p['then'] is the same)\np:catch(on_rejected)                -- p:next(nil, on_rejected)\np:finally(fn)                       -- fn() either way; the outcome passes on\np:await()                           -- inside a task: the value, or raises the reason\np:cancel()                          -- stops the request behind it, if there is one\np.state                             -- 'pending', 'fulfilled' or 'rejected'; p.value or p.reason when it's settled\n```\n\n```lua\nvana.promise.resolve(value)         -- already fulfilled\nvana.promise.reject(reason)         -- already rejected\nvana.promise.all(list)              -- → a promise of the list of every value; rejected with the first reason\nvana.promise.allSettled(list)       -- → { { status = 'fulfilled', value = v } | { status = 'rejected', reason = r }, ... }\nvana.promise.race(list)             -- the first to settle\nvana.promise.any(list)              -- the first to be fulfilled (code 'all_failed' if none)\nvana.promise.delay(seconds, value)  -- fulfilled after `seconds`\n```\n\nThings to know:\n\n- A handler runs later, never inside the call that attached it, and in the order promises settled.\n- What a handler returns settles the promise `next` gave back; a promise returned from a handler is followed. An error\n  raised in a handler rejects that promise, so `:catch` after a chain catches anything above it.\n- **An error raised in your handler** and not caught is reported like any addon error (with its traceback, in\n  `logs\\vanacore.log` and the Addons page). A **network error** nobody looked at is logged as\n  `Promise: unhandled rejection: ...` and nothing more, so a request you fire and forget doesn't count against your addon.\n  Attach a `:catch` when you care.\n- Work on a list in parallel with `all`:\n\n```lua\nlocal pages = {}\nfor i = 1, 5 do pages[i] = vana.http.get(base .. '/page/' .. i) end\nvana.promise.all(pages):next(function (all)\n    for i, res in ipairs(all) do print(i, res.status) end\nend)\n```\n\n## Waiting in a task: `vana.async` and `await`\n\n```lua\nvana.async(fn, ...)    -- runs fn(...) now as a task → a promise of what it returns (or rejected with what it raises)\npromise:await()        -- inside a task: waits for the promise without stopping the game\n```\n\n`await` must run inside a task: `vana.async`, `vana.tasks.once` and the others ([Tasks and timing](03-tasks-and-timing.md))\nall make one. Elsewhere (in an event handler, in a `:next` function) it raises `promise:await() waits inside a task`; wrap\nthe code in `vana.async` there. A task that awaits carries on in the same frame the answer arrives, before the other tasks.\nErrors work as in any Lua: `pcall` around an `await` catches the rejection.\n\n```lua\nvana.on('command', function (e)\n    local name = e.command:match('^/lookup%s+(%S+)')\n    if not name then return end\n    vana.async(function ()\n        local ok, res = pcall(function () return vana.http.json('https://example.com/api/item/' .. name):await() end)\n        print(ok and (name .. ': ' .. res.price) or ('lookup failed: ' .. tostring(res)))\n        coroutine.sleep(1)       -- other waits work in the same task\n    end)\n    return true\nend)\n```\n\n## WebSockets: `vana.ws`\n\n```lua\nlocal socket = vana.ws.connect('wss://example.com/live', {\n    headers = { ['X-Key'] = 'secret' },\n    protocols = { 'chat' },           -- Sec-WebSocket-Protocol; socket.protocol is the one the server chose\n    timeout = 15,                      -- seconds to connect\n    keepalive = 30,                    -- seconds between pings\n    max_size = 16 * 1024 * 1024,       -- the largest message taken in\n    on_message = function (data, is_binary) print(data) end,\n})\n```\n\n`connect` returns **at once**: the socket is `'connecting'`, and its `'open'` event comes when the handshake is done.\nMessages sent before then wait and go in order as soon as it opens.\n\n```lua\nsocket:on('open', function (s) s:send('hello') end)\nsocket:on('message', function (data, is_binary) ... end)\nsocket:on('close', function (code, reason, clean) ... end)\nsocket:on('error', function (err) print(err.code, err.message) end)   -- a 'close' follows an error\nsocket:off(name, fn)\n\nsocket:send(text)          -- true, or false and why; a table is sent as JSON\nsocket:send_binary(bytes)\nsocket:send_json(value)\nsocket:close([code[, reason]])   -- the closing handshake; 'close' follows (a code is 1000 or 3000 to 4999)\n\nsocket.state     -- 'connecting', 'open', 'closing' or 'closed'\nsocket.protocol, socket.url, socket:is_open()\n```\n\nOr with promises, in a task:\n\n```lua\nvana.async(function ()\n    local socket = vana.ws.connect('wss://example.com/live')\n    socket:opened():await()             -- raises the error if it never opens\n    socket:send({ subscribe = 'prices' })\n    for _ = 1, 10 do\n        local text = socket:receive():await()   -- the next message\n        print(text)\n    end\n    socket:close()\n    print(socket:closed():await().code)         -- { code, reason, clean }\nend)\n```\n\n`receive()` hands out messages in order. A socket with no `'message'` handler keeps what arrives (the last 1000) from the\nmoment it connects, so a message the server sends as soon as it opens is there when you ask. Once you have a `'message'`\nhandler, messages go to it, and to a `receive()` that is waiting. A pending `receive()` is rejected (code `closed`) if the\nsocket closes.\n\nAn error has a `code`: `dns`, `connect`, `tls`, `timeout`, `handshake` (the server answered something other than 101,\n`err.status`), `too_large`, `invalid_request`, `busy`, `unavailable`, `failed` (any other error). `opened()` is rejected\nwith the socket's error, or code `closed` if it closed without one. A connection the server drops without a closing\nhandshake is code `1006` with `clean = false`. There is no automatic reconnect; start another from `'close'`:\n\n```lua\nlocal function connect()\n    local socket = vana.ws.connect(url)\n    socket:on('close', function () vana.tasks.once(5, connect) end)\n    return socket\nend\nconnect()\n```\n\n## Limits and rules\n\n- **Threads.** Up to 6 requests run at once; more wait their turn. An addon may have 256 requests going (more are\n  rejected with `busy`) and 16 WebSockets (64 in all). A socket uses two threads of its own while it lives.\n- **Frame cost.** Your callbacks run from the frame, so a callback that takes long holds the frame up as any handler does.\n  At most 256 events (8 MB) a frame are taken from the threads; a socket that is sent faster than your addon reads\n  waits, and the server's sending backs up, instead of memory filling.\n- **Sizes.** A body, an answer or a message may be 16 MB unless `max_size` says otherwise (a request body 256 MB; a\n  download to a file has no limit).\n- **Security.** Certificates are checked, with the system's proxy and TLS 1.2 (and 1.3 where Windows has it). No\n  cookies, no Windows sign-in. An address on this PC or your network (`127.0.0.1`, `192.168...`) is reachable like any\n  other: only load addons you trust.\n- **Windows 7.** Requests work, with HTTPS needing Windows 7's TLS 1.2 update; WebSockets need Windows 8 or later and say\n  `unavailable` otherwise.\n- **Other addons.** Each addon has its own queue, counts and sockets; one addon's requests never reach another's code.\n- **Looking at it.** `vana.http.pending()` is how many requests are going; `vana.ws.count()` how many sockets;\n  `vana.http.info()` is `{ requests, sockets, waiting, workers }` (what the engine holds for the addon, and the threads\n  running now).\n\nAlso: `vana.http.encode(table)` builds `a=1&b=x%20y`, `vana.http.urlencode(text)` encodes one value, and\n`vana.http.basic_auth(user, password)` gives `'Basic dXNlcjpwYXNz'`. `vana.json.encode(value, true)` writes compact JSON\non one line (the default is indented, for files); `vana.json.decode(text)` reads it ([Settings and files](08-settings-and-files.md)).\n", "docs/18-widgets.md": "# 18. Widgets: boxes in the game's 3D space\n\nA `vana.ui` box (text, rectangle or picture) normally sits at a fixed place on the screen, drawn over everything. A **widget**\nis the same box placed in the game's 3D space instead: at a character's nameplate, or at a point in the world. VanaCore draws\nit in the pass that draws the names over heads, at a depth the world's own depth tests, so **walls hide it as they hide a\nname**, and the effects, DLSS and frame generation treat it as they treat a name. That is what an addon cannot do alone: the\nworld's depth is in VanaCore's own renderer, out of reach of an addon's draws.\n\nThere are two levels. The simple one puts a box where a name would be (`vana.world.attach`). The advanced one puts it at any\npoint of the world (`vana.world.place`), over or under the interface, behind walls or not. Both go through `vana.world`.\n\n`vana.world` also has what an addon marking things in the world needs beside its boxes: [rings of light and\nwaymarks](#rings-of-light-on-the-ground-vanaworldmarks) drawn on the ground by the scene effects (`vana.world.marks`), [the\nground under a pixel](#where-is-a-point-vanaworldto_screen-vanaworldvisible-and-vanaworldpick) for putting one down with the\nmouse (`vana.world.pick`), and [where a name is](#where-a-name-is-vanaworldname_at) on the screen (`vana.world.name_at`).\n\n```lua\nlocal star = vana.ui.text({ text = '*', size = 18, color = '#FFD040', background = '#00000000' })\nvana.world.attach(star, vana.game.target().index, { side = 'above' })   -- over the target's name\nvana.world.detach(star)                                                  -- back to the screen at star.x, star.y\n```\n\nA placed box is not drawn at its `x` and `y` any more. `box.visible`, `box.opacity`, `box:set{...}` and `box:destroy()` work as\nthey always do (destroying it ends its placement). One box has one placement: placing it again changes it.\n\n**Needs** the renderer `d3d11` or `d3d12` for the world's camera (`vana.world.place`, `to_screen`, `visible`, `pick`,\n`name_at`), and its scene effects for `marks`. `attach` works with any renderer that VanaCore's name hooks find.\n`name_at` and `marks` need **VanaCore 0.8.218 or later**; `pick` and the marks' `shape`, `height` and `glyph` 0.8.219 or\nlater (`vana.world.pick` is `nil` before, and an older VanaCore draws a waymark as a plain ring). Hide the game's own names with\n[`vana.gameui.hide('nameplates')`](07-game-interface.md#nameplates) when the widgets replace them.\n\nThe API Explorer (`/addon load apiexplorer`, `/api`) has a **Widgets (vana.world)** group: run each entry to see a box at a\nnameplate, in front of you, or over the interface, a beam of light standing on the floor (an RPG marker made of boxes,\nits column laid in the world so it stands up from every side), waymarks on the ground, a ring following the mouse over the ground, or where the target's name is, and edit the code to try\nthe options.\n\n## At a nameplate: `vana.world.attach`\n\n```lua\nvana.world.attach(box, index [, options])\n```\n\n`index` is the character's target index (`0` to `4095`, as `vana.game.entity(index)` takes). The box is drawn after that\ncharacter's name, positioned from the name's edges. It is drawn **only for characters the game gives a name** (its own name\ndisplay setting, and the distance it stops drawing names at). While the name is hidden (the player's `[graphics]\nnameplates.hide*` settings, or `vana.gameui.hide('nameplates')`) the name is still laid out for its place and the widget is\ndrawn there; only the letters are left out.\n\n| Option | Default | |\n|--------|---------|---|\n| `side` | `'above'` | Which edge of the name the box sits on: `'above'`, `'below'`, `'left'`, `'right'`, or `'over'` (centred on it) |\n| `x`, `y` | 0 | Pixels from there, right and down (the scene's pixels: those of `vana.ui`) |\n| `scale` | 1 | The box's size times this |\n| `distance` | `false` | `true`: the box grows and shrinks with the name, as the name does with its distance |\n| `walls` | `true` | `false`: not hidden by walls (drawn over the world, under the interface) |\n\n## At a point in the world: `vana.world.place`\n\n```lua\nvana.world.place(box, x, y, z [, options])\n```\n\n`x`, `y`, `z` are a position as `vana.game.entity` has it: `x` and `y` across the ground, `z` the height, the game's way\nround: **up is a smaller `z`** (2 yalms over the point is `z - 2`; the `up` option does this for you).\n\n| Option | Default | |\n|--------|---------|---|\n| `up` | 0 | Yalms above the point |\n| `pivot` | `'bottom'` | Which part of the box sits on the point: `'bottom'` (a marker standing on it), `'center'`, `'top'`, `'left'`, `'right'` |\n| `x`, `y` | 0 | Pixels from there, right and down |\n| `scale` | 1 | The box's size times this |\n| `distance` | 0 | Above 0: the box is its own size at this many yalms from the camera, bigger nearer and smaller farther (a quarter to four times) |\n| `range` | 0 | Above 0: not drawn farther than this many yalms from the camera |\n| `over_ui` | `false` | `true`: drawn over the game's windows and your ImGui windows, not under them |\n| `walls` | `true` | Whether walls hide it |\n| `facing` | `'camera'` | `'camera'`: a picture facing the screen. `'upright'`, `'ground'` or `'wall'`: laid in the world ([below](#laid-in-the-world-facing)) |\n| `heading` | 0 | Laid on the `'ground'` or a `'wall'`: which way it's turned, radians as `vana.game.entity`'s `heading` |\n| `width`, `height` | 0 | Laid in the world: its size in yalms. One of them: the other follows the picture's shape; neither: 1 yalm across |\n| `toward` | 0 | Yalms toward the camera (negative: away). Facing the camera, on the ground or a wall: it only counts as that much nearer for the walls (the same pixels). `'upright'`: it stands out from its line, level, toward the camera: a column's front, or with a negative value its back |\n\n**Under the interface (`over_ui = false`)** the box is drawn into the world in the names' pass, just before the names (a name\ngoes over a box). `walls = true` hides it per pixel by the world's depth (the part of it behind a pillar is cut off, as a\nname's would be); `walls = false` draws it over the world, always.\n\n**Over the interface (`over_ui = true`)** the box is drawn after the game's windows, the ImGui windows and every `vana.ui` box\n(whatever its `layer`). It has no depth\nof its own there, so `walls = true` hides the whole box when the zone's collision (walls, floors, doors) is between the camera\nand the point (`vana.world.visible`), and shows it where that isn't known. It follows the interface being hidden (F11).\n\n### Laid in the world: `facing`\n\nA box facing the camera is a picture over the point: it looks the same from every side, so a tall one (a column of light)\nstands up the screen however the camera looks at it, and from above it seems to lie across the floor. With `facing`, the\nbox is laid in the world instead, a flat card with a size in yalms, its four corners points of the world: it has the world's\nperspective, and walls hide the part of it behind them.\n\n```lua\nlocal beam = vana.ui.rect({ width = 32, height = 192, radius = 16, color = '#40C8FF60' })\nvana.world.place(beam, e.x, e.y, e.z, { facing = 'upright', width = 1, height = 6 })        -- a column 6 yalms tall\nlocal pool = vana.ui.rect({ width = 32, height = 32, radius = 16, color = '#40C8FF40' })\nvana.world.place(pool, e.x, e.y, e.z, { facing = 'ground', width = 2.5, pivot = 'center', up = 0.05 })   -- a disc on the floor\nlocal sign = vana.ui.text({ text = 'This way' })\nvana.world.place(sign, e.x, e.y, e.z, { facing = 'wall', heading = e.heading, height = 0.5, up = 2 })   -- facing your way\n```\n\n- `'upright'`: stands on the point and turns round its upright line to face the camera, as a beam or a post would be drawn.\n  From the side it stands up; from above it is seen end on, short (a glow on the ground under it reads as its foot). A\n  column round someone standing in it is two cards: `toward = -r` behind them and `toward = r` in front (r its radius), so\n  they are inside it, not cut by one card through their middle.\n- `'ground'`: lies flat, its top toward `heading` (0: east).\n- `'wall'`: stands on the point facing `heading`, like a sign; from behind it is seen mirrored, as a pane of glass is.\n\n`pivot` is the part of the card on the point (`'bottom'`: standing on it; `'center'` for one centred on it), `up` lifts the\npoint, `scale` multiplies the size, and `range` and `walls` work as for any box. The size is in yalms, so `distance`, `x`\nand `y` (pixels) don't apply, and a laid box is always drawn in the world, under the interface (`over_ui` doesn't apply).\nThe picture's pixels are only its shape and how sharp it is: a 32 by 192 rect laid 1 by 6 yalms is a column. For the\nwalls, a laid box counts as a little nearer the camera than it is (0.08 yalms and 1.5% of its distance; it covers the same\npixels), so the ground or wall it lies on doesn't cut through it or flicker over it as the camera moves (uneven ground, frame\ngeneration's made frames); what stands on it still hides it. A card whose\ncorner is behind the camera isn't drawn. `vana.world.update` changes `facing`, `heading`, `width` and `height` like the other\noptions, so a card can turn or grow every frame.\n\n## Where is a point: `vana.world.to_screen`, `vana.world.visible` and `vana.world.pick`\n\n```lua\nlocal sx, sy, distance = vana.world.to_screen(x, y, z)   -- the interface's pixels, or nil\nlocal clear = vana.world.visible(x, y, z)                -- true, false, or nil\nlocal gx, gy, gz = vana.world.pick(mouse_x, mouse_y)     -- the ground under a pixel, or nil\n```\n\n`to_screen` gives the point in the pixels `vana.ui` uses and how far in front of the camera it is; `nil` behind the camera, past\nits planes, far off the screen, or before the world has a camera. `visible` asks the game's collision whether a line from the\ncamera to the point meets the zone; `nil` where that isn't known (no camera yet, the zone's collision isn't loaded). It is the\nzone's collision, not what is drawn: a tree or a prop without collision doesn't block it. `pick` goes the other way: the point\nof the zone under a pixel, where the camera's line through it first meets the zone's collision (the ground, a floor, a wall), as\n`vana.game.entity` has positions (`z` the height), for putting something down where the pointer is; `nil` when nothing is met\nwithin 150 yalms, or the collision isn't there. The same collision: a pick through a tree without it lands on the ground under\nit, and a monster or a player isn't met (they aren't in it).\n\n## Changing a widget every frame: `vana.world.update`\n\n```lua\nvana.world.update(box, { y = -20, walls = false })    -- only what is given changes\nlocal now = vana.world.placement(box)                 -- how it is placed: the options, and `index` or `at`; nil if not\n```\n\n`placement` gives `x`, `y`, `scale`, `walls`, then for a box at a name `side`, `distance` (a boolean) and `index`, and for\na box at a point `up`, `distance`, `range`, `over_ui`, `facing`, `heading`, `width`, `height`, `toward` and `at` (`{ x, y, z }`).\n`pivot` isn't read back. (A VanaCore from before `facing` gives no `facing`: an addon can tell from that.)\n\nPlacing a box (`attach`, `place`) once and then changing it is the cheap way to keep a plate in step with the game.\n\n- **What shows** (a text box's text, a rectangle's `width`, `height` and `color`, a picture's `file`) is changed on the box with\n  `box:set{...}` or `box.text = ...`. The picture is remade only when that changed, so a bar whose width follows HP costs a\n  little only on the frames HP moves.\n- **How it is placed** is changed with `update`: the options of the box's own kind, so a box moves without being placed\n  again. A box at a name takes `x`, `y`, `scale`, `walls`, `side`, `distance` and `index` (another character's name); a\n  box at a point `x`, `y`, `scale`, `walls`, `up`, `pivot`, `distance`, `range`, `over_ui`, `facing`, `heading`, `width`,\n  `height`, `toward` and `at` (`{ x = ..., y = ..., z = ... }`, another point). The other kind's options are ignored (`update` doesn't turn one kind into the other), and\n  updating a box that isn't placed is an error. `walls` can be changed at any time: `false` for the target's plate\n  so it stays visible through walls, `true` for the rest.\n- **A stack of boxes** at one name is one `attach` per box, each with its own `y` from the name's edge; boxes are drawn in the\n  order they were placed, so the one placed last is on top.\n- **Every placed box**, at a name or at a point, is drawn in the order it was **first** placed: placing it again keeps\n  its turn, and its `layer` doesn't count. `detach` it (or make it again) to put it on top.\n- Calling `attach` or `place` again on a placed box **replaces** its placement: the options you give, and every other option at\n  its default. To change some options and keep the rest, use `update`.\n\nA full example, with a bar, a tag and a marker, is [plates](examples/plates.md): `/addon load example-plates`.\n\n## Putting a box back\n\n```lua\nvana.world.detach(box)\n```\n\nThe box is drawn at its `x` and `y` again.\n\n## Things to know\n\n- **A frame behind, a pixel off.** The widgets are placed from the camera of the frame being drawn, so they stay on their\n  point while the camera moves. With frame generation the frames between are moved as a name's are.\n- **Pictures are made as the box changes.** A box whose text changes every frame is remade every frame; change it when it\n  changes.\n- **The Ashita `Nameplate` plugin** is held off while any widget is placed (it rewrites the same code); it loads again when\n  the last one is gone.\n- **Positions are the game's.** `z` is the height as the game stores it, and `up` lifts a point; put a marker over an NPC at\n  `entity.x, entity.y, entity.z` with `up` of its height.\n\n## Where a name is: `vana.world.name_at`\n\n```lua\nlocal x, top, bottom = vana.world.name_at(index)   -- nil when its name wasn't drawn in the last moments\n```\n\nFor an addon that draws by a name with its own drawing (ImGui, `vana.ui` boxes placed by hand) rather than attaching a\nbox: the target's place across the screen (its name is centred on it) and the letters' top and bottom, in the interface's\npixels (`vana.ui.screen`'s), as the game drew the name over target `index` within the last 300 ms. A mark drawn just over `top` sits where the game puts the name,\nwhich is the right height for any model; the top of a model's bounding box isn't (a dragon's raised wings are far over its\nhead). `nil` while the name isn't drawn: too far, hidden by the nameplates settings, or the names aren't VanaCore's to see.\n`vana.game.entity(index)` has the same three as `name_x`, `name_top` and `name_bottom` (VanaCore 0.8.224 or later).\n\n## Rings of light on the ground: `vana.world.marks`\n\n```lua\nvana.world.marks({\n    { x = e.x, y = e.y, z = e.z, radius = 1.2, color = '#FFD040' },\n    { x = f.x, y = f.y, z = f.z, radius = 0.8, color = '#5BE0FF', strength = 0.6 },\n    { x = 10, y = -20, z = 0.5, radius = 1.5, color = '#FF4F6A', shape = 'square', height = 6, glyph = '1' },  -- a waymark\n})\nvana.world.marks()   -- off\n```\n\nA ring of light on the ground under something, in a colour of yours: a bright line with a glow round it and a faint pool\ninside, breathing, and a ripple going out from it now and then. With a `height`, a column of light rises from the ring to\nthat height, in streaks drifting upward and thinning to nothing at the top: a waymark, telling people where to stand. The\nlist is your addon's whole set each time (so a mark that has gone is left out of the next call); `nil` or an empty list\ntakes them all off, and unloading does too. Each ring:\n\n- `x`, `y`, `z`: its centre as the game has positions (`entity.x`, `entity.y`, `entity.z`; `z` the height), the ground\n  under the thing's feet.\n- `radius`: in world units, 0.1 to 50 (1); a monster's `hitbox_size` is a fair start.\n- `color`: `'#RRGGBB'` (white).\n- `strength`: how strongly it's drawn, 0 to 4 (1); 0 isn't drawn.\n- `shape`: `'round'` (the default), or `'square'`, a square of that half-width.\n- `height`: the column of light over it, in world units, 0 to 30 (0: none). Six to ten reads well on a character.\n- `glyph`: a sign over the column's top (over the ring, with no column): `'A'`, `'B'`, `'C'`, `'D'`, `'1'`, `'2'`, `'3'` or\n  `'4'` (`'a'` is `'A'`), as FFXIV's waymarks have them, drawn as strokes facing the camera in the ring's colour;\n  `glyph_size` half its height in world units, 0.1 to 10 (0.8); `glyph_height` how high over the ring its centre floats,\n  world units, 0 to 30 (0, the default: just over the column's top, or a little over the ring without one; FFXIV's hang\n  about 5 up).\n\nNumbers past their ends are held to them. A `shape` other than `'round'` or `'square'`, a `glyph` that isn't one of the\neight, a `color` that isn't `'#RRGGBB'` or an entry that isn't a table is an error naming the entry, and none of the list\nis taken (the marks drawn before stay).\n\nUnlike a box, a ring isn't a picture: the scene effects draw it from the scene's own depth, onto whatever ground the\nscene has there. So it lies on a slope, and what stands in front of it (the monster it's under, a character between it\nand the camera) hides that part of it, as a decal would. The column is light in the air, cut the same way: someone\nstanding in it is lit in front of it and hides what's behind them, and it shows against the sky. The glyph is cut by the\ndepth too: whatever stands between the camera and it hides it, where a sign drawn over the screen would sit over them.\nA name or anything else over the column is yours to draw (project the top, `z - height` as the game has heights). The first 16 rings of every addon's together are drawn, those\nwithin 70 units of the camera, fading out past 50. On the game's own Direct3D 8 (no scene effects) nothing is drawn:\n`vana.graphics.info().active` is false there, and an addon can draw its own over the screen instead.\n", "docs/README.md": "# Writing addons for VanaCore\n\nVanaCore runs Lua addons inside FINAL FANTASY XI. An addon is a folder with one Lua file in it. It can draw on the\nscreen, read the game's data (your character, the party, the target, your inventory), react to what happens in the\ngame (a zone change, a chat line, a packet, a key), run commands, keep settings, and change parts of the game's own\ninterface. This series says how.\n\nEverything an addon can use is in one global table, `vana`. There is no `require` for it: it is there when your file\nruns. The API is described page by page below, and all of it is listed once more, one line per function, in the\n[API reference](15-api-reference.md).\n\n## The series\n\n| Page | What it covers |\n|------|----------------|\n| [1. Getting started](01-getting-started.md) | Your first addon: the folder, the `addon` table, loading and reloading it, `print`, commands, `boot.txt` |\n| [2. Events](02-events.md) | `vana.events.on`: every event VanaCore raises, what each hands you, and how to block one |\n| [3. Tasks and timing](03-tasks-and-timing.md) | Running something later or every few seconds: `vana.tasks`, `coroutine.sleep`, `vana.time.clock` |\n| [4. Game data](04-game-data.md) | `vana.game`: your character, the player's stats and buffs, the party and alliance, entities, the target, inventory, equipment, recasts |\n| [5. Chat and commands](05-chat-and-commands.md) | Writing to the chat log, running commands, handling `/yourcommand`, reading chat lines, Shift-JIS, auto-translate |\n| [6. Drawing](06-drawing.md) | Text boxes, rectangles and pictures (`vana.ui`), ImGui windows (`vana.imgui`), icons, fonts, the layout system |\n| [7. The game's interface](07-game-interface.md) | `vana.gameui`: hiding the party list or chat, moving the Target window and where it is, a button in the Config menu, taking over a menu item |\n| [8. Settings and files](08-settings-and-files.md) | `vana.settings` (per character or shared), `vana.json`, `vana.fs`, `vana.paths`, and VanaCore's own `vanacore.ini` through `vana.config` |\n| [9. Input](09-input.md) | Key binds (`vana.binds`), key and mouse events, the DirectInput keyboard, controllers (`vana.gamepad`) |\n| [10. Packets](10-packets.md) | Reading, changing, blocking and sending the game's packets |\n| [11. Memory and FFI](11-memory-and-ffi.md) | `vana.memory`: reading and writing the game's memory, finding code by pattern, calling the game's functions with LuaJIT's FFI |\n| [12. System](12-system.md) | Windows, monitors, the clipboard, sounds, URLs, other game clients on this PC (`vana.clients`, `vana.ipc`), graphics info, plugins |\n| [13. Ashita and Windower addons](13-ashita-and-windower.md) | How addons written for Ashita or Windower run on VanaCore, and how to port one |\n| [Ashita plugins](../plugins/README.md) | VanaCore's plugin API: what `vana.gameui` and `vana.ui.game_on_top` do, for a C++ plugin |\n| [14. Developing and debugging](14-dev-workflow.md) | The edit-reload loop, running Lua in a loaded addon, logs, errors and crashes, tracing, profiling, publishing |\n| [15. API reference](15-api-reference.md) | Every `vana.*` function on one page |\n| [16. The character, the menus and the game's tables](16-character-menus-and-tables.md) | How the character reads, menu triggers (`vana.gameui.on` / `catch`) and the game tables (`vana.gamedata`) work underneath, and the API Explorer |\n| [17. HTTP, WebSockets and promises](17-http-and-websockets.md) | Fetching web pages and APIs, downloads and WebSockets without stopping the game: `vana.http`, `vana.ws`, `vana.promise`, `vana.async`, `await` |\n| [18. Widgets](18-widgets.md) | Boxes in the game's 3D space: at a character's nameplate or a point in the world, hidden by walls or not; rings of light and waymarks on the ground, the ground under the pointer, where a name is (`vana.world`) |\n| [Examples](examples/README.md) | Complete addons to copy, one per task |\n\n## Three things to know first\n\n**Your addon has its own Lua.** Each addon runs in its own LuaJIT 2.1 state (Lua 5.1, with LuaJIT's `ffi`, `bit` and\n`jit` libraries). Nothing you define leaks into another addon, and another addon's crash doesn't touch yours.\n\n**Everything happens on the game's thread, once a frame.** Events, tasks and your drawing all run from the game's\n`Present`. Nothing in `vana` needs a lock, and nothing you do blocks the game unless it takes long.\n\n**Say what your addon does.** Put a `README.md` in the addon's folder. The /vana window shows it on the Addons page,\nand it is where you tell the player what the addon changes in the game's interface, if anything.\n\n## Where things are\n\n```\n<VanaCore>\\                      the folder VanaCore.exe is in\n    addons\\vanacore\\<name>\\      your addon: <name>.lua and README.md\n    addons\\vanacore\\libs\\        libraries every VanaCore addon can require\n    addons\\ashita\\               Ashita addons, run through VanaCore's compatibility layer\n    addons\\windower\\             Windower addons, the same\n    settings\\addons\\<Name>\\      what vana.settings saves (shared, and a folder per character)\n    scripts\\boot.txt             the commands run at every start: /addon load lines go here\n    logs\\vanacore.log            VanaCore's log: vana.log and every addon error with its traceback\n    config\\imgui.ini             ImGui's window positions; config\\layout.json the Layout page's\n    fonts\\                       fonts loaded into the game for vana.ui text\n```\n\n## Versions\n\n`vana.version` is VanaCore's version as text (`'0.8.47'`). A part of the API that isn't in an older VanaCore is simply\n`nil`, so an addon that must load on old and new alike checks before using it:\n\n```lua\nif vana.gameui ~= nil then\n    vana.gameui.hide('party_list')\nend\n```\n\nThe pages note where a feature needs a particular version.\n", "docs/examples/add_button.md": "# Add a button to the game's Config menu\n\nYour addon gets its own button in the game's Config list, under VanaCore's. The game's own menu code draws it, plays\nits sounds and moves the cursor to it, the same as the game's own items. When the player chooses it, your function runs.\n\n```\nConfig\n  Gameplay\n  ...\n  Gamepad\n  VanaCore\n  HUD\n  FPS Graph\n  Game Stats\n  Timers        <- yours\n```\n\n## 1. `timers.lua`\n\n```lua\naddon.name    = 'timers'\naddon.author  = 'You'\naddon.version = '1.0'\naddon.desc    = 'A timers window, opened from Config.'\n\nlocal imgui = vana.imgui\nlocal open = { false } -- ImGui's Begin takes the open flag as a one-item table\n\nvana.events.on('load', function ()\n    vana.gameui.add('config_menu', 'Timers', function ()\n        open[1] = not open[1] -- runs on the frame after the player chooses Config > Timers\n    end)\nend)\n\nvana.events.on('present', function ()\n    if not open[1] then\n        return\n    end\n    if imgui.Begin('Timers', open) then\n        imgui.Text('Your timers here.')\n    end\n    imgui.End()\nend)\n```\n\nThe second argument is the button's text, 1 to 10 letters. Any other length raises an error.\n\nA fourth argument colours the button, as the game colours some of its own (Monstrosity is red):\n\n```lua\nvana.gameui.add('config_menu', 'Timers', toggle, 'green')\n```\n\n`'blue'` (the game's, the same as leaving it out), `'green'`, `'yellow'`, `'red'`, `'purple'` (VanaCore's), `'grey'`, or\nyour own as `'#RRGGBB'`. It tints a grey button, so a bright colour reads best.\n\n## 2. Say what it changes\n\nIn your README: \"Adds a Timers button to the game's Config menu.\"\n\n## 3. Load it\n\nType `/addon load timers`. Open the main menu > Config, and **Timers** is at the bottom. Its help line at the top of\nthe screen says **From the timers addon.**, so the player always knows whose button it is.\n\n## Good to know\n\n- **When it appears.** The Config list is rebuilt with your button the next time it's closed. If the player has it\n  open when your addon loads, it shows up when they open it again.\n- **Your function runs on the next frame**, not inside the game's menu code, so it's safe to do anything there:\n  open windows, run commands, print.\n- **Taking it out:** `vana.gameui.remove('config_menu')` removes the button, and unloading the addon does too.\n- **Room is limited:** 4 buttons fit after VanaCore's, and its own HUD, FPS Graph and Game Stats take three, so\n  one addon's button fits, the first to ask. Past that the rest are left out (VanaCore's log says so).\n- **Letters:** the label is drawn letter by letter in the game's own menu font. A to Y, a to z and spaces work; Z and\n  the digits 0 to 9 aren't known yet (`configmenu.cpp`, `kGlyphs`) and show as gaps.\n", "docs/examples/chat_timestamps.md": "# Timestamps and a filter on the chat log\n\nAn addon that puts the time in front of each chat line and drops lines that match words you give it. It shows the\n`text_in` event: reading a line's mode, changing what's shown, and blocking a line.\n\n## `chatstamp.lua`\n\n```lua\naddon.name    = 'chatstamp'\naddon.author  = 'You'\naddon.version = '1.0'\naddon.desc    = 'A timestamp on every chat line, and a word filter.'\n\nlocal config = vana.settings.register({\n    defaults = { stamp = true, filter = {} },   -- filter: a list of words; a line with one of them isn't shown\n})\n\nlocal function filtered(message)\n    local lower = message:lower()\n    for _, word in ipairs(config.data.filter) do\n        if lower:find(word, 1, true) then return true end\n    end\n    return false\nend\n\nvana.on('text_in', function (e)\n    if e.injected then return end                    -- lines VanaCore and addons write: leave them\n    local mode = bit.band(e.mode, 0xFF)              -- the chat mode itself; the high bytes are flags\n    if #config.data.filter > 0 and filtered(e.message) then\n        return true                                  -- blocked: not shown\n    end\n    if config.data.stamp and not e.indent then       -- not on a continuation line\n        e.message_modified = os.date('[%H:%M] ') .. e.message_modified\n    end\nend)\n\nvana.on('command', function (e)\n    local what, rest = e.command:lower():match('^/cs%s+(%S+)%s*(.*)$')\n    if what == nil then\n        if e.command:lower():match('^/cs') then print('/cs stamp on|off, /cs add <word>, /cs remove <word>, /cs list') return true end\n        return\n    end\n    if what == 'stamp' then\n        config.data.stamp = rest == 'on'\n    elseif what == 'add' and rest ~= '' then\n        table.insert(config.data.filter, rest)\n    elseif what == 'remove' then\n        for i, word in ipairs(config.data.filter) do\n            if word == rest then table.remove(config.data.filter, i) break end\n        end\n    elseif what == 'list' then\n        print('Filtered: ' .. (#config.data.filter > 0 and table.concat(config.data.filter, ', ') or 'nothing'))\n    end\n    config:save()\n    return true\nend)\n```\n\n## What to notice\n\n- **`e.message_modified` is what's shown.** Assigning to it changes the line; `e.message` stays the original. Other\n  addons after this one see the change.\n- **Returning `true` blocks the line.** `e.blocked = true` does the same. The game keeps the line in its log either way;\n  it just isn't shown.\n- **`e.injected`** marks lines VanaCore or an addon wrote (`print`, `vana.chat.write`). Leaving those alone keeps your\n  own output and other addons' readable.\n- **`e.indent`** is set on the continuation lines of a long message, so the stamp goes on the first line only.\n- **The text is Shift-JIS with the game's codes in it.** `find` with plain matching on ASCII words works; for the line\n  as the player sees it, `vana.ashita.parse_auto_translate(e.message, true)` spells out auto-translate phrases, and\n  colour codes are `[\\30\\31].` for `gsub`.\n- **The chat mode** is in the low byte of `e.mode`. The numbers are the game's: say, shout, party, linkshell, tell,\n  battle messages and so on, each a different colour in the player's settings.\n\n## `README.md`\n\n```markdown\n# chatstamp\n\nPuts the time in front of each chat line, and hides lines containing words you add with /cs add <word>.\nChanges nothing in the game's interface.\n```\n", "docs/examples/custom_equipment.md": "# Your own equipment screen\n\nThe main menu's Equipment item opens the addon's window instead of the game's. `vana.gameui.catch` hears the choice and\nkeeps it from the game; the window draws what `vana.game.equipment()` and `vana.game.container()` say is worn. It shows\na trigger by item name, a window that opens from a game event, and `off` on unload (not needed: VanaCore drops an\naddon's triggers when it goes, but it shows the call).\n\n## `myequip.lua`\n\n```lua\naddon.name    = 'myequip'\naddon.author  = 'You'\naddon.version = '1.0'\naddon.desc    = 'Opens its own equipment window from the main menu\\'s Equipment item.'\n\nlocal imgui = vana.imgui\nlocal open = { false }\nlocal SLOTS = { 'Main', 'Sub', 'Range', 'Ammo', 'Head', 'Body', 'Hands', 'Legs', 'Feet', 'Neck', 'Waist',\n                'L.Ear', 'R.Ear', 'L.Ring', 'R.Ring', 'Back' }\nlocal trigger\n\nvana.on('load', function ()\n    -- the player picks Equipment (menuwind's item 2): our window, not the game's\n    trigger = vana.gameui.catch('main_menu', 'select', 'equipment', function (e)\n        open[1] = true\n    end)\nend)\n\nvana.on('unload', function ()\n    vana.gameui.off(trigger)\nend)\n\nvana.on('present', function ()\n    if not open[1] then return end\n    imgui.SetNextWindowSize({ 260, 0 }, 4)                 -- ImGuiCond_FirstUseEver\n    if imgui.Begin('My equipment', open) then\n        local eq = vana.game.equipment()\n        for slot = 0, 15 do\n            local where = eq and eq[slot]\n            local item = where and where.index ~= 0 and vana.game.container(where.container)[where.index]\n            imgui.Text(('%-7s %s'):format(SLOTS[slot + 1], item and ('item %d'):format(item.id) or '-'))\n        end\n        if imgui.Button('Close') then\n            open[1] = false\n        end\n    end\n    imgui.End()\nend)\n```\n\nItem names aren't in `vana.game`: they're in the game's DAT files ([Game data](../04-game-data.md) says where the\nAshita layer reads them). To see every menu's items as the player uses them, while you work out ids for other menus:\n\n```lua\nvana.gameui.on('*', 'select', function (e)\n    print(('%s: item %d%s'):format(e.menu, e.item, e.name ~= '' and ' (' .. e.name .. ')' or ''))\nend)\n```\n\n## README.md\n\n> Opens its own equipment window in place of the game's when Equipment is chosen in the main menu. The game's own\n> Equipment window isn't opened while this addon is loaded; unload it to have it back.\n", "docs/examples/hide_chat.md": "# Hide the game's chat log\n\nThe most requested one: the game's chat windows (the main log and the second log, if it's on) stay closed. Chat still\narrives. The game keeps every line, and addons still see each one through their `text_in` event, so a chat addon can\nshow them its own way.\n\nThis is the same trick VanaCore already uses for fancychat: each frame, the chat windows are told they have no lines to\nshow, so they never open. Nothing flickers or bounces when a line comes in or the chat line opens.\n\n## 1. Make the folder\n\n```\naddons\\vanacore\\hidechat\\\n    hidechat.lua\n    README.md\n```\n\n## 2. Do it: `hidechat.lua`\n\n```lua\naddon.name    = 'hidechat'\naddon.author  = 'You'\naddon.version = '1.0'\naddon.desc    = \"Keeps the game's chat log closed.\"\n\nvana.events.on('load', function ()\n    vana.gameui.hide('chat_log')\nend)\n```\n\nThat's the whole addon. You don't need an `unload` handler: when hidechat unloads, VanaCore lets the chat log open\nagain.\n\n## 3. Say what it changes: `README.md`\n\n```markdown\n# hidechat\n\nKeeps the game's chat log closed. Chat still arrives: unload hidechat (or type /hidechat) to see it again.\n\nChanges to the game's interface: hides the chat log.\n```\n\nThe player reads it in /vana > Addons > hidechat, so say plainly what changes and how to get it back.\n\n## 4. Load it\n\nType `/addon load hidechat`. The chat log closes at once. From then on hidechat loads at every start (`/addon load`\nadds it to `scripts\\boot.txt`).\n\n## Add a toggle\n\nTo show the chat for a moment, for example to read a tell, add a command:\n\n```lua\nlocal hidden = true\n\nvana.events.on('command', function (e)\n    if e.command:lower() == '/hidechat' then\n        hidden = not hidden\n        if hidden then\n            vana.gameui.hide('chat_log')\n        else\n            vana.gameui.show('chat_log')\n        end\n        print('hidechat: chat log ' .. (hidden and 'hidden' or 'shown'))\n        return true -- handled: the game doesn't see /hidechat\n    end\nend)\n```\n\n## Hide the chat line too (only if you draw your own)\n\nThe chat line is where you type. It's a separate element, `chat_input`. Hide it **only** if your addon shows what's\nbeing typed some other way, or the player will be typing blind. While it's hidden, typing still works and addons can\nstill read the text being typed.\n\n```lua\nvana.gameui.hide('chat_input')\n```\n\n## Good to know\n\n- **fancychat** already keeps the game's chat closed by itself. You don't need this alongside it, though the two don't\n  conflict.\n- **Escape** still closes menus as usual, but won't open the chat log a step at a time while it's hidden.\n", "docs/examples/hide_party_list.md": "# Hide the game's party list (and draw your own)\n\nFor addons with their own party list, like XIUI: the game's party list and the alliance lists stop being drawn, so\nyours can take their place. The party itself doesn't change. The game still keeps it, targeting a member works as\nbefore, and your addon reads the members as usual.\n\nThis example is an **Ashita** addon, because that's what XIUI is. The same calls work from VanaCore and Windower\naddons.\n\n## 1. The folder\n\nAn Ashita addon lives in `addons\\ashita\\`:\n\n```\naddons\\ashita\\mypartylist\\\n    mypartylist.lua\n    README.md\n```\n\n## 2. `mypartylist.lua`\n\n```lua\naddon.name    = 'mypartylist'\naddon.author  = 'You'\naddon.version = '1.0'\naddon.desc    = 'A party list of its own.'\n\nrequire('common')\n\nashita.events.register('load', 'mypartylist_load', function ()\n    -- VanaCore only: real Ashita has no `vana`, and there the game's lists simply stay\n    if vana ~= nil and vana.gameui ~= nil then\n        vana.gameui.hide('party_list')\n        vana.gameui.hide('alliance_lists')\n    end\nend)\n\nashita.events.register('d3d_present', 'mypartylist_present', function ()\n    local party = AshitaCore:GetMemoryManager():GetParty()\n    for i = 0, 5 do\n        if party:GetMemberIsActive(i) == 1 then\n            -- draw member i your own way: party:GetMemberName(i), party:GetMemberHPPercent(i), ...\n        end\n    end\nend)\n```\n\nThe `if vana ~= nil and vana.gameui ~= nil` check is all it takes for one file to work in both VanaCore and Ashita.\n\n## 3. Say what it changes\n\nIn your README: \"On VanaCore, hides the game's party list and alliance lists: mypartylist draws its own in their\nplace.\"\n\n## Good to know\n\n- **Show the game's list again** with `vana.gameui.show('party_list')`, for example if your list has a hidden mode.\n- **Two addons can hide the same list.** Hiding is shared: it stays hidden while any addon hides it, and comes back when\n  the last one lets go.\n- **The player's own setting** `[client] party.hide` (/hud > Party List > Hide) is separate. If it's on,\n  the list stays hidden whatever your addon does.\n- **The Target window** sits just above the game's party list. With the list hidden, you may want to move it too:\n  see [move_window.md](move_window.md). `addons\\vanacore\\example-minparty` does both.\n", "docs/examples/move_window.md": "# Move the game's Target window\n\nThe Target window is the box with your target's name and HP bar. This example puts it wherever your addon says. A\ntypical reason is that your addon draws something where the game puts it, or hides the party list it normally sits on.\n\n## 1. `mytarget.lua`\n\n```lua\naddon.name    = 'mytarget'\naddon.author  = 'You'\naddon.version = '1.0'\naddon.desc    = 'Puts the Target window at the top of the screen.'\n\nvana.events.on('load', function ()\n    -- x: where its middle goes, y: where its top goes, both in percents of the game's interface\n    local ok, why = vana.gameui.move('target_window', 50, 4)\n    if not ok then\n        print('mytarget: the Target window stays where it is (' .. why .. ')')\n    end\nend)\n\n-- /mytarget <x> <y> moves it again; /mytarget alone puts it back where the player has it\nvana.events.on('command', function (e)\n    local word, x, y = e.command:match('^(/%S+)%s*(%S*)%s*(%S*)')\n    if word == nil or word:lower() ~= '/mytarget' then\n        return\n    end\n    if x == '' then\n        vana.gameui.move('target_window')\n    else\n        vana.gameui.move('target_window', tonumber(x) or 50, tonumber(y) or 4)\n    end\n    return true\nend)\n```\n\nCall `move` again whenever you like. The window follows at once.\n\n## 2. Say what it changes\n\nIn your README: \"Moves the game's Target window to the top of the screen (/mytarget to move it, /mytarget alone to put\nit back).\"\n\n## Where `x` and `y` put it\n\n- Both are **percents of the game's interface**, from its top left: `0, 0` is the top left corner and `100, 100` the\n  bottom right.\n- For the Target window, `x` is where its **middle** goes and `y` where its **top** goes. That's the same as the\n  player's own Target window settings in /vana, so `50, 4` is the middle of the top edge.\n- It's always kept on screen. A position that would put part of it off the edge is pulled back in.\n\n## Good to know\n\n- **Your position wins over the player's own** (/hud > Target Window > Position) while your addon holds\n  the window. `vana.gameui.move('target_window')` with no position, or unloading your addon, hands it back to their\n  setting.\n- **One addon at a time.** If another addon already moved the Target window, `move` returns `false, 'held by X'`.\n  Your position is remembered, and the window comes to you when that addon lets go.\n- **Other windows:** only the Target window can be moved in this mockup. The macro bar and status icons already have\n  movers in VanaCore and would follow the same pattern (see `../07-game-interface.md`).\n", "docs/examples/party_window.md": "# A party window in ImGui\n\nAn ImGui window listing the party with HP and TP bars, drawn every frame from `vana.game.party()`, with a scale slider\nkept in a shared settings store. It shows the ImGui conventions: `Begin` with a one-item table for its open flag,\nvectors as tables, colours as `ImU32` numbers, and a stable window name so the player can move and scale it from\n`/vana layout`.\n\n## `partywin.lua`\n\n```lua\naddon.name    = 'partywin'\naddon.author  = 'You'\naddon.version = '1.0'\naddon.desc    = 'A party window with HP and TP bars.'\n\nlocal imgui = vana.imgui\nlocal config = vana.settings.register({ defaults = { scale = 1.0, shown = true } })\n\nlocal open = { true }           -- Begin's p_open: a one-item table ImGui writes\nlocal scale = { 1.0 }           -- SliderFloat's value, the same way\nlocal NO_SCROLL = 8 + 16        -- ImGuiWindowFlags_NoScrollbar + NoScrollWithMouse\nlocal FIRST_USE_EVER = 4        -- ImGuiCond_FirstUseEver\n\nlocal function bar(fraction, colour, width)\n    imgui.PushStyleColor(45, colour)             -- ImGuiCol_PlotHistogram: ProgressBar's fill\n    imgui.ProgressBar(fraction, { width, 0 }, '')\n    imgui.PopStyleColor()\nend\n\nvana.on('load', function ()\n    open[1] = config.data.shown\n    scale[1] = config.data.scale\nend)\n\nvana.on('present', function ()\n    if not open[1] then return end\n    local party = vana.game.party()\n    if party == nil then return end\n\n    imgui.SetNextWindowSize({ 320, 0 }, FIRST_USE_EVER)\n    if imgui.Begin('Party###partywin', open, NO_SCROLL) then   -- ###: the name stays the same whatever the title says\n        imgui.SetWindowFontScale(scale[1])\n        for slot = 1, 6 do\n            local m = party.members[slot]\n            if m.active then\n                imgui.Text(('%-15s'):format(m.name))\n                imgui.SameLine(130 * scale[1])\n                bar(m.hpp / 100, m.hpp < 30 and 0xFF3030FF or 0xFF40C040, 90 * scale[1])   -- red low, green else (0xAABBGGRR)\n                imgui.SameLine()\n                bar(math.min(m.tp, 3000) / 3000, m.tp >= 1000 and 0xFF40C0FF or 0xFF808080, 90 * scale[1])\n            end\n        end\n        imgui.Separator()\n        if imgui.SliderFloat('Scale', scale, 0.6, 2.0, '%.1f') then\n            config.data.scale = scale[1]       -- saved at unload, or:\n            config:save()\n        end\n    end\n    imgui.End()\nend)\n\nvana.on('command', function (e)\n    if e.command:lower():match('^/partywin') then\n        open[1] = not open[1]\n        config.data.shown = open[1]\n        return true\n    end\nend)\n```\n\n## What to notice\n\n- **`imgui.Begin('Party###partywin', open, flags)`** returns whether the window is open to draw into; `imgui.End()` is\n  called either way. The player closing the window with its **x** sets `open[1]` to false.\n- **Colours are `ImU32`**: `0xAABBGGRR`. `0xFF40C040` is opaque, green 0xC0, red 0x40.\n- **`ProgressBar` takes `{ width, height }`**; 0 for a part means ImGui's default.\n- **`PushStyleColor(45, ...)`** uses ImGui 1.92's `ImGuiCol_PlotHistogram`. The numbers are listed in\n  [Drawing](../06-drawing.md); `addons\\vanacore\\libs\\ashita-4.30\\imgui.lua` has every name.\n- **The window name is stable** (`###partywin`), so the Layout page and `config\\imgui.ini` keep its place and scale by\n  that name whatever the title shows.\n- **A global store** (`scope` left out): the window's scale is the same for every character.\n\n## `README.md`\n\n```markdown\n# partywin\n\nA party window with HP and TP bars. /partywin shows or hides it; drag its Scale slider to size it.\nChanges nothing in the game's interface. Hide the game's own party list with vana.gameui if you want this in its place.\n```\n", "docs/examples/plates.md": "# Plates: widgets over names, updated every frame\n\nA tag, an HP bar and a target marker over the names of the party and the target (`addons\\vanacore\\example-plates\\example-plates.lua`, which\nyou can load as it is: `/addon load example-plates`). It is the shape of a nameplate addon: several boxes stacked at a name, changed every\nframe without being placed again, one of them kept visible through walls.\n\n**Placing a stack once.** Each box is attached above the name with its own `y`, which lifts it from the name's top; the boxes are\ndrawn in the order they were placed, so the bar's frame is placed before its fill:\n\n```lua\nvana.world.attach(plate.back, index, { side = 'above', y = -3 })\nvana.world.attach(plate.fill, index, { side = 'above', y = -4 })\nvana.world.attach(plate.tag,  index, { side = 'above', y = -3 - 8 - 2 - 3 })   -- above the bar\n```\n\n**Changing it every frame.** `box:set{...}` changes what the box shows (its text, a rectangle's width and colour); the picture is\nonly remade when that changed. `vana.world.update(box, {...})` changes how it is placed, and only the options you give:\n\n```lua\nlocal width = math.max(1, math.floor(80 * hpp / 100))\nplate.fill:set({ width = width, color = hp_colour(hpp) })\nvana.world.update(plate.fill, { x = -(80 - width) / 2 })     -- the box is centred on the name: keep the bar's left edge\n```\n\n**Walls per box, at runtime.** `walls = false` draws a box over the world instead of testing it against the world's depth, so\nthe target's plate stays visible behind a wall while the rest are hidden. Change it with `update` whenever the target changes:\n\n```lua\nvana.world.update(plate.tag, { walls = not (index == target_index) })\n```\n\n**One marker for the target.** One box follows the target from name to name with the `index` option, instead of a box per\ncharacter:\n\n```lua\nvana.world.attach(marker, target_index, { side = 'left', x = -4 })     -- once\nvana.world.update(marker, { index = target_index })                    -- each frame after\n```\n\n`vana.world.placement(box)` reads back how a box is placed. A plate is drawn only for characters the game gives a name; to\nreplace the game's names with these, `vana.gameui.hide('nameplates')` leaves the name's place in the world for the boxes\n(`/plates names`). See [Widgets](../18-widgets.md) for every option.\n", "docs/examples/README.md": "# Examples\n\nComplete addons to copy, one per task. Each is a folder under `addons\\vanacore\\` with a `.lua` file of the same name\nand a README that says what it does:\n\n```\naddons\\vanacore\\hidechat\\\n    hidechat.lua      your code\n    README.md         what it does, including what it changes in the game's interface\n```\n\nLoad one with `/addon load <name>` (it's then in `scripts\\boot.txt` and loads every start), stop it with\n`/addon unload <name>`, and after an edit `/addon reload <name>`.\n\n## Getting around the game\n\n| Example | Shows |\n|---------|-------|\n| [zone_greeter.md](zone_greeter.md) | Game events, a task that waits, a per-character settings store, a command with arguments |\n| [party_window.md](party_window.md) | An ImGui window drawn every frame from `vana.game.party()`, with a slider saved to settings |\n| [chat_timestamps.md](chat_timestamps.md) | Reading and changing chat lines with `text_in`: a timestamp on each, and a filter |\n| [web_requests.md](web_requests.md) | Web requests that never stop the game: a callback, `await` in a task, and a WebSocket that reconnects |\n| [wardrobe_stats.md](wardrobe_stats.md) | Reading the Mog Wardrobes with `vana.game.container()`, and a piece's stats, augments, latent effects and sets from CatsEyeXI's data with `vana.gamedata.item_stats` |\n\n## Boxes in the game's 3D space (`vana.world`)\n\n| Example | What it does |\n|---------|--------------|\n| [plates.md](plates.md) | A tag, an HP bar and a target marker stacked over names, changed every frame with `vana.world.update`, the target's kept visible through walls |\n\n## Changing the game's interface (`vana.gameui`)\n\n| Example | What it does |\n|---------|--------------|\n| [hide_chat.md](hide_chat.md) | Hides the game's chat log (the most requested one) |\n| [add_button.md](add_button.md) | Adds a button to the game's Config menu that runs your addon's code |\n| [hide_party_list.md](hide_party_list.md) | Hides the game's party list so you can draw your own (XIUI's case), and does it from an Ashita addon |\n| [move_window.md](move_window.md) | Moves the game's Target window |\n| [replace_menu_item.md](replace_menu_item.md) | Makes Party > Find Member run your addon's code instead of the game's |\n| [custom_equipment.md](custom_equipment.md) | Catches the main menu's Equipment item (`vana.gameui.catch`) and opens your own window in place of the game's; `on('*', 'select')` to find any menu's item ids |\n\nThe calls, what they return, and every element are in [The game's interface](../07-game-interface.md). In short: all one\nword, in pairs (`hide`/`show`, `move`, `add`/`remove`, `replace`/`restore`), each returns `true` when done or\n`false, 'held by X'` when another addon holds a move or a replace, and raises an error for something VanaCore can't do.\nYou never need to undo anything: when your addon unloads, reloads or crashes, VanaCore puts the game's interface back.\n\n## The shipped addons\n\n`addons\\vanacore\\` has VanaCore's own addons, which are examples too:\n\n| Addon | Shows |\n|-------|-------|\n| `apiexplorer` | **Start here.** An ImGui window with two tabs. **Reference**: every table, function and event of the API with what it takes, returns and does (this series' descriptions, checked against the running VanaCore), with Try it and Listen. **Snippets**: calls to run and copy, in groups (the character, party and targets, items, abilities and spells, the world, widgets, game data, web requests, the game's interface, menu triggers). `/addon load apiexplorer`, then `/api` shows or hides it |\n| `example-plates` | `vana.world` widgets over names: a tag, an HP bar and a target marker, updated every frame (`/addon load example-plates`) |\n| `example-hello` | The smallest addon: a `vana.ui.text` box and a command |\n| `example-minparty` | `vana.gameui` (hide, move, add) with a party list drawn in a text box |\n| `sendkey` | Controller and key events, binds saved to a file, `SendInput` through the FFI |\n| `keybinds` | A full ImGui window over `vana.binds`: lists, editing, key capture |\n| `freecam` | `vana.camera` (pose, hold) under an ImGui window drawn with `vana\\draw.lua`, the /vana window's own palette, fonts, icons and controls (an addon has a Lua state of its own, so it loads that file into a table of its own), over a hand-drawn timeline with a 0.25 s snap: keyframes recorded from the free camera and played back as a spline, `vana.settings` for the saved sequences, binds that exist only while the camera is on |\n| `vana` | The /vana window itself: ImGui draw lists, `vana.config`, every panel of VanaCore's settings |\n", "docs/examples/replace_menu_item.md": "# Take over a game menu item: Party > Find Member\n\nYour addon decides what one of the game's menu items does. Here, choosing **Party > Find Member** in the main menu opens\nyour addon's own search instead of the game's.\n\nThis is what VanaCore does for the Party Finder addon today, through a setting made just for it\n(`[client] partyfinder.findmember`). With `replace`, any addon can do it.\n\n## 1. `myfinder.lua`\n\n```lua\naddon.name    = 'myfinder'\naddon.author  = 'You'\naddon.version = '1.0'\naddon.desc    = 'A party search, opened from Party > Find Member.'\n\nlocal imgui = vana.imgui\nlocal open = { false }\n\nvana.events.on('load', function ()\n    vana.gameui.replace('party_menu.find_member', function ()\n        open[1] = true -- the game's own search doesn't run\n    end)\nend)\n\nvana.events.on('present', function ()\n    if not open[1] then\n        return\n    end\n    if imgui.Begin('Find Member', open) then\n        imgui.Text('Your search here.')\n    end\n    imgui.End()\nend)\n```\n\n## 2. Say what it changes\n\nIn your README: \"Party > Find Member opens myfinder's search instead of the game's.\"\n\n## What happens when the player chooses it\n\n1. The game plays its select sound, as for any item.\n2. The game's own search **doesn't** run.\n3. Your function runs on the next frame.\n\nEverything else in the Party menu stays the game's.\n\n## Good to know\n\n- **Give it back** with `vana.gameui.restore('party_menu.find_member')`, for example from a setting in your addon.\n  Unloading does it too.\n- **One addon at a time.** A second addon that asks gets `false, 'held by X'`, and takes over when the first lets go.\n  Open your window some other way too, such as a command, so the addon is still usable then.\n- **Other menu items:** each needs VanaCore to hook that menu first. Find Member is the only one in this mockup;\n  Config buttons are [add_button.md](add_button.md).\n", "docs/examples/wardrobe_stats.md": "# The stats of the gear in your wardrobes\n\nAn addon that prints a wardrobe item's stats to the chat: `/wstats Brutal` prints those of every piece in your Mog\nWardrobes with \"Brutal\" in its name. The stats come from CatsEyeXI's own data (`vana.gamedata.item_stats`), the same the\nEquipment window counts, with the item's augments. It shows reading containers, an item's stats and units, and a command\nwith arguments.\n\n## `wstats.lua`\n\n```lua\naddon.name    = 'wstats'\naddon.author  = 'You'\naddon.version = '1.0'\naddon.desc    = 'Prints the stats of the gear in your wardrobes, from CatsEyeXI\\'s own data.'\n\n-- The Mog Wardrobes' container ids: Wardrobe 1 is 8, Wardrobes 2 to 8 are 10 to 16\nlocal WARDROBES = { 8, 10, 11, 12, 13, 14, 15, 16 }\nlocal MOST = 5 -- pieces printed for one name\n\n-- A modifier as the game writes it: Haste's 500 is \"Haste +5%\"\nlocal function shown(s, name, value)\n    local stat = s.stats[name]\n    return ('%s %+g%s'):format(stat.label, value / stat.unit, stat.percent and '%' or '')\nend\n\n-- { NAME = value } written out, sorted\nlocal function written(s, mods)\n    local out = {}\n    for name, value in pairs(mods) do\n        out[#out + 1] = shown(s, name, value)\n    end\n    table.sort(out)\n    return table.concat(out, ', ')\nend\n\n-- Every piece in the wardrobes: { wardrobe = 1 to 8, slot = the container's slot }\nlocal function pieces()\n    local found = {}\n    for n, container in ipairs(WARDROBES) do\n        local bag = vana.game.container(container)\n        for i = 1, bag and bag.capacity - 1 or 0 do\n            if bag[i] and bag[i].id ~= 0 then\n                found[#found + 1] = { wardrobe = n, slot = bag[i] }\n            end\n        end\n    end\n    return found\nend\n\nlocal SOURCES = {\n    server      = 'the server\\'s data',\n    description = 'its description (changed since the data was made)',\n    unread      = 'the server\\'s data (its description unread)',\n}\n\nlocal function print_stats(piece)\n    local s, why = vana.gamedata.item_stats(piece.slot) -- a slot: its augments are counted too\n    if s == nil then\n        print('No stats: ' .. why)\n        return\n    end\n    print(('%s (%d, Wardrobe %d), from %s:'):format(s.name or '?', s.id, piece.wardrobe, SOURCES[s.source]))\n    if next(s.mods) then\n        print('  ' .. written(s, s.mods))\n    end\n    if s.augments and next(s.augments) then\n        print('  Augments: ' .. written(s, s.augments))\n    end\n    for _, latent in ipairs(s.latents or {}) do\n        print(('  Latent: %s (condition %d, %d)'):format(shown(s, latent.mod, latent.value), latent.condition, latent.param))\n    end\n    for _, set in ipairs(s.sets or {}) do\n        local bonuses = {}\n        for name, values in pairs(set.bonuses) do\n            for i, value in ipairs(values) do\n                bonuses[#bonuses + 1] = ('%s with %d'):format(shown(s, name, value), set.least + i - 1)\n            end\n        end\n        table.sort(bonuses)\n        print(('  Set of %d items: %s'):format(#set.items, table.concat(bonuses, ', ')))\n    end\nend\n\nvana.on('command', function (e)\n    local word, rest = e.command:match('^(/%S+)%s*(.-)%s*$')\n    if word == nil or word:lower() ~= '/wstats' then return end\n    if rest == '' then\n        print('/wstats <part of a name>: the stats of the pieces in your wardrobes named so')\n        return true\n    end\n    local want, shown_count = rest:lower(), 0\n    for _, piece in ipairs(pieces()) do\n        local s = vana.gamedata.item_stats(piece.slot.id)\n        if s and s.name and s.name:lower():find(want, 1, true) and shown_count < MOST then\n            print_stats(piece)\n            shown_count = shown_count + 1\n        end\n    end\n    if shown_count == 0 then\n        print('Nothing in your wardrobes named like \"' .. rest .. '\"')\n    end\n    return true\nend)\n```\n\nWhat it prints, for a Brutal Earring +1 in Wardrobe 2:\n\n```\nBrutal Earring +1 (27537, Wardrobe 2), from the server's data:\n  Double Attack +6%, Store TP +2\n```\n\n## What to notice\n\n- **`vana.gamedata.item_stats(piece.slot)`.** Given a container's slot (`{ id, extra, ... }`), it counts the slot's\n  augments too, as `augments`; given just an id, as in the name search, it has none. [Game data](../04-game-data.md#an-items-stats-vanagamedataitem_stats)\n  has every field.\n- **The values are the server's.** `mods` uses the server's modifier names and units: `value / stats[name].unit` is the\n  number the game shows (Haste: 100 is 1%), and `stats[name].label` its name. A stat the Equipment window doesn't show\n  (DEF, HP, STR...) has `shown = false` and its modifier name as its label.\n- **`source` says where `mods` came from.** `'server'`: CatsEyeXI's server data, the item unchanged since it was made.\n  `'description'`: CatsEyeXI has changed the item since, so the numbers in its description are taken over the server's.\n- **`latents` are conditions, not totals.** `condition` and `param` are the server's (`LATENT` in `latent_effect.h`):\n  whether one is on depends on the character (HP, the weather, the day...).\n- **`vana.game.container(id)` is `nil`** before the inventory has come from the server, and a wardrobe you don't have\n  has no slots, so `pieces()` finds none.\n- **The command returns `true`** so the game doesn't see `/wstats`. (`/ws` is the game's own weapon skill command.)\n\n## `README.md`\n\n```markdown\n# wstats\n\n/wstats <part of a name>: prints the stats of the pieces in your Mog Wardrobes named so, from CatsEyeXI's own data,\ntheir augments, latent effects and sets with them. Changes nothing in the game's interface.\n```\n", "docs/examples/web_requests.md": "# Fetch from the web without stopping the game\n\nAn addon with three commands: `/fetch <url>` shows what an address answers, `/watch` checks a status page once a minute and\nsays when it changes, and `/live` keeps a WebSocket open and prints what it sends (reconnecting when it drops). It shows\na callback, `await` in a task, and a socket. None of it holds up a frame. The calls are in\n[HTTP, WebSockets and promises](../17-http-and-websockets.md).\n\n## `webrequests.lua`\n\n```lua\naddon.name    = 'webrequests'\naddon.author  = 'You'\naddon.version = '1.0'\naddon.desc    = 'Fetches addresses, watches a status page and listens to a WebSocket.'\n\nlocal STATUS_URL = 'https://example.com/status.json'   -- change these to something real\nlocal LIVE_URL   = 'wss://example.com/live'\n\n-- /fetch <url>: a callback. res.ok is false for a 404 (the server did answer); err is set when there was no answer.\nlocal function fetch(url)\n    vana.http.get(url, { timeout = 10 }, function (res, err)\n        if err then\n            return print(('%s: %s (%s)'):format(url, err.message, err.code))\n        end\n        print(('%s: %d %s, %d bytes, %s'):format(url, res.status, res.reason, #res.body, res.headers['content-type'] or '?'))\n    end)\nend\n\n-- /watch: a task that waits. await raises the error when a request fails, so pcall keeps the loop alive.\nlocal watching = false\nlocal function watch()\n    watching = true\n    vana.async(function ()\n        local last\n        while watching do\n            local ok, res = pcall(function () return vana.http.json(STATUS_URL, { timeout = 10 }):await() end)\n            if ok then\n                local state = res.state or '?'\n                if state ~= last then\n                    print('status: ' .. state)\n                    last = state\n                end\n            end\n            coroutine.sleep(60)\n        end\n    end)\nend\n\n-- /live: a WebSocket that comes back by itself\nlocal socket\nlocal live = false\nlocal function connect()\n    socket = vana.ws.connect(LIVE_URL, {\n        on_open    = function (s) s:send({ subscribe = 'events' }) end,    -- a table goes as JSON\n        on_message = function (data)\n            local event = vana.json.decode(data)\n            print('live: ' .. (e
