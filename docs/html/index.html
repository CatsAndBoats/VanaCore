<script>window.VANACORE_DOCS = {"docs/01-getting-started.md": "# 1. Getting started\n\n## The folder\n\nAn addon is a folder under `addons\\vanacore\\` with a Lua file of the same name:\n\n```\naddons\\vanacore\\greeter\\\n    greeter.lua      the code; VanaCore runs this file when the addon loads\n    README.md        what it does, for the player (shown in /vana > Addons)\n```\n\nThe folder's spelling is the addon's display name (`Greeter` if you spell it so), and it names the folder your settings\ngo in. Commands use it in any case: `/addon load greeter`.\n\nOther files are yours to lay out as you like. `require('something')` looks in the addon's folder first (`something.lua`\nor `something\\init.lua`), then in `addons\\vanacore\\libs\\`.\n\n## The smallest addon\n\n```lua\naddon.name    = 'greeter'\naddon.author  = 'You'\naddon.version = '1.0'\naddon.desc    = 'Says hello when you log in.'\n\nvana.on('login', function (e)\n    print('Welcome back, ' .. e.name .. '!')\nend)\n```\n\nSave it as `addons\\vanacore\\greeter\\greeter.lua`, then in the game type:\n\n```\n/addon load greeter\n```\n\nThe chat log says `(VanaCore Addon) Loaded: greeter 1.0 by You`. Log in, and it greets you.\n\n## The `addon` table\n\n`addon` is a table VanaCore gives your file before it runs. Two fields are filled in:\n\n| Field | Value |\n|-------|-------|\n| `addon.name` | The addon's name, lower case |\n| `addon.path` | The addon's folder, without a trailing backslash |\n\nSet the rest yourself. `/addon info <name>` and the /vana window's Addons page show them:\n\n| Field | Shown as |\n|-------|----------|\n| `addon.author` | By whom |\n| `addon.version` | Its version |\n| `addon.desc` | One line on what it does |\n| `addon.link` | A web address; `/addon link <name>` opens it in the browser |\n\nYour file is run once, at load. Code at the top level runs then; everything else happens through events.\n\n## Events, in one paragraph\n\nAn addon does things when VanaCore raises an event. `vana.on(name, fn)` (the same as `vana.events.on`) runs `fn` each\ntime `name` happens. The ones every addon uses:\n\n```lua\nvana.on('load', function () end)       -- after your file has run\nvana.on('unload', function () end)     -- the addon is going: /addon unload, /addon reload, the game closing\nvana.on('present', function () end)    -- once a frame: draw your ImGui windows here\nvana.on('command', function (e) end)   -- every line typed into the chat that starts with /\n```\n\n[Events](02-events.md) lists all of them.\n\n## Printing\n\n`print(...)` writes a line to the game's chat log (and to VanaCore's log). `vana.log(...)` writes to VanaCore's log\nonly, `logs\\vanacore.log`, as `<addon>: <text>`: for what the player needn't see.\n\n```lua\nprint('Loaded', addon.name, addon.version)   -- \"Loaded greeter 1.0\" in the chat\nvana.log('party has', #rows, 'rows')          -- \"greeter: party has 3 rows\" in the log\n```\n\nA coloured line is `vana.chat.write(text, mode)`: see [Chat and commands](05-chat-and-commands.md).\n\n## A command of your own\n\nEvery line the player types that starts with `/` comes to your `command` handler before the game sees it. Return\n`true` to say you took it, so the game doesn't try to run it (and complain):\n\n```lua\nvana.on('command', function (e)\n    local text = e.command:match('^/greet%s+(.+)$')\n    if text ~= nil then\n        print('Hello, ' .. text)\n        return true\n    end\nend)\n```\n\n`e.command` is the whole line as typed. Commands are matched by you, so pick a first word no other addon uses.\n\n## Loading, unloading, reloading\n\n| In the chat | Does |\n|-------------|------|\n| `/addon load <name>` | Loads it from `addons\\vanacore`, else `addons\\ashita`, else `addons\\windower` (several names at once work) |\n| `/addon load <name> vanacore` | From that folder only (`ashita`, `windower`) |\n| `/addon unload <name>` | Runs its `unload` handlers and closes its Lua |\n| `/addon reload <name>` | Unload, then load again from the folder it came from: your edit-test loop |\n| `/addon kill <name>` | Unloads without running `unload` (for an addon stuck in a bad state) |\n| `/addon list` | What's loaded |\n| `/addon info <name>` | Its file, version, author, description, link, memory and state |\n| `/addon exec <name> <lua>` | Runs Lua inside the addon; what it prints goes to the chat log |\n| `/addon unloadall` | Unloads every Ashita and Windower addon (VanaCore's own stay) |\n| `/addon silent [0\\|1]` | No chat line as addons load and unload |\n\n`//addon ...` works the same. The /vana window's **Addons** page has a switch per addon that does the same as load and\nunload.\n\nOnly one addon of a name is loaded at a time. When an addon unloads, VanaCore removes everything it made: its text\nboxes and pictures, its ImGui windows, what it changed in the game's interface, and saves its settings. You don't have\nto clean up yourself, though an `unload` handler may.\n\n## Loading at every start: `scripts\\boot.txt`\n\n`scripts\\boot.txt` next to `VanaCore.exe` runs when the game starts. Each line is a command as you'd type it; `#` starts\na comment, and `/wait <seconds>` delays the lines after it:\n\n```\n/addon load greeter\n/addon load tparty\n```\n\nA typed `/addon load` or `/addon unload`, and the /vana window's switches, keep `boot.txt` in step: loading an addon\nadds a `//addon load <name> <kind>` line unless one loads it already, and unloading takes the name out. So loading an\naddon once means it loads from then on.\n\nBy default (`[addons] delay.login=1` in `vanacore.ini`) `boot.txt`'s `/addon` lines don't run at the title screen but\nonce a character is in the world, so your `load` handler can read the character straight away. `/addon load` typed by\nhand isn't held.\n\n## What's in your Lua\n\n- **Lua 5.1 with LuaJIT 2.1**: `string`, `table`, `math`, `os`, `io`, `coroutine`, `debug`, plus `ffi`, `bit` and\n  `jit`. `io.open` works on any path (paths in the ANSI code page). `vana.paths` has the folders you'll want\n  ([Settings and files](08-settings-and-files.md)).\n- **`vana`**: VanaCore's API, the subject of this series.\n- **`addon`**: your addon's table, above.\n- **`print`**: to the chat log.\n- **`coroutine.sleep(seconds)`** and **`coroutine.sleepf(frames)`**, inside a task ([Tasks and timing](03-tasks-and-timing.md)).\n- **Libraries**: `require('ashita.json')`, `require('ashita.common')` and the rest of `addons\\vanacore\\libs\\`; LuaSocket's C\n  half is built in (`require('socket.core')`).\n- **Text is bytes.** Your file is UTF-8; the game's text (names, chat) is Shift-JIS. `vana.encoding` converts\n  ([Chat and commands](05-chat-and-commands.md)).\n\n## When things go wrong\n\nAn error in a handler is reported in the chat log and in `logs\\vanacore.log` with its traceback, and the addon keeps\nrunning: the rest of its handlers for that event still run. An error that repeats on every frame for 5 seconds unloads\nthe addon, with the reason in the chat. [Developing and debugging](14-dev-workflow.md) has the rest: tracing an addon,\nrunning Lua in it live, profiling, and what a crash (a bad FFI pointer) does.\n\n## Next\n\n- [Events](02-events.md): everything that can happen, and what each event hands you.\n- [Examples](examples/README.md): complete addons to copy.\n", "docs/02-events.md": "# 2. Events\n\nAn addon runs code when VanaCore raises an event. This page lists every event, what it hands your handler, and what\nreturning `true` does.\n\n## Listening\n\n```lua\nvana.events.on(name, fn[, key])   -- fn runs each time `name` is raised; returns the key\nvana.events.off(name, key)        -- removes it; true if one was removed\nvana.on, vana.off                 -- the same, shorter\n```\n\n- `name` is case-insensitive.\n- `key` names the handler so you can remove it, or replace it (a second `on` with the same key replaces the first).\n  Without one, the function itself is the key: `vana.off('present', fn)`.\n- Handlers run in the order they were added. An error in one is reported and the rest still run.\n- You can listen for an event VanaCore doesn't raise. Nothing happens, and the log notes it once.\n\n**Cost.** VanaCore calls into your addon only for events it listens for. An addon with no `mouse` handler is never\ncalled for the mouse; one with no game-event handler never has the game's state compared frame to frame. Keep\nhandlers for high-rate events (`present`, `packet_in`, `mouse`, `key_state`, the `d3d_*` draws) short.\n\n**Blocking.** For an event the game would act on (a command, a chat line, a packet, a key, a controller button, a draw\ncall), a handler that returns `true` takes it: the game never sees it. Where the event is a table, setting\n`e.blocked = true` does the same. Once blocked, later addons' handlers still run and see `e.blocked == true`.\n\n## The addon's own\n\n| Event | Handler gets | Return |\n|-------|--------------|--------|\n| `load` | nothing | |\n| `unload` | nothing | |\n| `present` | nothing | |\n\n- **`load`** runs once your file has run. Code at the top level of your file runs before it, so either place works;\n  `load` keeps set-up together.\n- **`unload`** runs on `/addon unload`, `/addon reload`, and as the game closes. Not on `/addon kill`, nor after a\n  crash. After your handlers, VanaCore saves your settings stores and removes everything you drew.\n- **`present`** runs once a frame, from the game's `Present`, after your tasks. Draw ImGui windows here, and read\n  anything that changes frame to frame. Nothing is passed; `vana.tasks.frame()` counts the frames.\n\n## Commands and chat\n\n| Event | `e` | Return `true` |\n|-------|-----|---------------|\n| `command` | `command` (the line), `mode`, `injected`, `blocked` | The game doesn't run the line |\n| `unhandled` | `command` (a `//` line nothing took, without the `//`) | Taken: no \"Unknown command\" |\n| `text_in` | `mode`, `mode_modified`, `indent`, `indent_modified`, `message`, `message_modified`, `injected`, `blocked` | The line isn't shown |\n| `text_out` | `mode`, `mode_modified`, `message`, `message_modified`, `injected`, `blocked` | The line doesn't go to the game |\n\n- **`command`**: every command line the game is about to run, typed or sent by an addon. `e.mode` is the chat mode\n  it was typed in (1 for the chat box); `e.injected` is true for a line VanaCore or an addon ran (`vana.chat.run`, a\n  script, a bind). VanaCore's own commands (`/addon`, `/vana`, `/bind`) are taken before addons see them. Plugins with a\n  negative priority see lines before addons; the rest after.\n- **`unhandled`**: a `//something` line no addon or plugin took. Return `true` to claim it, else the chat log says\n  `Unknown command`.\n- **`text_in`**: a line coming into the chat log, after plugins. Change `e.message_modified` (and `e.mode_modified`,\n  `e.indent_modified`) to change what's shown. The text is Shift-JIS with the game's own control codes in it. `e.mode`\n  is the game's three mode bytes (`mode | flags << 8 | ... << 16`); the chat mode itself is `bit.band(e.mode, 0xFF)`.\n  A line your own addon prints doesn't come back to your `text_in`, but does reach other addons'.\n- **`text_out`**: a line the player typed that isn't a command, on its way to the game as chat.\n\n[Chat and commands](05-chat-and-commands.md) has examples.\n\n## The game's state\n\nThese are raised when something changed in the game since the last frame. VanaCore compares the game's state once a\nframe, and only the parts some addon listens for. `e` is a table.\n\n| Event | When | `e` |\n|-------|------|-----|\n| `login` | A character is in the world | `name`, `id`, `zone` |\n| `logout` | Back at the title screen or character select (or another character logged in) | `name` |\n| `zone_out` | The server sent the character out of its zone | `zone` (the one being left) |\n| `zone_change` | The server put the character in a zone: every zone-in after login, Mog House in and out too (the zone can be the same) | `zone`, `previous` |\n| `job_change` | The main job changed | `job`, `job_name`, `level`, `previous`, `previous_name`, `previous_level` |\n| `subjob_change` | The support job changed (0 and `\"\"` for none) | the same |\n| `level_change` | The main job's level changed, the job the same (level sync too) | `job`, `job_name`, `level`, `previous_level` |\n| `target_change` | The main target changed (index 0: none) | `index`, `id`, `previous_index`, `previous_id` |\n| `main_menu_open`, `main_menu_close` | The main menu (either page) | |\n| `action_menu_open`, `action_menu_close` | The action menu (Attack, Magic, ...) | |\n| `chat_input_open`, `chat_input_close` | The chat line | |\n| `menu_open`, `menu_close` | Any of the game's windows, by name | `name` |\n\n- `job_name` is the three-letter name (`'WAR'`). `login` carries the zone, so the login's own zone-in isn't a\n  `zone_change`.\n- `menu_open` / `menu_close`: `e.name` is the window's layout name without its `menu    ` start: `menuwind` (the main\n  menu), `socialme` (its second page), `playermo` (the action menu), `searchma` (Search), `partywin` (the party list),\n  `logwindo` (the chat log), `targetwi` (the Target window), `buff` (status icons), and so on. To find a window's name,\n  print them:\n\n```lua\nvana.on('menu_open', function (e) print('open', e.name) end)\nvana.on('menu_close', function (e) print('closed', e.name) end)\n```\n\n  The game builds some windows again when you zone or the party changes, so those close and open again then.\n\n```lua\nvana.on('zone_change', function (e)\n    print(('Zoned from %d to %d'):format(e.previous, e.zone))\nend)\n\nvana.on('job_change', function (e)\n    print(('Now %s%d (was %s%d)'):format(e.job_name, e.level, e.previous_name, e.previous_level))\nend)\n```\n\n## Packets\n\n| Event | `e` | Return `true` |\n|-------|-----|---------------|\n| `packet_in` | `id`, `size`, `data`, `data_raw`, `data_modified`, `data_modified_raw`, `chunk_size`, `chunk_data`, `chunk_data_raw`, `injected`, `blocked` | The game doesn't get it |\n| `packet_out` | the same | The packet isn't sent |\n\n`data` is the packet as a string, its 4-byte header first; `data_modified` is what the game will get: assign a new\nstring to change it (the same length). `*_raw` are pointers for the FFI. `chunk_*` is the whole buffer the packet came\nin. [Packets](10-packets.md) has the layout, examples and `vana.packets`.\n\n## Keyboard and mouse\n\n| Event | Handler gets | Return `true` |\n|-------|--------------|---------------|\n| `key` | `wparam, lparam, blocked` (not a table) | The game's window doesn't get the key |\n| `mouse` | `type, x, y, delta, blocked, modifiers` (not a table) | The game doesn't get the mouse message |\n| `key_state` | `e.data` (256 bytes), `e.data_raw`, `e.size` | |\n| `key_data` | `e.key`, `e.down`, `e.injected`, `e.blocked` | The game doesn't get the key |\n\n- **`key`**: the game window's key messages: `wparam` the virtual-key code, `lparam` Windows' (bit 31 set for a\n  release, bit 30 for a repeat). While the chat line is open, Ashita and Windower addons don't get presses; VanaCore\n  addons do.\n- **`mouse`**: `type` is the Windows message less `0x200`: 0 move, 1 left down, 2 left up, 4 right down, 5 right up,\n  7 middle down, 8 middle up, 10 wheel. `x, y` in VanaCore's interface pixels (`vana.ui.screen()`'s), `delta` the wheel's\n  turn (120 a notch), `modifiers` the keys held: 1 Shift, 2 Ctrl, 4 Alt. A press or wheel over an ImGui window is\n  ImGui's: you hear it with `blocked` true.\n- **`key_state`**: each read of the game's DirectInput keyboard: `e.data` the 256 key states (DirectInput key codes,\n  `0x80` set while down). Write through `e.data_raw` with the FFI to make the game see a key.\n- **`key_data`**: each buffered DirectInput key event: `e.key` the DIK code.\n\n[Input](09-input.md) has all of it, with `vana.binds` for key binds.\n\n## Controllers\n\n| Event | `e` | Return `true` |\n|-------|-----|---------------|\n| `xinput_button` | `button`, `state`, `injected`, `blocked` | The game doesn't see the press |\n| `dinput_button` | the same | |\n| `xinput_state` | `user`, `state` and `state_modified` (pointers to the same XINPUT_STATE) | |\n\nA handler may change `e.button` and `e.state` in place. [Input](09-input.md) has the numbering.\n`xinput_state` is the whole state the game is about to read: a handler changes it through either pointer (Ashita addons\nwrite `state_modified`, as in Ashita 4.30).\n\n## Drawing and the scene\n\n| Event | Handler gets | Return `true` |\n|-------|--------------|---------------|\n| `beginscene`, `endscene` | `back_buffer` (not a table) | |\n| `d3d_dp` | `e.primitive_type`, `e.start_vertex`, `e.primitive_count` | The draw is skipped |\n| `d3d_dip` | `e.primitive_type`, `e.min_index`, `e.num_vertices`, `e.start_index`, `e.primitive_count` | |\n| `d3d_dpup` | `e.primitive_type`, `e.primitive_count`, `e.vertex_stream_zero_data`, `e.vertex_stream_zero_stride` | |\n| `d3d_dipup` | `e.primitive_type`, `e.min_vertex_index`, `e.num_vertex_indices`, `e.primitive_count`, `e.index_data`, `e.index_data_format`, `e.vertex_stream_zero_data`, `e.vertex_stream_zero_stride` | |\n\nThe game's own scenes and draw calls, as Ashita's addons have them. `beginscene` comes after the game's `BeginScene`\nand `endscene` before its `EndScene`; `back_buffer` says whether the scene draws on the back buffer (not a shadow map\nor the like). The `d3d_*` events fire for every draw call the game makes: thousands a frame. Pointers are light\nuserdata for the FFI. Listening for any of them costs every frame; don't unless you need them.\n\n## Between addons and clients\n\n| Event | `e` | When |\n|-------|-----|------|\n| `plugin_event` | `name`, `data`, `data_raw`, `size` | A plugin or addon raised an event (`vana.plugins.raise`), at the next frame |\n| `ipc` | `message` | The addon of your name in another VanaCore instance on this PC sent `vana.ipc.send(text)` |\n| `gameui_button` | `element` | The player chose your button in a game menu (you use `vana.gameui.add`'s `fn` instead) |\n| `gameui_replaced` | `element` | The player chose a menu item you took over (you use `vana.gameui.replace`'s `fn`) |\n| `gameui_trigger` | `trigger`, `menu`, `key`, `item`, `name`, `caught` | The player did something in a game menu you set a trigger on (you use `vana.gameui.on` / `catch`'s `fn` instead) |\n| `gameui_window` | `element`, `what` | A game window you watch opened, changed or closed (`what`: `'open'`, `'change'`, `'close'`; you use `vana.gameui.watch`'s `fn` instead) |\n\n[System](12-system.md) covers `vana.plugins` and `vana.ipc`; [The game's interface](07-game-interface.md) covers\n`vana.gameui`, which handles the `gameui_*` events for you.\n\n## Order of a frame\n\nEach frame, on the game's thread, VanaCore:\n\n1. Runs any queued `plugin_event`, `gameui_*` and `ipc` events.\n2. Compares the game's state and raises the game events (`zone_change`, `menu_open`, ...).\n3. For each addon in load order: runs its due tasks, then its `present` handlers.\n\n`command`, `text_*`, `packet_*`, `key`, `mouse` and the rest come as they happen, between frames, on the same thread.\nFunctions that draw (`vana.imgui.*`) do nothing outside a frame, so draw from `present`, and from a command handler set\na flag that `present` reads.\n", "docs/03-tasks-and-timing.md": "# 3. Tasks and timing\n\nLua has no threads here and nothing may block the game, so \"do this in two seconds\" and \"do this every minute\" are\ntasks: functions run as coroutines from the frame loop, which can wait with `coroutine.sleep`.\n\n## The clock\n\n```lua\nvana.time.clock()   -- seconds since an arbitrary start, to the microsecond (QueryPerformanceCounter)\nvana.tasks.frame()  -- the frames this addon has seen since it loaded\n```\n\n`vana.time.clock()` is for measuring and timing. For the time of day use `os.time()` and `os.date()` as usual; for the\nserver's time, `vana.game.world().server_time` ([Game data](04-game-data.md)).\n\n## Running something later\n\n```lua\nvana.tasks.once(delay, fn, ...)    -- fn(...) once, `delay` seconds from now\nvana.tasks.oncef(delay, fn, ...)   -- fn(...) once, `delay` frames from now\nvana.tasks.cancel(task)            -- stops a task before its next run\n```\n\nBoth return a handle for `cancel`. A delay of 0 runs on the next frame.\n\n```lua\nvana.on('zone_change', function (e)\n    vana.tasks.once(2, function ()\n        print('Zone ' .. e.zone .. ' has loaded, more or less')\n    end)\nend)\n```\n\n## Running something repeatedly\n\n```lua\nvana.tasks.repeating(delay, repeats, every, fn, ...)   -- fn(...) `repeats` times: after `delay` s, then every `every` s\nvana.tasks.repeatingf(delay, repeats, every, fn, ...)  -- the same, counting frames\n```\n\nFor \"forever\", use a task of your own with a loop (below): it's clearer, and you can stop it.\n\n## Waiting inside a task\n\nInside a task (one started with `once`, `oncef`, `repeating`, `repeatingf` or `spawn`), two functions pause it and let\nthe game go on:\n\n```lua\ncoroutine.sleep(seconds)   -- carries on after `seconds`\ncoroutine.sleepf(frames)   -- carries on after `frames` frames\n```\n\nA plain `coroutine.yield()` carries on next frame. So a sequence that waits reads as straight code:\n\n```lua\nlocal function announce(text)\n    vana.chat.run('/p ' .. text)\n    coroutine.sleep(1)\n    vana.chat.run('/p 3')\n    coroutine.sleep(1)\n    vana.chat.run('/p 2')\n    coroutine.sleep(1)\n    vana.chat.run('/p 1')\nend\n\nvana.on('command', function (e)\n    if e.command:match('^/countdown') then\n        vana.tasks.once(0, announce, 'Pulling in')\n        return true\n    end\nend)\n```\n\n```lua\n-- a loop that runs until the addon unloads, or `running` is cleared\nlocal running = true\nvana.tasks.once(0, function ()\n    while running do\n        local party = vana.game.party()\n        if party then\n            -- look at the party\n        end\n        coroutine.sleep(5)\n    end\nend)\nvana.on('unload', function () running = false end)\n```\n\n## Running now, waiting later\n\n```lua\nvana.tasks.spawn(fn, ...)\n```\n\nRuns `fn(...)` straight away as a task. If it waits (sleeps), the rest runs later from the frame loop; if it finishes\nwithout waiting, `spawn` returns `true` and `fn`'s results. Use it when the first part should happen now (answer a\ncommand) and the rest later.\n\n## Waiting for the network\n\nA web request never blocks the game: `vana.http.get(url)` returns a promise at once, and inside a task `:await()` waits for\nit the way `coroutine.sleep` waits for time. See [HTTP, WebSockets and promises](17-http-and-websockets.md).\n\n```lua\nvana.async(function ()\n    local res = vana.http.get('https://example.com/status'):await()\n    print(res.status)\nend)\n```\n\n## Rules\n\n- **Tasks run on the game's thread,** from the frame loop before `present`. Everything in `vana` is safe to call from\n  one. A task that takes long holds up the frame, like a handler does.\n- **An error in a task** is reported like a handler's, with its traceback, and ends that task. Other tasks go on.\n- **Timing is per frame.** `sleep(0.5)` wakes on the first frame at or after half a second; at 60 fps that is within\n  17 ms. Frame counts are exact.\n- **New tasks join the queue as they go,** so a task scheduled while the queue runs starts on a later frame, never\n  this one.\n- **Tasks end with the addon.** Nothing runs after `unload`.\n\n## Doing work in slices\n\nA long job (walking the inventory, parsing a file, scanning memory) stutters the game if done at once. Do a slice a\nframe:\n\n```lua\nvana.tasks.once(0, function ()\n    for index = 0, 80 do\n        local bag = vana.game.container(0)\n        if bag and bag[index] and bag[index].id ~= 0 then\n            -- look at one item\n        end\n        if index % 10 == 9 then\n            coroutine.yield() -- next frame\n        end\n    end\nend)\n```\n", "docs/04-game-data.md": "# 4. Game data\n\n`vana.game` reads FINAL FANTASY XI's own data out of the running game: the character, the party and alliance, every\nentity around you, the target, your inventory and equipment, recast timers. Each call reads the game fresh and returns\na new table, or `nil` when the data isn't there (before login, at the character select, between zones). Names are text\nas the game holds them, Shift-JIS ([Chat and commands](05-chat-and-commands.md) says how to convert).\n\nTo see any of it live, `/addon load apiexplorer`: the shipped API Explorer addon's Reference tab has each call on this\npage, and its Snippets tab runs them and prints what comes back, with the code to copy\n([The API Explorer](16-character-menus-and-tables.md#4-the-api-explorer)).\n\n## Who's logged in\n\n```lua\nlocal name, id = vana.game.character()   -- 'Vekien', 12345678; nil before login\n```\n\n`nil` before a character is in the world, at the character select, and while the game has no player. This is what\n`vana.settings` keys a character's folder on, and what the `login` event announces.\n\n## The player, cheaply\n\n```lua\nlocal id, zone, job, level, subjob, sublevel, status, target, hp, mp, tp, hpp, mpp = vana.game.self()\n```\n\nThirteen numbers, no table: for code that runs every frame (the Windower layer derives its `hp change` and friends\nfrom this). `nil` before login, at the character select and whenever the player isn't in the world (no entity in party\nslot 1). `status` is the entity status (0 idle, 1 engaged, 2 dead, 3 engaged dead, 4 in an\nevent, 5 on a chocobo, 33 resting, 44 crafting, 47 sitting, 85 fishing), `target` the main target's index (0 for none).\n\n## The player's stats and buffs\n\n```lua\nlocal p = vana.game.player()\n```\n\n| Field | What |\n|-------|------|\n| `hp_max`, `mp_max` | Maximums (current HP, MP and TP are in party slot 1, below) |\n| `main_job`, `main_job_level`, `sub_job`, `sub_job_level` | Job ids (table below) and levels. The server's own values, so they're right from the first frame after login |\n| `exp`, `exp_needed` | Experience points into the level, and the level's total |\n| `stats` | `{ str, dex, vit, agi, int, mnd, chr }`: the base stats |\n| `stat_modifiers` | The same keys: what gear and buffs add (the green and red numbers) |\n| `attack`, `defense` | As the status window shows them |\n| `resists` | `{ fire, ice, wind, earth, lightning, water, light, dark }`: the elemental resistances |\n| `title` | The title's id |\n| `nation` | 0 San d'Oria, 1 Bastok, 2 Windurst |\n| `rank`, `rank_points` | The nation rank, and the rank points toward the next |\n| `homepoint` | The home point's zone id |\n| `residence` | The residence's id |\n| `gil` | What the inventory holds (its slot 0) |\n| `limit_points`, `merit_points`, `merit_points_max` | Limit points toward the next merit, merits unspent, and the most the character can hold |\n| `limit_breaker`, `exp_locked`, `limit_mode` | Merits unlocked; at the level cap (also set in limit mode); limit mode on |\n| `assimilation_points` | Blue Mage |\n| `su_level` | Superior equipment level |\n| `item_level` | `{ highest, average, main, ranged }`: item levels, the average's as the part over 99 (0 below level 99) |\n| `unity` | `{ faction, points, evaluation, evaluation_partial, chat_color }` |\n| `mastery` | `{ job, level, flags, exp, exp_needed }`: job mastery |\n| `mount_recast` | The mount's recast |\n| `buffs` | `[1..32]` status effect ids; `-1` or `255` for an empty slot |\n| `status_icons`, `status_timers` | `[1..32]` the status timers' icons (`255` for none) and their ends, the server's values from its status packet (0x063): Windower's addons read a timer as `timer / 60 + 1582473106` Unix seconds |\n| `homepoints` | 64 bytes, a bit per home point known (`has_bit` below works on it) |\n| `data_loaded`, `sub_map` | The game's flags for which of this the server has sent; the sub-map number |\n\nSkills, job points, every job's level, the pet, missions, linkshells and merits have calls of their own, below.\n[16. The character, the menus and the game's tables](16-character-menus-and-tables.md) says where each comes from.\n\n```lua\nlocal function has_buff(id)\n    local p = vana.game.player()\n    if p == nil then return false end\n    for _, buff in ipairs(p.buffs) do\n        if buff == id then return true end\n    end\n    return false\nend\n```\n\n### Job ids\n\n| id | Job | id | Job | id | Job |\n|----|-----|----|-----|----|-----|\n| 0 | none | 8 | DRK | 16 | BLU |\n| 1 | WAR | 9 | BST | 17 | COR |\n| 2 | MNK | 10 | BRD | 18 | PUP |\n| 3 | WHM | 11 | RNG | 19 | DNC |\n| 4 | BLM | 12 | SAM | 20 | SCH |\n| 5 | RDM | 13 | NIN | 21 | GEO |\n| 6 | THF | 14 | DRG | 22 | RUN |\n| 7 | PLD | 15 | SMN | 23 | MON |\n\nThe `job_change` event hands you the name (`e.job_name`) as well.\n\n## Skills, crafts and job points\n\n```lua\nlocal skills = vana.game.skills()        -- nil before login\nskills[9]                                -- { name = 'katana', skill = 236, capped = true }\nlocal crafts = vana.game.crafts()\ncrafts[6]                                -- { name = 'bonecraft', skill = 100, rank = 9, capped = true }\nlocal points = vana.game.job_points()\npoints[13]                               -- { capacity = 0, points = 0, spent = 0 }: NIN's job points\n```\n\nSkills are by the game's skill id, each `{ name, skill, capped }`: 1 hand_to_hand, 2 dagger, 3 sword, 4 great_sword, 5 axe,\n6 great_axe, 7 scythe, 8 polearm, 9 katana, 10 great_katana, 11 club, 12 staff, 22 automaton_melee, 23 automaton_archery,\n24 automaton_magic, 25 archery, 26 marksmanship, 27 throwing, 28 guard, 29 evasion, 30 shield, 31 parrying, 32 divine_magic,\n33 healing_magic, 34 enhancing_magic, 35 enfeebling_magic, 36 elemental_magic, 37 dark_magic, 38 summoning_magic, 39 ninjutsu,\n40 singing, 41 stringed_instrument, 42 wind_instrument, 43 blue_magic, 44 geomancy, 45 handbell. `capped` is set while the\nskill is at its cap for the level. Crafts are `{ name, skill, rank, capped }` by craft: 0 fishing, 1 woodworking, 2 smithing,\n3 goldsmithing, 4 clothcraft, 5 leathercraft, 6 bonecraft, 7 alchemy, 8 cooking, 9 synergy, 10 riding, 11 digging; `rank`\nis the guild rank (0 Amateur to 9 Veteran), `capped` set when the next rank is needed. Job points are by job id,\n`{ capacity, points, spent }`.\n\n```lua\nlocal skills = vana.game.skills()\nif skills then\n    for _, s in pairs(skills) do\n        if s.skill > 0 then print(('%-20s %3d%s'):format(s.name, s.skill, s.capped and ' (capped)' or '')) end\n    end\nend\n```\n\n## Every job's level\n\n```lua\nlocal jobs = vana.game.jobs()   -- nil while the game can't say\njobs[13].level                  -- NIN's level\njobs[13].master_level           -- and its master level\n```\n\nBy job id, `{ level, master_level }`, from the game's own getters (what Ashita's `GetJobLevel` calls): 0 for a job not yet\nunlocked.\n\n## The pet\n\n```lua\nlocal pet = vana.game.pet()   -- nil without a pet\n```\n\n| Field | What |\n|-------|------|\n| `index` | The pet's entity index (`vana.game.entity(pet.index)` for its position and the rest) |\n| `id`, `name` | Its entity's, when it's in range |\n| `hpp`, `mpp`, `tp` | The server's last word on them (its pet status packet, 0x068) |\n| `target_id` | What it's fighting (server id; 0 for nothing) |\n| `owner_index`, `owner_id` | The owner, as the packet named them |\n\nThe game keeps the server's last pet status; a released pet reads as none. The entity has its HP% too (`hpp`) and the\nowner's entity its `pet_index`.\n\n## Missions\n\n```lua\nlocal m = vana.game.missions()   -- nil until the server has sent the current missions (at login)\n```\n\n| Field | What |\n|-------|------|\n| `nation`, `nation_mission` | The nation (0 San d'Oria, 1 Bastok, 2 Windurst) and its current mission's id; `65535` for none |\n| `zilart`, `promathia`, `adoulin`, `rhapsodies`, `voracious` | The current mission in each of those, as the server numbers them |\n| `promathia_progress` | A nibble per chapter |\n| `crystalline_prophecy`, `moogle_kupo_detat`, `shantotto_ascension` | The add-ons' current missions (4 bits each) |\n| `declined` | Expansions the player turned down: bit 0 Zilart, 1 ACP, 2 ASA, 3 Promathia, 5 Adoulin, 6 Rhapsodies |\n\nThese are the game's own copy of the server's mission log (packet 0x056), the values as the server sends them (Treasures\nof Aht Urhgan and Wings of the Goddess aren't in that log). Quests and completed missions aren't read.\n\n## Linkshells\n\n```lua\nlocal ls = vana.game.linkshell(1)   -- the linkshell; vana.game.linkshell(2) is linkshell 2. nil when there's none to say\n```\n\n| Field | What |\n|-------|------|\n| `slot` | 1 or 2 |\n| `name` | The linkshell's name |\n| `message`, `poster`, `time` | Its message (Shift-JIS), who set it and when (Unix seconds); from the server's message packet (0x0CC), at login and when it changes |\n| `read_level`, `write_level`, `public_edit_level` | The message's permissions |\n| `rank`, `color`, `id` | From the pearl equipped for it in the inventory: 1 linkshell, 2 pearlsack, 3 linkpearl; the colour word; the linkshell's id |\n| `item`, `item_id` | The pearl's inventory index and item id (513 linkshell, 514 pearlsack, 515 linkpearl) |\n\nThe game has no readable copy of a linkshell's name, so VanaCore keeps the server's message packets per slot (they go at\nlogout) and reads the equipped pearls' names out of their extra data; a slot with no message yet still has its pearl's\nfields. `slot` is optional (1 by default). Without a pearl equipped for the slot, `rank`, `color`, `id`, `item` and\n`item_id` are left out; without a message, `message`, `poster`, `time` and the three levels are. The `linkshell change` event (Windower layer) and chat mode 6 / 213 lines come from the same linkshells.\n\n## Merits\n\n```lua\nlocal merits = vana.game.merits()   -- {} before the server has listed them\nmerits[128]                         -- { count = 3, next = 4 }: STR merits bought, and the next one's cost\n```\n\nBy merit id (Windower's `res/merit_points.lua` names them), from the server's merit list (0x08C: the whole list at login,\nthe changed ones as they're bought). The points to spend are `vana.game.player().merit_points`.\n\n## The party and alliance\n\n```lua\nlocal party = vana.game.party()\n```\n\n| Field | What |\n|-------|------|\n| `members` | `[1..18]`: slots 1 to 6 your party (slot 1 is you), 7 to 12 and 13 to 18 the other two alliance parties |\n| `leader` | The alliance leader's server id |\n| `party_leaders` | `[1..3]`: each party's leader's id |\n| `party_counts` | `[1..3]`: how many members each party has |\n\nEach member:\n\n| Field | What |\n|-------|------|\n| `active` | `true` when the slot is filled. Check it first |\n| `slot` | 0 to 17 |\n| `name`, `id` | Name and server id |\n| `target_index` | The member's entity index: 0 while out of the zone (then `vana.game.entity` can't see them) |\n| `hp`, `mp`, `tp` | Current values |\n| `hpp`, `mpp` | Percents |\n| `hp_max`, `hp_max_low`, `hp_max_high`, `hp_max_source`, `mp_max`, ... | The maximums the game never gives for anyone but you: [below](#maximum-hp-and-mp) |\n| `zone` | The zone the member is in |\n| `main_job`, `main_job_level`, `sub_job`, `sub_job_level` | |\n| `flags` | The game's flags word |\n\n```lua\nlocal party = vana.game.party()\nif party then\n    for slot = 1, 6 do\n        local m = party.members[slot]\n        if m.active then\n            print(('%-12s %3d%% HP  %4d TP  %s'):format(m.name, m.hpp, m.tp, m.zone == party.members[1].zone and '' or '(away)'))\n        end\n    end\nend\n```\n\nA party can hold a seventh member on CatsEyeXI (a fourth trust let in while a member is out of the zone). The list\nreads six, as the game draws six.\n\n## Entities\n\nAnything with a target index: players, NPCs, monsters, pets, doors, home points.\n\n```lua\nlocal e = vana.game.entity(index)    -- nil if there's nothing at that index\nlocal n = vana.game.entity_count()   -- how many slots there are (2304)\n```\n\n| Field | What |\n|-------|------|\n| `index` | Target index, 0 to `entity_count() - 1`. Players and NPCs of the zone have fixed indexes; players are 0x400 and up |\n| `id` | Server id |\n| `name` | Shift-JIS |\n| `x`, `y`, `z` | Position. `z` is height, the game's way round: up is a smaller `z`; `x`, `y` are the map plane |\n| `heading` | Radians |\n| `distance` | To you, **squared** yalms, as the game keeps it: `math.sqrt(e.distance)` for yalms |\n| `speed` | Movement speed |\n| `hpp` | HP percent |\n| `type` | 0 player, 1 NPC or monster, 2 NPC with a fixed model, 3 door or similar |\n| `race` | Race id |\n| `status` | As `vana.game.self()`'s |\n| `spawn_flags` | `0x01` player, `0x02` NPC, `0x10` monster, `0x0D` the local player |\n| `model_size`, `hitbox_size` | |\n| `claim` | Claim word; its low word is the claimer's id |\n| `target_index` | What it's targeting (not kept for the local player) |\n| `pet_index` | Its pet's index |\n| `render_flags`, `name_flags` | The game's flag words; `render_flags` bit `0x200` is set while it can be targeted |\n| `valid_target` | That bit as a boolean |\n| `name_x`, `name_top`, `name_bottom` | Where its name over its head is on the screen, in the interface's pixels (`vana.ui.screen`'s): its place across (the name is centred on it) and the letters' top and bottom as the game drew them in the last moments, so it follows a tall hat or a big monster. Left out (`nil`) while its name isn't drawn: too far, or hidden by the nameplates settings. The same as [`vana.world.name_at`](18-widgets.md#where-a-name-is-vanaworldname_at). VanaCore 0.8.224 or later |\n| `models` | `[1..9]`: hair, head, body, hands, legs, feet, main, sub, ranged |\n| `distance_yalms` | The square root of `distance` |\n| `is_pc`, `is_npc`, `is_monster`, `is_self` | `spawn_flags`' bits `0x01`, `0x02`, `0x10`, and `0x0D` (the local player) as booleans |\n| `claim_id`, `claimed` | `claim`'s low word (the claimer's id) and its high-word flag |\n| `anim_speed`, `door_id` | The animation speed; a door's id (`_6er`) |\n| `render` | `[1..9]`: the render flag words 0 to 8 (`render_flags` and `name_flags` are the first two; the third is the second name flags: bazaar, GM icon) |\n| `status_server`, `status_event` | The status as the server sent it; the status while it talks to an NPC or is in an event |\n| `costume_id`, `mount_id`, `zone_id` | Its costume, its mount (while the status is 85) and its zone (only the local player's, under conditions) |\n| `animations` | `[1..10]`: the animations it plays |\n| `animation_time`, `animation_step`, `animation_play` | The current animation's time and step, and the flag that makes it play |\n| `emote_id`, `emote_target_index` | The emote it performs and who it is aimed at |\n| `last_action_id` | Its last action's id (talking to some NPCs sets it to `tlk0`) |\n| `name_color`, `linkshell_color`, `campaign_name_flag`, `ballista_flags` | Name colour code; linkshell colour (BGR); the campaign sword; Ballista's |\n| `interaction_target_index` | Who it last talked to |\n| `fellow_index`, `trust_owner_index` | Its adventuring fellow; a trust's owner |\n| `party_slot`, `hp`, `mp`, `tp`, `mpp` | **Only for a member of your party or alliance** (a trust too): their numbers as the game has them. `hpp` is every entity's |\n| `hp_max`, `hp_max_low`, `hp_max_high`, `hp_max_source`, `mp_max`, ... | The maximums: [below](#maximum-hp-and-mp). `hp_max_source` is `'none'` and there are no numbers for an entity outside the party and alliance, until the server is [asked](#asking-the-server-monsters-too) (`'server'`) |\n\n`vana.game.entity_by_id(id)` is the same table for the entity with that server id (nil when there is none). It looks at every\nslot, so ask when you need it and keep the index.\n\n### Maximum HP and MP\n\nThe game has a maximum HP and MP for **you** only. For a party or alliance member the server sends the current value and its\npercent, and for any other entity (a monster you have targeted) only the percent: the game has no number for it to read, so\nthere is none to give. VanaCore does for the members what an addon would otherwise do for itself: it samples the party every\nframe and works the maximum out, once, for every addon and plugin.\n\n| Field | What |\n|-------|------|\n| `hp_max` | The maximum. Left out (nil) when `hp_max_source` is `'none'` |\n| `hp_max_low`, `hp_max_high` | It is not below the first, nor above the second (`4294967295`: no upper limit yet) |\n| `hp_max_source` | `'self'`: the game's own number (you), exact. `'full'`: the value seen while the percent read 100, kept until a later sample disagrees: within a percent of the maximum, usually exact. `'estimate'`: worked out from a value and its percent, narrowed by each sample as the value moves; trust `hp_max_low` and `hp_max_high` over `hp_max`. `'server'`: CatsEyeXI's server said it when [asked](#asking-the-server-monsters-too), exact, kept for a minute. `'none'`: not in your party or alliance, and the server not asked |\n| `mp_max`, `mp_max_low`, `mp_max_high`, `mp_max_source` | The same for MP |\n\nA member who has been seen at full HP has `'full'`; one who has not (you joined them already hurt) has an `'estimate'` that\ntightens as their HP changes, and becomes `'full'` the first time they read 100%. A maximum that changes (a curse, a\nweakness ending, a food or a buff) shows as a percent the last samples don't allow, and the maximum starts again from that\nsample: it follows the change when the percent moves, and until then (a change too small to move it) stays as it was.\nSomeone who leaves the party starts again when they come back.\n\n#### Asking the server (monsters too)\n\nA monster's maximum HP is nowhere in the game, so VanaCore can only get it from the server. CatsEyeXI's server answers a\nrequest for it (its \"VanaCore modules\": `entity max HP`, packet `0x1A7`), by server id:\n\n`vana.game.request_max_hp(ids, callback)` — `ids` is a server id or a list of up to 8. Returns `true` when the request is\nsent, or `false` and why (not in the game yet, more than 8 ids, too many requests waiting). `callback(answers)` is called\nonce, in a following frame, with a list in the order asked of `{ id, hp, hp_max, status }`:\n\n| `status` | |\n|----------|---|\n| `'ok'` | `hp` is the entity's HP and `hp_max` its maximum, as the server has them right now (curses, Max HP boosts and Max HP down are in the maximum). `hp` is a snapshot of that moment: ask again for a newer one |\n| `'not_found'` | the server has nothing to say for that id: it is not you, your party or alliance, nor a monster, pet or trust your client has been told about (so an entity out of range is not answered) |\n| `'disabled'` | the server has the feature switched off |\n| `'too_fast'` | you asked again within 100 ms; the server keeps that gap per character |\n| `'hidden'` | the server keeps this monster's maximum secret (a boss it has marked); `hp` and `hp_max` are 0, and asking again won't change it |\n| `'no_answer'` | nothing came in 3 seconds: a server without the module, or a lost reply |\n\nEvery id gets an answer, so the callback always runs. Only HP is available: monsters have no MP the player is meant to know.\nAn `'ok'` answer's `hp_max` is also kept for a minute as that entity's `hp_max` (`hp_max_source = 'server'`) in `vana.game.entity`\n(the `hp` is not kept: it is out of date within a frame), until you zone; ask again to refresh it (a monster that despawns and spawns again may have rolled another level).\n\n```lua\n-- size a burn by the target's maximum HP\nlocal function on_target()\n    local t = vana.game.target()\n    local e = t.active and vana.game.entity(t.index)\n    if not e then return end\n    if e.hp_max then return use(e.hp_max, e.hpp) end\n    vana.game.request_max_hp(e.id, function (answers)\n        local a = answers[1]\n        if a.status == 'ok' then use(a.hp_max, e.hpp) end\n    end)\nend\n```\n\nPrint the current target's HP and maximum HP (the API Explorer addon has this as \"The target's HP and max HP (asks the\nserver)\", under Party and targets):\n\n```lua\nlocal t = vana.game.target()\nlocal e = t and t.active and vana.game.entity(t.index)\nif e then\n    vana.game.request_max_hp(t.id, function (answers)\n        local a = answers[1]\n        if a.status == 'ok' then\n            print(('%s: %d / %d HP (%d%%)'):format(e.name, a.hp, a.hp_max, e.hpp))\n        elseif a.status == 'hidden' then\n            print(('%s: the server keeps its HP secret (%d%%)'):format(e.name, e.hpp))   -- a boss marked to hide it\n        else\n            print(('%s: no number (%s), HP %d%%'):format(e.name, a.status, e.hpp))\n        end\n    end)\nend\n```\n\nAn Ashita addon can use it the same way behind `if vana then`; it runs unchanged in real Ashita, where the call isn't there.\n\n```lua\nlocal party = vana.game.party()\nlocal me = party and party.members[1]\nif me and me.hp_max_source ~= 'none' then\n    print(('%d of %d HP, %d missing (%s)'):format(me.hp, me.hp_max, me.hp_max - me.hp, me.hp_max_source))\nend\n\n-- a heal sized by the target's missing HP\nlocal function missing(id)\n    local v = vana.game.vitals(id)    -- by server id, also for a member in another zone\n    if v and v.hp_max then return v.hp_max - v.hp, v.hp_max_source end\nend\n```\n\nWalking the whole table every frame is heavy (2304 reads). Walk it when something changes, or a slice a frame\n([Tasks and timing](03-tasks-and-timing.md)), and keep the indexes you care about.\n\n```lua\n-- the nearest monster within 20 yalms\nlocal function nearest_monster()\n    local best, best_d\n    for index = 0, vana.game.entity_count() - 1 do\n        local e = vana.game.entity(index)\n        if e and bit.band(e.spawn_flags, 0x10) ~= 0 and e.hpp > 0 and e.valid_target and e.distance < 400 then\n            if best_d == nil or e.distance < best_d then\n                best, best_d = e, e.distance\n            end\n        end\n    end\n    return best\nend\n```\n\n## The target\n\n```lua\nlocal t = vana.game.target()\n```\n\n| Field | What |\n|-------|------|\n| `index`, `id`, `active` | The main target (`index` 0 and `active` false: none) |\n| `sub_index`, `sub_id`, `sub_active` | The sub target, while one is being chosen (`<st>`) |\n| `is_sub_target` | A sub target is being chosen |\n| `locked` | Locked on |\n| `menu_open` | A game menu is open |\n| `raw` | `[1..2]` `{ index, id, active }`: the game's two entries as they are |\n\n```lua\nvana.game.set_target(index)   -- targets that entity as the game's own code does; false if it has no actor (out of range)\n```\n\nThe `target_change` event fires when the main target changes, with the old and new indexes.\n\n## Zone, time and weather\n\n```lua\nlocal w = vana.game.world()\nw.server_time   -- Unix seconds, from the server's last packets (0 before any)\nw.weather       -- the zone's weather id\nw.chat_open     -- the chat line is open (the player is typing)\n\nvana.game.zoning()               -- true between zones: the zone-out came and the player isn't back yet\nvana.game.loading()              -- nil, or the load under way: phase ('server', 'zone', 'people'), login, zone,\n                                 -- previous, elapsed, ready, zone_files, zone_expected, people_files,\n                                 -- people_expected (0 not known yet), file ('ROM/1/41.DAT'), step (while the\n                                 -- server is waited for after a zone-out: 'leaving', 'connecting', 'waiting'),\n                                 -- wait (s the last waits took), answer (ms the server took to answer, once it\n                                 -- has: a round trip), out_type (the zone-out's type, 2 a zone change); the\n                                 -- loadscreen addon's\nvana.game.player_zone(listed)    -- the zone the server's zone-in named, until the party list (`listed`) has caught up\nvana.game.zone_weathers(zone)    -- the weathers (0x057's ids) the zone's files have a sky and light for, or nil\n```\n\n`zone_weathers` reads the zone's model DAT, the one the game loads (an overlay's when pivot has one): the weather folders\nof its environment tree (`weat\\fine`, `weat\\rain`...). A weather a zone has no folder for draws there with another's sky,\noften clear's: most cities have no rain. Read once a zone, its section headers only.\n\nThe party list's zone for you (`party.members[1].zone`) lags a zone-in by the seconds the new zone takes to load.\n`player_zone` gives the new one at once:\n\n```lua\nlocal zone = vana.game.player_zone(party.members[1].zone)\n```\n\nOr listen for `zone_change`, which carries it.\n\n## Abilities, spells and key items\n\n```lua\nlocal abilities = vana.game.abilities()   -- 224 bytes: the game's bits for weapon skills, job abilities, pet commands, traits\nlocal spells    = vana.game.spells()      -- 128 bytes: a bit per spell id\nlocal key_items = vana.game.key_items()   -- 512 bytes: a bit per key item id\n```\n\nEach is a string of the game's bits, `nil` until the server has sent them. Bit `n` is set when the player has `n`:\n\n```lua\nlocal function has_bit(bits, n)\n    local byte = bits:byte(math.floor(n / 8) + 1)\n    return byte ~= nil and bit.band(byte, bit.lshift(1, n % 8)) ~= 0\nend\n\nlocal knows_cure = has_bit(vana.game.spells() or '', 1) -- spell 1 is Cure\n```\n\nThe abilities string is the 0xAC packet's 224 bytes as the game keeps them. By kind: weapon skills from bit 0 (bit\n`n` is weapon skill `n`), job abilities from bit 0x200, pet commands from 0x400, traits from 0x600 to 0x6FF: the bits\nAshita's `HasWeaponSkill`, `HasPetCommand` and `HasTrait` test.\n\n## Recast timers\n\n```lua\nlocal r = vana.game.recasts()   -- nil before the game has them\nr.abilities[timer_id]   -- 1/60ths of a second left, for the ability recast timers counting down\nr.spells[spell_id]      -- 1/60ths of a second left, for the spells counting down\n```\n\nOnly timers that are counting appear. Divide by 60 for seconds. Ability keys are the game's recast timer ids (the\nability's `recast_id`, not its ability id).\n\n## Inventory\n\n```lua\nlocal bag = vana.game.container(0)   -- nil before the inventory is there\nbag.capacity                          -- the game's count, slot 0 included: 81 for an 80-slot inventory\nbag[index]                            -- index 0 to capacity - 1 (80 at most): nil past what's read\n```\n\nSlot 0 is reserved in every bag; in the inventory it holds the gil (`bag[0].count`, what `player().gil` reads). Items\nare in 1 to `capacity - 1`. Each slot: `{ id, index, count, flags, price, extra }`. `id` is the item id (0 for an empty slot), `count` how many,\n`flags` the game's (bazaar, equipped, ...), `price` the bazaar price, `extra` the 24 augment bytes as a string.\n\n| Container id | Bag |\n|--------------|-----|\n| 0 | Inventory |\n| 1 | Mog Safe |\n| 2 | Storage |\n| 3 | Temporary items |\n| 4 | Mog Locker |\n| 5 | Mog Satchel |\n| 6 | Mog Sack |\n| 7 | Mog Case |\n| 8 | Mog Wardrobe |\n| 9 | Mog Safe 2 |\n| 10 to 15 | Mog Wardrobe 2 to 7 |\n| 16 | Mog Wardrobe 8 |\n| 17 | Recycle Bin |\n\nA slot has only the item's id. Its name, level and the rest are in `vana.gamedata.items[id]`\n([Static game data](#static-game-data-vanagamedata)): `vana.gamedata.items[bag[i].id].name`.\n\n```lua\nlocal bag = vana.game.container(0)\nif bag then\n    local used = 0\n    for i = 1, bag.capacity - 1 do\n        if bag[i] and bag[i].id ~= 0 then used = used + 1 end\n    end\n    print(('Inventory: %d/%d'):format(used, bag.capacity - 1))\nend\n```\n\n## Equipment\n\n```lua\nlocal eq = vana.game.equipment()   -- nil before the inventory is there\neq[slot]                            -- { container, index }: where the item is; index 0 for nothing equipped\n```\n\n| Slot | | Slot | | Slot | | Slot | |\n|------|-|------|-|------|-|------|-|\n| 0 | Main | 4 | Head | 8 | Feet | 12 | Right ear |\n| 1 | Sub | 5 | Body | 9 | Neck | 13 | Left ring |\n| 2 | Range | 6 | Hands | 10 | Waist | 14 | Right ring |\n| 3 | Ammo | 7 | Legs | 11 | Left ear | 15 | Back |\n\n```lua\nlocal eq = vana.game.equipment()\nif eq and eq[0].index ~= 0 then\n    local item = vana.game.container(eq[0].container)[eq[0].index]\n    print('Main hand item id', item.id)\nend\n```\n\n## Packets as a source\n\nSome things aren't in memory in a handy form, or you want them the moment they arrive. The last packet of any id is\nkept: `vana.packets.last(true, 0x00A)` is the login or zone-in packet, `vana.packets.last(true, 0x01B)` the job info.\n[Packets](10-packets.md) has the layout and the `packet_in` event.\n\n## Static game data: `vana.gamedata`\n\nEverything above is read from the running game and is only ids: a buff is `33`, a spell `4`, an item `26963`. The\nnames, descriptions, costs and the rest live in the game's DAT files and in the server, so VanaCore ships them as Lua\ntables, generated from both (`tools/gen_gamedata.py` in CatsEyeXI's [CatsAndBoats/dats](https://github.com/CatsAndBoats/dats) repository, from the DATs through\nxi-tools and CatsEyeXI's server SQL), under `addons\\vanacore\\libs\\gamedata\\`. Nothing is read from the game for these.\n\n```lua\nlocal id = vana.gamedata.find('spells', 'Cure IV')    -- 4 (case-insensitive; items by their log name too)\nlocal spell = vana.gamedata.spells[id]\nprint(spell.name, spell.mp, spell.cast_time, spell.recast, spell.jobs[3])   -- Cure IV  88  2.5  8  41 (WHM)\nlocal item = vana.gamedata.items[26963]\nprint(item.name, item.level, item.item_level, table.concat(item.slot_names, ','), (item.mods or {}).STR)\nlocal buff = vana.gamedata.status_effects[33]      -- { name = 'Haste', adjective = 'hastened', ... }\nlocal zone = vana.gamedata.zones[245]              -- { name = 'Lower Jeuno', ... }\n```\n\n| Table | Keyed by | Each row |\n|-------|----------|----------|\n| `spells` | spell id | `name`, `description`, `type` (white, black, song, ninjutsu, summoning, blue, geomancy, trust), `skill`, `skill_name`, `element`, `mp`, `cast_time` and `recast` (seconds), `range`, `radius`, `aoe`, `targets` (bits) and `target_names`, `jobs` (`{ [job id] = level }`), `requirements`, `family`, `message`, `animation`, `icon`, `content_tag`; also `id`, `magic_burst_message`, `animation_time` (ms), `base`, `multiplier`, `ce` and `ve` (the server's enmity), `menu_index` |\n| `abilities` | ability id (the server's and Windower's; the game's command record is `id + 0x200`) | `name`, `description`, `job`, `job_name`, `level`, `recast` (seconds), `recast_id` (the timer `vana.game.recasts()` keys), `targets`, `target_names`, `range`, `aoe`, `radius`, `action_type`, `add_type`, `add_type_names`, `merit_mod`, `charges`, `tp`, `icon` |\n| `weapon_skills` | weapon skill id | `name`, `description`, `skill`, `skill_name`, `skill_level`, `element`, `range`, `aoe`, `skillchains` (`{ 'impaction', ... }`), `main_only`, `jobs` |\n| `status_effects` | status id (`vana.game.player().buffs` values) | `name`, `adjective`, `server_name`, `flags` and `flag_names`, `type`, `negative_id`, `overwrite`, `block_id`, `remove_id`, `element`, `min_duration` |\n| `zones` | zone id | `name`, `server_name`, `type` and `type_names` (city, outdoors, dungeon, ...), `music` (`day`, `night`, `battle_solo`, `battle_party`), `restriction`, `tax`, `id`, `misc` (the server's zone flags) |\n| `items` | item id | `id`, `name`, `log_name`, `log_plural`, `article`, `description`, `resource_id`, `category` (general, usable, armor, weapon, puppet, maze, instinct, roe, currency), `type`, `flags` and `flag_names`, `stack`, `targets`; equipment: `level`, `item_level`, `superior_level`, `slots` and `slot_names`, `races` and `race_names`, `jobs` (bits, bit n = job n) and `job_ids`, `shield_size`, `max_charges`, `cast_time`, `use_delay`, `reuse_delay`; weapons: `damage`, `delay`, `dps`, `skill`, `skill_name`, `damage_type`, `hits`, `jug_size`, `base_item_id`, `subskill`, `ilvl_skill`, `ilvl_parry`, `ilvl_macc`, `unlock_points`; puppet parts: `puppet_slot`, `element_charge`; instincts: `instinct_cost`; from the server: `mods` (`{ STR = 5, ... }`, the server's modifier names; only on an item that has any), `server_name`, `sort_name`, `server_type`, `ah` and `ah_name` (the auction house category), `base_sell`, `model_id`, `script_type`, `rslot`, `rslot_look`; usable items: `use_targets`, `activation`, `animation`, `animation_time`, `use_max_charges`, `use_delay_server`, `reuse_delay_server`, `use_aoe` |\n| `key_items` | key item id | `name`, `plural`, `description`, `category` |\n| `titles` | title id | `name` |\n| `jobs` | job id | `name`, `short` |\n| `skills` | skill id | `name`, `display`, `kind` (combat, magic, craft) |\n| `elements` | the server's element number | `name` (none, fire, ice, wind, earth, lightning, water, light, dark) |\n| `merits`, `job_points`, `traits` | their server ids | `name`, `display`, `upgrades`, `jobs` / `job`; traits: `levels` (`{ job, level, rank, mod, value }` each) |\n| `mounts`, `monster_families`, `augments`, `slots` | their ids | names and texts; families with their stats |\n| `skill_caps`, `skill_ranks` | level / skill id | a level's cap per rank (A+ first); each job's rank in a skill |\n\n`vana.gamedata.tables()` lists them with their row counts and the date they were generated. A table loads the first\ntime an addon touches it (`spells` in a few milliseconds; `items` is in parts of 4,096 ids, and the part an id is in\nloads when it's first asked for, so an addon reading armour doesn't parse the 25,000 items). `pairs()` on `items` only\nsees the parts loaded so far: `vana.gamedata.all('items')` loads every part first (about a second). Each addon's Lua\nstate has its own copy.\n\nText is UTF-8 as the client shows it, with `{Fire}` and the other element icons as those words; a description's line\nbreaks are `\\n`. To print one to the chat, `vana.encoding.to_shift_jis` first. Times are seconds where the server\nkeeps milliseconds (`cast_time`, `recast`) and the server's own units elsewhere (`recast` of an ability is seconds,\nan item's `cast_time` and delays are the client's numbers). Where the server's enums name a value the row carries both\nthe number and the names (`targets` / `target_names`, `flags` / `flag_names`); unlisted bits are just bits.\n\nTo regenerate after a DAT or server change, from the dats repository with xi-tools' Python (its `.env` naming the game\ninstall):\n\n```\n<xi-tools>\\.venv\\Scripts\\python.exe tools\\gen_gamedata.py --out <VanaCore>\\addons\\vanacore\\libs\\gamedata [--only spells,items]\n```\n\n## An item's stats: `vana.gamedata.item_stats`\n\nWhat an item gives, as VanaCore's Equipment window counts it (`[client] equip.stats`), from CatsEyeXI's own data:\n\n```lua\nlocal s, why = vana.gamedata.item_stats(27537)        -- by id; nil and why while the data isn't read\nlocal s = vana.gamedata.item_stats(bag[i])            -- a container's slot ({ id, extra }): its augments too\nlocal s = vana.gamedata.item_stats(id, extra)         -- an id and its 24 extdata bytes\n\nfor name, value in pairs(s.mods) do\n    local stat = s.stats[name]\n    print(('%s %+g%s'):format(stat.label, value / stat.unit, stat.percent and '%' or ''))\nend\n-- Double Attack +6%\n-- Store TP +2\n```\n\nWhere it comes from: `addons\\vanacore\\libs\\gamedata\\equip_mods.json`, made by `gen_gamedata.py` from CatsEyeXI's server\n(its SQL with its custom items' over it, its gear sets' Lua), and the item's description in the game's DATs as the game\nhas them now, CatsEyeXI's own included. An item CatsEyeXI changes after the data was made has a different description:\nfor that one the numbers its description gives are taken over the server's (a stat it gives no number for stays the\nserver's). `vana.gamedata.items[id].mods` is the server's as the items tables were made; `item_stats` follows the DATs.\n\n| Field | |\n|-------|-|\n| `id`, `name` | The item, its name as the DATs have it |\n| `description` | Its description as VanaCore reads its numbers: ASCII, element icons as their names |\n| `source` | Where `mods` came from: `'server'` (its description is the one the data was made with), `'description'` (changed since, or new: its numbers over the server's), `'unread'` (the DATs couldn't be read: the server's alone) |\n| `mods` | `{ NAME = value }`: what VanaCore counts, by the server's modifier names (`modifier.h`), in the server's units |\n| `server` | `{ NAME = value }`: the server's alone (`equip_mods.json`), to compare |\n| `latents` | `{ { mod, value, condition, param }, ... }`: `condition` is the server's `LATENT` (`latent_effect.h`), `param` its parameter. Left out when it has none |\n| `sets` | Each gear set it's in: `{ items, least, most, bonuses }`. `items` the set's item ids; `bonuses` `{ NAME = { for least pieces, least + 1, ... } }`, up to `most`. Left out when it's in none |\n| `augments` | Given its extdata: `{ NAME = value }`, its augments' modifiers as the server works them out (a charged item's extdata isn't augments: `{}`) |\n| `stats` | Each `NAME` above: `{ label, unit, percent, highest, shown }`. `value / unit` is the number shown (Haste: 100 = 1%); `percent` shown with %; `highest` only the highest worn counts, not the sum; `shown = false` for one the Equipment window doesn't show (DEF, HP, MP, STR to CHR, elemental magic evasion, added effects), labelled by its name |\n| `data` | `{ generated, source }`: when `equip_mods.json` was made, from which server and modules commits |\n\nThe first call of the game reads `equip_mods.json` (a moment, once for every addon); each item's description is read\nonce. Nil and why: `'not an item id'`, `'not ready yet: ask again'` (before the game's first frame),\n`'still being read: ask again'` (the Equipment window is reading it), or the file wasn't read. The server keeps its own\ntotals: `/checkparam` (and the Equipment window's top rows) are those.\n", "docs/05-chat-and-commands.md": "# 5. Chat and commands\n\n## Writing to the chat log\n\n```lua\nprint(...)                      -- the arguments joined with spaces, as a line in the chat log (and VanaCore's log)\nvana.chat.write(text[, mode])   -- a line (or lines: \"\\n\" splits) in the chat log, in chat mode `mode`'s colour\nvana.log(...)                   -- VanaCore's log only (logs\\vanacore.log), as \"<addon>: ...\"\n```\n\n`mode` is the game's chat mode number, which picks the line's colour. VanaCore uses these for its own lines:\n\n| mode | Colour | VanaCore uses it for |\n|------|--------|----------------------|\n| 1 | White | The default: what `print` uses |\n| 2 | Green | Success (\"Loaded: ...\") |\n| 68 | Red | Errors |\n| 104 | Yellow | Warnings |\n| 106 | Cream | Messages |\n\nOther numbers are the game's own chat modes (say, party, linkshell, ...), each in the colour the player set for it.\n\n```lua\nvana.chat.write('Something went wrong: ' .. why, 68)\n```\n\nLong lines are split as the game needs. Text is passed to the game as bytes: a string in your UTF-8 source with\ncharacters past ASCII should go through `vana.encoding.to_shift_jis` first (below).\n\n## Running a command or saying something\n\n```lua\nvana.chat.run(line[, mode])   -- runs `line` as if typed, on the next frame\n```\n\nAnything the player could type: a game command (`'/ma \"Cure IV\" <t>'`, `'/p Pulling'`, `'/equip main \"Excalibur\"'`), a\nVanaCore command (`'/addon reload tparty'`, `'/bind ^f1 /ja \"Provoke\" <t>'`), or a line of chat. It goes through every\naddon's `command` handlers like a typed line, with `e.injected` true.\n\nPlain chat (no leading `/`) goes to the current chat mode as the game would send it. Mind what you send: the server\nsees it as the player's.\n\n## Your own commands\n\nEvery line starting with `/` reaches your `command` handler before the game. Match yours, do it, return `true`:\n\n```lua\nvana.on('command', function (e)\n    local args = {}\n    for word in e.command:gmatch('%S+') do args[#args + 1] = word end\n    if args[1]:lower() ~= '/greeter' then\n        return\n    end\n    local what = (args[2] or ''):lower()\n    if what == 'on' then\n        enabled = true\n    elseif what == 'off' then\n        enabled = false\n    else\n        print('/greeter on|off')\n    end\n    return true\nend)\n```\n\nWhat `e` holds: `command` (the whole line), `mode` (1 for the chat box), `injected` (true for a line an addon or\nscript ran), `blocked` (an earlier addon took it). Returning `true`, or setting `e.blocked = true`, keeps the line from\nthe game. A line nothing takes goes to the game, which says it isn't a command (for `/x`) or sends it as chat.\n\nLines starting with `//` are addons' own by convention: the game never sees them. One that no addon claims raises the\n`unhandled` event (`e.command` without the slashes) in every addon, and if none returns `true`, the chat log says\n`Unknown command`.\n\nQuoted arguments (`/greeter say \"hello there\"`) are yours to parse: `e.command` is the raw line.\n\n## Reading chat lines\n\nEach line coming into the chat log raises `text_in`; each line the player sends raises `text_out`:\n\n```lua\nvana.on('text_in', function (e)\n    local mode = bit.band(e.mode, 0xFF)\n    if mode == 9 and e.message:find('Defeated', 1, true) then   -- 9 is a battle message mode\n        return true -- not shown\n    end\nend)\n```\n\n| `e` field | `text_in` | `text_out` |\n|-----------|-----------|------------|\n| `message` | The line as the game has it: Shift-JIS, with the game's control codes (colours, auto-translate) | The line typed |\n| `message_modified` | Assign to change what's shown | Assign to change what's sent |\n| `mode` | The three mode bytes: `bit.band(e.mode, 0xFF)` is the chat mode | The mode typed in |\n| `mode_modified` | Assign to change the colour | |\n| `indent`, `indent_modified` | Whether the line is indented (a continuation) | |\n| `injected` | VanaCore or an addon wrote it | |\n| `blocked` | An earlier addon blocked it | the same |\n\nReturning `true` or setting `e.blocked = true` drops the line. Changes to `*_modified` apply even when you don't block.\n\nA line your own addon prints doesn't come back into its own `text_in` (other addons' do), and lines bounce between\naddons at most four deep.\n\n```lua\n-- a timestamp on every line\nvana.on('text_in', function (e)\n    if not e.indent then\n        e.message_modified = os.date('[%H:%M] ') .. e.message_modified\n    end\nend)\n```\n\n### Auto-translate phrases and control codes\n\nChat text carries the game's codes: colours (`0x1E`, `0x1F` followed by a colour byte), auto-translate phrases\n(`0xFD` ... `0xFD`), and line layout bytes. To read a line as the player sees it:\n\n```lua\nlocal plain = vana.ashita.parse_auto_translate(e.message, true)   -- phrases spelled out; `true` puts them in brackets\n```\n\nColour codes are two bytes; strip them with `text:gsub('[\\30\\31].', '')` if you don't want them.\n\n## Text encoding\n\nYour Lua file is UTF-8 and the game is Shift-JIS. ASCII is the same in both, so most addons never notice. For anything\nelse (accented letters, Japanese, the game's special glyphs):\n\n```lua\nvana.encoding.to_shift_jis(utf8)      -- for text you hand the game: chat lines, vana.chat.run, packets\nvana.encoding.from_shift_jis(sjis)    -- for text from the game you show elsewhere: a file, a web request, an ImGui window\n```\n\n`vana.ui.text` and `vana.imgui` take UTF-8. Names from `vana.game` and lines from `text_in` are Shift-JIS.\n\n## Regular expressions\n\nLua patterns are usually enough. For a real regular expression (ECMAScript, as C++'s `std::regex` and Ashita's have\nit), compiled once and kept:\n\n```lua\nvana.ashita.regex.search(text, pattern)      -- every match: { { match, group1, ... }, ... }, or nil\nvana.ashita.regex.match(text, pattern)       -- the whole text matched: { match, group1, ... }, or nil\nvana.ashita.regex.replace(text, pattern, with)   -- $1 for a group\nvana.ashita.regex.split(text, pattern)       -- the pieces between matches\n```\n\nA bad pattern gives `nil` (`search`, `match`), the text as it was (`replace`), or the text alone (`split`).\n\n## The clipboard\n\n```lua\nlocal text = vana.system.clipboard()   -- the clipboard's text, Shift-JIS; '' when it has none\nvana.system.set_clipboard(text)        -- Shift-JIS text onto the clipboard; true if it did\n```\n\n## While the player is typing\n\n`vana.game.world().chat_open` is true while the chat line is open. Addons that act on keys should hold off then\n([Input](09-input.md)); the `chat_input_open` and `chat_input_close` events mark the moments.\n", "docs/06-drawing.md": "# 6. Drawing\n\nTwo ways to put something on the screen:\n\n- **`vana.ui`**: text boxes, filled rectangles and pictures that VanaCore draws for you every frame. You make one, set\n  its properties when they change, and it stays until you destroy it or the addon unloads. Cheap and simple: a HUD, a\n  label, a status line.\n- **`vana.imgui`**: Dear ImGui, drawn from your `present` handler each frame. Windows with buttons, sliders, tables,\n  text boxes: anything the player clicks on.\n\nBoth work in VanaCore's interface pixels: `vana.ui.screen()` gives the size. That's the frame's drawn size on\nVanaCore's own renderers, and the game's back buffer otherwise; it isn't squeezed with the game's interface under\n`[ui] aspect`, so what you draw is where the mouse finds it.\n\n## Text boxes, rectangles and pictures: `vana.ui`\n\n```lua\nlocal box = vana.ui.text({ text = 'Hello', x = 200, y = 200, size = 24, bold = true })\nlocal bar = vana.ui.rect({ x = 100, y = 100, width = 200, height = 12, color = '#30D030' })\nlocal pic = vana.ui.image({ file = 'logo.png', x = 20, y = 20, width = 64 })\n```\n\nEach returns a handle. Read and write properties on it, or call its methods:\n\n```lua\nbox.text = 'Hello again'      -- one property\nbox:set({ x = 10, y = 10 })   -- several at once\nbox:hide(); box:show()        -- the same as box.visible = false / true\nbox:destroy()                 -- gone; box.destroyed is then true, and any other access raises an error\nprint(box.width, box.height)  -- a text box's drawn size (read-only for text; set for rect and image)\n```\n\nVanaCore draws the boxes every frame in the order they were made (and by `layer`). You pay only when a property\nchanges: a text box is rendered again when its text or style changes, so set them only when they differ (compare\nfirst in a `present` handler).\n\n### Properties\n\n| Property | text | rect | image | What |\n|----------|:----:|:----:|:-----:|------|\n| `x`, `y` | yes | yes | yes | The top-left corner, in pixels (top-right when `right`) |\n| `right` | yes | | yes | `x` is the right edge, and lines line up on the right |\n| `visible` | yes | yes | yes | Drawn or not (default true) |\n| `opacity` | yes | yes | yes | 0 to 1, on top of the colours' own |\n| `layer` | yes | yes | yes | -100 to 100: higher is drawn over lower; creation order within a layer |\n| `block_mouse` | yes | yes | yes | While the cursor is over it, the game's mouse reads no buttons or wheel |\n| `text` | yes | | | The text, UTF-8; `\\n` for lines |\n| `font` | yes | | | Family name (default `Segoe UI`): any font Windows has, or one in `fonts\\` |\n| `size` | yes | | | Pixels, 6 to 128 (default 16) |\n| `bold`, `italic` | yes | | | |\n| `color` | yes | yes* | yes* | The text's colour; for a rect its fill, for an image a tint (*) |\n| `background` | yes | | | The box behind the text (default black at 55%) |\n| `padding` | yes | | | Pixels between the text and the box's edge (default grows with the font) |\n| `outline` | yes | | | An outline round the letters (1 pixel) |\n| `stroke`, `stroke_color` | yes | | | The outline's width (0 to 8) and colour |\n| `color_codes` | yes | | | `\\cs(r,g,b)` in the text colours what follows, `\\cr` goes back |\n| `gradient`, `gradient_from`, `gradient_to` | yes | | | The text shaded from one colour to another by the pixel: `gradient` is `\"down\"` (`gradient_from` at the top of the letters, `gradient_to` at their baseline), `\"across\"` (from the left of the text to its right) or `\"none\"` (or `false`, the default) |\n| `width`, `height` | read | yes | yes | A rect's size; an image's drawn size (0: its own; one of them: its shape kept) |\n| `radius` | | yes | | Rounded corners, pixels (half the height: a pill) |\n| `file` | | | yes | The picture: PNG, JPEG, BMP, GIF; relative to the addon's folder, or a full path |\n| `repeat_x`, `repeat_y` | | | yes | Tile the picture that many times across its size |\n\nColours are `'#RRGGBB'`, `'#RRGGBBAA'`, or a number `0xAARRGGBB`. Reading one back gives `'#RRGGBBAA'`. A property that\nisn't one of the box's raises an error naming the ones that are.\n\n### Icons\n\nVanaCore ships Google's Material Symbols Outlined, loaded into the game (nothing installed in Windows).\n\n```lua\nlocal glyph, font = vana.ui.icon('settings')   -- the character and the font to draw it with; nil if no such icon\nlocal icon = vana.ui.text({ text = glyph, font = font, size = 20 })\n```\n\nNames are the ones on fonts.google.com/icons (`undo`, `close`, `search`, `warning`, ...). Draw them unbolded.\n\n### Fonts\n\nAny `.ttf`, `.otf`, `.ttc`, `.woff` or `.woff2` in `fonts\\` next to `VanaCore.exe` is loaded at start and usable by\nfamily name in `font`. The log lists them. Fonts Windows has installed work too.\n\n### Example: a two-line HUD that follows the party\n\n```lua\nlocal box\nvana.on('load', function ()\n    box = vana.ui.text({ text = '', x = 0, y = 0, right = true, font = 'Consolas', size = 14,\n                         color = '#FFFFFF', background = '#1E1E2ECC', padding = 8 })\nend)\n\nlocal last = ''\nvana.on('present', function ()\n    local party = vana.game.party()\n    local me = party and party.members[1]\n    local text = me and me.active and ('HP %d/%d  TP %d'):format(me.hp, vana.game.player().hp_max, me.tp) or ''\n    if text ~= last then\n        last = text\n        box.text = text\n        local w, h = vana.ui.screen()\n        box.x, box.y = w - 16, h - 120\n    end\nend)\n```\n\n## ImGui windows: `vana.imgui`\n\nVanaCore has Dear ImGui 1.92 built in, bound for Lua the way Ashita binds it, so Ashita's addons and their `imgui`\nlibrary work unchanged and VanaCore addons use the same calls. Draw from `present`:\n\n```lua\nlocal imgui = vana.imgui\nlocal open = { true }               -- Begin's p_open is a one-item table\nlocal scale = { 1.0 }\n\nvana.on('present', function ()\n    if not open[1] then return end\n    imgui.SetNextWindowSize({ 300, 0 }, 4)                 -- 4: ImGuiCond_FirstUseEver\n    if imgui.Begin('My window', open) then\n        imgui.Text('Hello from ' .. addon.name)\n        if imgui.Button('Say hi') then\n            vana.chat.run('/p Hi!')\n        end\n        if imgui.SliderFloat('Scale', scale, 0.5, 2.0) then\n            -- scale[1] changed\n        end\n    end\n    imgui.End()                                            -- always, whether or not Begin returned true\nend)\n```\n\n### The conventions\n\n- **Dot calls.** `imgui.Begin(...)`, not `imgui:Begin`. A function ImGui hasn't got is `nil`.\n- **Pointers are tables.** Where C++ takes `bool*`, `int*`, `float*` or `char*`, pass a table: `[1]` is read and\n  written back (`[1]..[N]` for an array: `imgui.SliderFloat3('xyz', t, 0, 1)` uses `t[1]`, `t[2]`, `t[3]`). A\n  `p_open` that isn't a table is no pointer.\n- **Vectors.** `ImVec2` and `ImVec4` go in as tables (`{ x, y }`, a missing part 0) and come out as numbers:\n  `local x, y = imgui.GetWindowPos()`.\n- **Live objects.** `GetIO()`, `GetStyle()`, `GetFont()`, `GetWindowDrawList()` and the like return objects whose fields\n  read and write the structure (`io.DisplaySize.x`, `style.Colors[ImGuiCol_Text + 1]`, 1-based arrays); methods take\n  `:` (`draw_list:AddLine(...)`).\n- **Colours** are `ImU32` numbers (`0xFF0000FF`; negative ones as `bit.bor` makes them work too). Textures are their\n  pointer as a number.\n- **Text is literal.** `Text`, `TextColored`, `SetTooltip` and the other printf-style functions take the text alone, no\n  format arguments: use `string.format` first; `%%` shows `%`.\n- **Defaults.** A missing or `nil` argument takes ImGui's default; extra arguments are ignored.\n- **Numbers are ImGui 1.92's** (flags, `ImGuiCol_*`, `ImGuiCond_*`). The handful most used:\n\n| Constant | Value | | Constant | Value |\n|----------|-------|-|----------|-------|\n| `ImGuiCond_Always` | 1 | | `ImGuiWindowFlags_NoTitleBar` | 1 |\n| `ImGuiCond_Once` | 2 | | `ImGuiWindowFlags_NoResize` | 2 |\n| `ImGuiCond_FirstUseEver` | 4 | | `ImGuiWindowFlags_NoMove` | 4 |\n| `ImGuiCond_Appearing` | 8 | | `ImGuiWindowFlags_NoScrollbar` | 8 |\n| `ImGuiCol_Text` | 0 | | `ImGuiWindowFlags_NoScrollWithMouse` | 16 |\n| `ImGuiCol_WindowBg` | 2 | | `ImGuiWindowFlags_NoCollapse` | 32 |\n| `ImGuiCol_Border` | 5 | | `ImGuiWindowFlags_AlwaysAutoResize` | 64 |\n| `ImGuiCol_FrameBg` | 7 | | `ImGuiWindowFlags_NoBackground` | 128 |\n| `ImGuiCol_TitleBg` | 10 | | `ImGuiWindowFlags_NoSavedSettings` | 256 |\n| `ImGuiCol_Button` | 21 | | `ImGuiWindowFlags_NoMouseInputs` | 512 |\n| `ImGuiCol_ButtonHovered` | 22 | | `ImGuiWindowFlags_MenuBar` | 1024 |\n| `ImGuiCol_ButtonActive` | 23 | | `ImGuiStyleVar_WindowPadding` | 2 |\n| `ImGuiCol_Header` | 24 | | `ImGuiStyleVar_WindowRounding` | 3 |\n| `ImGuiCol_Separator` | 27 | | `ImGuiStyleVar_FramePadding` | 11 |\n| | | | `ImGuiStyleVar_FrameRounding` | 12 |\n| | | | `ImGuiStyleVar_ItemSpacing` | 14 |\n\n  Flags add: `8 + 16 + 32` is a window with no scroll bar, no scrolling and no collapse. The full set is `imgui.h` in\n  `third_party/imgui`; `addons\\vanacore\\libs\\ashita-4.30\\imgui.lua` defines every name for Ashita addons and is a handy\n  list.\n\n- **Draw only in a frame.** Functions that draw do nothing outside `present` (in a command handler, say). Set a flag\n  there and draw next frame.\n- **Mistakes don't end the game.** A `Begin` without its `End`, or a style pushed and never popped, is closed at the\n  frame's end and logged once (`ImGui: fixed at the frame's end ...`).\n\n### What's there\n\nNearly all of ImGui 1.92's public API, by its own names:\n\n| Group | Functions |\n|-------|-----------|\n| Windows | `Begin`, `End`, `BeginChild`, `EndChild`, `SetNextWindowPos/Size/Collapsed/Focus/BgAlpha/SizeConstraints/ContentSize/Scroll`, `SetWindowPos/Size/Collapsed/Focus/FontScale`, `GetWindowPos/Size/Width/Height`, `IsWindowAppearing/Collapsed/Focused/Hovered`, `GetWindowDpiScale`, `GetContentRegionAvail`, `GetWindowDrawList`, `GetBackgroundDrawList`, `GetForegroundDrawList`, `GetVisible`, `SetVisible` |\n| Layout | `Separator`, `SeparatorText`, `SameLine`, `NewLine`, `Spacing`, `Dummy`, `Indent`, `Unindent`, `BeginGroup`, `EndGroup`, `GetCursorPos*`, `SetCursorPos*`, `GetCursorStartPos`, `GetCursorScreenPos`, `SetCursorScreenPos`, `AlignTextToFramePadding`, `GetTextLineHeight*`, `GetFrameHeight*`, `PushItemWidth`, `PopItemWidth`, `SetNextItemWidth`, `CalcItemWidth`, `PushTextWrapPos`, `PopTextWrapPos`, `CalcTextSize` |\n| Text | `Text`, `TextColored`, `TextDisabled`, `TextWrapped`, `TextUnformatted`, `LabelText`, `BulletText`, `Bullet`, `TextLink`, `TextLinkOpenURL`, `Value` |\n| Widgets | `Button`, `SmallButton`, `InvisibleButton`, `ArrowButton`, `Checkbox`, `CheckboxFlags`, `RadioButton`, `ProgressBar`, `Image`, `ImageWithBg`, `ImageButton`, `Selectable`, `BeginDisabled`, `EndDisabled` |\n| Input | `InputText`, `InputTextWithHint`, `InputTextMultiline`, `InputInt/2/3/4`, `InputFloat/2/3/4`, `InputDouble`, `InputScalar/N`, `DragInt/2/3/4`, `DragFloat/2/3/4`, `DragIntRange2`, `DragFloatRange2`, `DragScalar/N`, `SliderInt/2/3/4`, `SliderFloat/2/3/4`, `SliderAngle`, `SliderScalar/N`, `VSliderInt`, `VSliderFloat`, `VSliderScalar` |\n| Colour | `ColorEdit3/4`, `ColorPicker3/4`, `ColorButton`, `SetColorEditOptions`, `ColorConvertU32ToFloat4`, `Colo
