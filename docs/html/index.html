aCore makes over the player to show how damage numbers are placed ('hit', 'round', 'barrage'); false for another kind\n```\n\n```lua\nlocal hw = vana.graphics.hardware()  -- what the graphics card and the CPU are doing now\n```\n\nThe call holds the readings for 5 s (polled once a second, through VanaCore's helper), so read it each half second while\na window shows them and they stop once it's closed. `gpu` is true when NVIDIA's NVML gave a reading (an NVIDIA card);\n`gpu_why` says why not.\n\n| Field | What |\n|-------|------|\n| `gpu`, `gpu_why` | A reading is there, or why not |\n| `gpu_busy`, `gpu_temp`, `gpu_mhz`, `gpu_max_mhz` | % of the time something ran on the card, its temperature (C) and clock |\n| `gpu_watts`, `gpu_limit_watts` | Its power and its limit |\n| `vram_used_mb`, `vram_total_mb` | Its memory in use (every program's) and in all |\n| `vram_game_mb`, `vram_budget_mb` | This game's own video memory and Windows' budget for it (DXGI: any card; 0 unknown) |\n| `throttled`, `throttle_text` | The clocks are held down by a limit (power, heat), and the reasons in words |\n| `cpu`, `cpu_mhz`, `cpu_max_mhz`, `cpu_limit_mhz` | The CPU's clock now while it runs, boost included (Windows 8 on; the busy cores count the most), its rated (base) clock, and what Windows lets it run at (below the rated clock: held back) |\n| `cpu_busy`, `cpu_game` | % of every core's time something ran, and this game ran, over the last second (Task Manager's: 100 is all the cores); nil for the first second |\n| `ram_used_mb`, `ram_total_mb`, `ram_game_mb` | The PC's memory in use (every program's) and in all, and this game's private memory (Task Manager's Commit size) |\n| `power`, `ac`, `battery`, `power_plan`, `power_mode` | Plugged in, % charged (-1 none), Windows' power plan and mode |\n\nThe rest of the table (`dlss_indicator`, `dlss_crash_test`, `grass_*`) serves the /vana window and isn't for addons.\n\nAn addon that draws its own effects or depends on the renderer checks `info().active` and `info().running`.\n\n## Plugins and addons\n\n```lua\nvana.plugins.loaded()          -- { { name, source = 'ashita' | 'windower', memory }, ... }\nvana.plugins.raise(name, data) -- a plugin event: plugins' HandleEvent, and every addon's 'plugin_event' at the next frame\n\nvana.addons.loaded()           -- { { name, source, version, author, desc, link, file, state, memory }, ... } in load order\n```\n\n`state` is Ashita's numbering: 0 error (it crashed), 1 running, 3 loading, 4 unloading, 5 reloading. `memory` is the\nbytes its Lua state holds. `source` is the folder it came from: `'vanacore'`, `'ashita'` or `'windower'`.\n\nA plugin's `memory` is the bytes it has allocated: its C runtime and Windows heap blocks and the address space it reserved\nwith VirtualAlloc, counted from as its DLL loads (not what other DLLs allocate for it, such as Direct3D's textures). It's\nnil when VanaCore isn't counting it. /vana stats shows it beside each plugin, and a click on one shows all its calls.\n\n```lua\nlocal function loaded(name)\n    for _, a in ipairs(vana.addons.loaded()) do\n        if a.name:lower() == name then return true end\n    end\n    return false\nend\n```\n\n`plugin_event` is how plugins and addons signal each other: `vana.plugins.raise('myaddon.refresh', payload)` reaches\nevery addon's `plugin_event` handler (`e.name`, `e.data`, `e.data_raw`, `e.size`) next frame, and every Ashita plugin's\n`HandleEvent`.\n\n## The Ashita layer's extras: `vana.ashita`\n\nBuilt for the Ashita compatibility layer, usable by any addon:\n\n```lua\nvana.ashita.string(table, index[, language])   -- the resource manager's GetString: the text at that index, or nil\nvana.ashita.string(table, text[, language])    -- the index of that text, or -1\nvana.ashita.parse_auto_translate(text, brackets)   -- auto-translate phrases spelled out\nvana.ashita.regex.search / match / replace / split  -- ECMAScript regular expressions ([Chat and commands](05-chat-and-commands.md))\nvana.ashita.execute(file[, parameters])        -- opens the file as Windows would (an editor for a text file); true if it did\nvana.ashita.console(show)                      -- the console window (with [client] attached=1) shown or hidden\nvana.ashita.gui_visible([visible])             -- whether ImGui's windows are drawn; the same as imgui.GetVisible/SetVisible\nvana.ashita.object(name[, interface])          -- an Ashita manager object for the FFI ('fonts', 'primitives', 'resources', 'inventory', 'device'); nil if none\nvana.ashita.win32(name, value)                 -- SetFocus(window), SetForegroundWindow(window), GetSystemMetrics(index)\nvana.ashita.interface, vana.ashita.libs        -- [addons] ashita.interface and ashita.libs, as numbers (4.16 or 4.30)\n```\n\n`language` for `string` is 0 the default, 1 Japanese, 2 English. The resource tables are the game's string DATs\n(`'spells.names'`, `'items.names'`, and so on, as Ashita's resource manager names them).\n\n## The rest\n\n```lua\nvana.version        -- VanaCore's version as text ('0.8.47')\nvana.log(...)       -- a line in VanaCore's log, as \"<addon>: ...\"\nvana.time.clock()   -- seconds, to the microsecond ([Tasks and timing](03-tasks-and-timing.md))\nvana.encoding.to_shift_jis(text), vana.encoding.from_shift_jis(text)   -- ([Chat and commands](05-chat-and-commands.md))\nvana.mcp.info()     -- the MCP server's state: { running, failed, port, client, idle, sessions }\n```\n\nA few functions exist for the /vana window and the HUD Manager rather than addons, and are listed in the\n[API reference](15-api-reference.md) for completeness: `vana.chat.preview`, `vana.camera.preview`, `vana.layout.outline`,\n`vana.layout.grid`, `vana.layout.up`, `vana.layout.clicked`, `vana.layout.select`, `vana.layout.selected`,\n`vana.layout.box`, `vana.layout.box_clicked`.\n\n## The free camera: `vana.camera`\n\n`/freecam` detaches the camera from the character and flies it about (W A S D, the mouse). An addon can turn it on and off,\nread where it is and put it somewhere, which is all a camera path needs:\n\n```lua\nvana.camera.free(true)                      -- on; true, or false and why (no character in the world)\nlocal cs = vana.camera.state()              -- { on, have, hold, float, lag, speed }\nif cs.have then                             -- the pose is taken from the game's view a frame after it comes on\n    local x, y, z, yaw, tilt = vana.camera.pose()\n    vana.camera.hold(true)                  -- the keys and mouse stop moving it\n    vana.camera.set_pose(x + 5, y, z, yaw, tilt)   -- each frame, from a present handler\nend\n```\n\nYaw and tilt are radians, yaw about the world's up from the world's x axis toward its z, tilt up from level (limited to 89\ndegrees). `hold` is dropped when the free camera goes off, by itself on a zone. The `freecam` addon (opened by `/freecam`) is a window and a\nkeyframe sequencer over these calls, and a worked example.\n\nIts **Weather** (`/freecam weather <name|0-19|off>`) shows any weather on this screen only, for photos, with `vana.packets`\nalone (`addons\\vanacore\\freecam\\weather.lua`). It hands the game the server's weather packet, incoming 0x057, as if received:\n\n```lua\n-- after the 4-byte header: when the weather started (Earth seconds since 1009810800), the weather, its fade (Vana'diel minutes)\nlocal start = vana.game.world().server_time - 1009810800\nvana.packets.inject(true, 0x057, '\\0\\0\\0\\0' .. u32(start) .. u16(6) .. u16(1))   -- 6: rain, 1: a 2.4 s fade\n```\n\nThe weathers are the server's order: 0 clear, 1 sunny, 2 cloudy, 3 fog, then two of each element, the light one first: 4\nand 5 fire (hot spell, heat wave), 6 and 7 water (rain, squall), 8 and 9 earth (dust storm, sand storm), 10 and 11 wind\n(wind, gales), 12 and 13 ice (snow, blizzards), 14 and 15 thunder (thunder, thunderstorms), 16 and 17 light (auroras, stellar\nglare), 18 and 19 dark (gloom, darkness). The game fades into it over the last field's Vana'diel minutes (2.4 real\nseconds each, 0 at once; the server sends 4 to 28), whatever the start time; the picker sends 1. While one is held, its\n`packet_in` blocks the server's own 0x057s (not `e.injected` ones), keeping the last, and the zone's weather is injected\nagain when it's turned off; a zone change (0x00B, 0x00A) just ends it. Nothing\ngoes to the server. `vana.game.world().weather` is the weather the game was given, an injected one too. A zone's files have the\nlook only of the weathers it really gets: the picker lists those (`vana.game.zone_weathers`, from the zone's model DAT), and the\ntyped command can still show any.\n\nIts **Time** (`/freecam time <hour|hh:mm|noon|dusk|...|off>`, `addons\\vanacore\\freecam\\daytime.lua`) holds the Vana'diel day at\nany hour on this screen only, by the game's own calls, as a cutscene does. While its game timer is on, the game works its\nVana'diel date and time out of the server's time every frame; a cutscene turns the timer off, sets the time, and turns it on\nagain at its end, and while it's off the time stands still. The calls are found by pattern:\n\n```lua\nlocal ffi = require('ffi')\nlocal timer = vana.memory.find('FFXiMain.dll', 0, 'C6 05 ?? ?? ?? ?? 01 E8 ?? ?? ?? ?? 8B 0D ?? ?? ?? ?? 85 C9 74 05 E9 ?? ?? ?? ?? C3 90 90 90 90 C6 05 ?? ?? ?? ?? 00 C3')\nlocal set = vana.memory.find('FFXiMain.dll', 0, '8B 44 24 04 B9 ?? ?? ?? ?? 50 E8 ?? ?? ?? ?? C3 8D 4C 24 04 E8')\nlocal enable = ffi.cast('void (__cdecl *)(void)', timer)       -- EnableGameTimer: the server's hour back, the weather refreshed\nlocal disable = ffi.cast('void (__cdecl *)(void)', timer + 32) -- DisableGameTimer\nlocal set_time = ffi.cast('void (__cdecl *)(int32_t)', set)    -- SetCurrentDateTime\nlocal clock = ffi.cast('volatile int32_t *', vana.memory.read_uint32(set + 5)) -- 60 to a Vana'diel second, 5,184,000 a day\n\ndisable()\nset_time(clock[0] - clock[0] % 5184000 + 18 * 216000) -- today at 18:00\n```\n\nNothing goes to the server. Never move the game's other clock instead (the server's time, which it keeps in step with each\npacket's): the game takes the jump for the server gone quiet and drops the connection.\n\nIts **Animation** (View & Effects; `addons\\vanacore\\freecam\\anim.lua`) plays any of the race's animations on your\ncharacter, on this screen only, and pauses and moves them by the frame, with the game's own calls and memory:\n\n- An entity's actor is `[entity + 0xA0]`; its first model part `[actor + 0x6B8]` has seven motion layers from `part + 0x24`\n  (0x14 each, the first track at `+4`). A character's clip is three parts on layers 0, 1 and 2 (lower body, upper body,\n  waist), named by three letters and the layer's digit (`idl0`, `idl1`, `idl2`).\n- A track: `+4` the next, `+0x24` its frame (a float), `+0x28` its speed, `+0x2C` loops left (0: for ever), `+0x30` the\n  clip's name, `+0x34` a handle to the clip (whose `+0x34` is its frame count, `+0x36` its rate). A pause is the speed set\n  to 0; a frame is written.\n- `XiSkeletonActor::SetSystemMotion` queues a clip by its three letters on every layer the actor's files have a part for.\n  A file is added to the actor's list (`actor + 0x7E4`) by its file id, as the game adds an emote's or a weapon skill's.\n  The calls are found by pattern (the signatures are in `anim.lua`).\n- The game queues its own motion again only when the one it wants changes or the queue ends, so a looping or paused clip\n  holds while the character stands; 0 written to `actor + 0x7D8` (the motion it last queued) brings its idle back.\n\nThe list of animations by race and category (`animdata.lua`) is generated by `tools\\gen_freecam_anims.py` from XI Model\nViewer's list and the game's file table.\n", "docs/13-ashita-and-windower.md": "# 13. Ashita and Windower addons\n\nVanaCore runs three kinds of Lua addon, all with the same commands: its own, Ashita v4's, and Windower 4's. An addon\nwritten for Ashita or Windower runs through a compatibility layer that puts that API's names over `vana.*`. This page\nsays how that works, what it means for an addon you write, and how to port one.\n\n## The three kinds\n\n| Folder | For | Libraries (`require`) |\n|--------|-----|-----------------------|\n| `addons\\vanacore\\` | VanaCore's own addons | `addons\\vanacore\\libs` |\n| `addons\\ashita\\` | Ashita addons | VanaCore's copies of Ashita's (`common`, `sugar`, `switch`, `chat`, `settings`, `imgui`, `d3d8`, ...): `addons\\vanacore\\libs\\ashita-4.30`, then `addons\\vanacore\\libs\\ashita`, shared by both versions; then `addons\\ashita\\` itself (Ashita's addons root) |\n| `addons\\windower\\` | Windower addons, laid out as Windower's own addons folder | `addons\\windower\\libs` (Windower's libraries), `addons\\windower\\res` (its resources) |\n\n`/addon load <name>` looks in the folders in that order, so when two have an addon of the same name, VanaCore's comes\nfirst, then Ashita's, then Windower's; `/addon load <name> windower` names the kind. The chat log says which loaded:\n`(Ashita Addon) Loaded: aspect 1.0 by atom0s`.\n\n### Which kind an addon is\n\nVanaCore reads the addon's main file:\n\n1. If it uses `vana.` anywhere, it's a VanaCore addon.\n2. Else it counts `windower.` and `_addon.` against `ashita.`, `AshitaCore` and `addon.`: whichever it uses more.\n3. If it uses none, it's its folder's kind.\n\nSo an Ashita addon that also calls `vana.gameui` once stays an Ashita addon only if it's in `addons\\ashita\\` and uses\n`ashita.` more than... no: rule 1 wins, so it becomes a VanaCore addon and loses Ashita's API. **An Ashita or Windower\naddon that wants `vana` must reach it without the word `vana.` in its main file**, or move the `vana` calls into a\nsecond file it requires:\n\n```lua\n-- in main.lua (Ashita addon): no 'vana.' here\nlocal extras = require('vanacore_extras')\n```\n\n```lua\n-- vanacore_extras.lua\nif vana ~= nil and vana.gameui ~= nil then\n    vana.gameui.hide('party_list')\nend\n```\n\n(The detection counts the word with a dot after it, so `vana ~= nil` alone in the main file doesn't tip it.)\n\n### What every kind has\n\nEach addon runs in its own LuaJIT state, with its kind's API, its libraries, and **`vana`**: the whole of VanaCore's\nAPI is a global in every addon, whatever it's written for. An Ashita addon can keep its settings with\n`vana.settings`, hide the party list with `vana.gameui`, or read `vana.game.party()`, and still run in real Ashita with\nan `if vana ~= nil` guard (mind the detection above).\n\n## Ashita addons\n\nThe layer is `src/core/lua/compat/ashita.lua` (built into `VanaCore.Core.dll`), run after `vana.lua` in every Ashita\naddon. It provides `AshitaCore` and its managers (chat, memory objects for the party, player, entities, target,\ninventory, the resource manager, fonts and primitives, the GUI manager, the plugin and addon managers, the pointer\nmanager), `ashita.events.register`, `ashita.memory`, `ashita.regex`, `ashita.fs`, `ashita.misc`, the `addon` and\n`addon.instance` tables, and Ashita's Lua 5.2 extras (`table.pack`, `table.unpack`, `package.searchers`).\n\n**Events**: `ashita.events.register(name, alias, fn)` for Ashita's names (`load`, `unload`, `command`, `d3d_present`,\n`d3d_beginscene`, `d3d_endscene`, `packet_in`, `packet_out`, `text_in`, `text_out`, `key`, `mouse`, `key_data`,\n`key_state`, `xinput_button`, `dinput_button`, `xinput_state`, `plugin_event`), each with the table Ashita's addons\nhave. `d3d_present` is VanaCore's `present`.\n\n**ImGui**: Ashita's `imgui` library (`require('imgui')`) finds ImGui as `AshitaCore:GetGuiManager()`, which is\n`vana.imgui`. ImGui itself is 1.92; an addon that loaded Ashita 4.16's `imgui.lua` passes 1.81's numbers and VanaCore\nconverts them.\n\n**Interface version**: Ashita addons see interface 4.16 (CatsEyeXI's Ashita) unless `[addons] ashita.interface=4.30`\nin `vanacore.ini`, which gives them what Ashita 4.30's Addons plugin does (`ashita.interface_version` 4.3, the 4.30 SDK\nmethods, `ashita.memory.assembler`, `AddonManager`). The libraries are 4.30's either way (they have everything 4.16's\nhad), unless `[addons] ashita.libs=4.16`.\n\n**Files**: `addon.path` ends in a backslash as Ashita's does. `GetInstallPath()` is VanaCore's folder, so an addon's\n`config\\addons\\<name>\\` and `resources\\` are where Ashita keeps them.\n\n**The login packet**: with `[addons] delay.login=1` an Ashita addon that `boot.txt` loads after the login gets the\nlogin's zone-in packet (`0x00A`) once as it loads, as it would have on Ashita.\n\nThe layer covers what the addons tried so far use; a call to a part that isn't there fails with a clear error naming\nit (`... is not supported by VanaCore yet`) rather than misbehaving. Report those: an Ashita addon that works in Ashita\nand not here is a VanaCore bug, fixed in VanaCore, never in the addon.\n\n## Windower addons\n\nThe layer is `src/core/lua/compat/windower.lua`. It provides `windower.*` (`add_to_chat`, `send_command`,\n`register_event`, `ffxi.get_player`, `get_party`, `get_mob_by_index`, `get_mob_by_target`, `get_info`, `get_items`,\n`packets.inject`, `send_ipc_message`, `prim.*` and `text.*` for primitives and text objects, and more), `_addon`,\n`coroutine.schedule`, `coroutine.sleep`, Windower's `string.pack` and `unpack`, and the paths (`windower.addon_path`,\n`windower.windower_path`, `windower.ffxi_path`, `windower.pol_path`).\n\n**Events** supported: `load`, `unload`, `prerender`, `postrender`, `addon command`, `unhandled command`, `login`,\n`logout`, `job change`, `zone change`, `target change`, `status change`, `hp change`, `mp change`, `tp change`,\n`hpp change`, `mpp change`, `mouse`, `keyboard`, `incoming chunk`, `outgoing chunk`, `incoming text`, `outgoing text`,\n`action`, `action message`, `gain buff`, `lose buff`, `time change`, `day change`, `moon change`, `weather change`,\n`ipc message`. The derived ones (`hp change`, `zone change`, ...) are worked out each frame from `vana.game.self()`.\n\n**Commands**: `//name args` (or `//lua command name args`) runs the addon's `addon command` event. Windower's\nlibraries and resources are the real ones, in `addons\\windower\\libs` and `res`, laid out as Windower's addons folder so\ntheir relative paths work.\n\n## Porting to a VanaCore addon\n\nMost addons needn't be ported: they run as they are. Porting is for an addon written for VanaCore from the start, or one\nthat wants `vana.settings`, `vana.gameui` and the rest without the layer. The names map one to one:\n\n### From Ashita\n\n| Ashita | VanaCore |\n|--------|----------|\n| `ashita.events.register('load', 'load_cb', fn)` | `vana.on('load', fn)` |\n| `ashita.events.register('d3d_present', ...)` | `vana.on('present', fn)` |\n| `ashita.events.register('command', ...)`, `e.command`, `e.blocked = true` | the same event and fields |\n| `ashita.events.register('packet_in', ...)` | `vana.on('packet_in', fn)`, the same `e` |\n| `ashita.events.register('text_in', ...)` | `vana.on('text_in', fn)`, the same `e` |\n| `ashita.events.register('key', 'mouse', 'key_data', 'key_state', 'xinput_button', ...)` | the same names |\n| `AshitaCore:GetChatManager():AddChatMessage(mode, indent, text)` | `vana.chat.write(text, mode)` |\n| `AshitaCore:GetChatManager():QueueCommand(mode, line)` | `vana.chat.run(line, mode)`; lines queued in mode 2 (the game's macro stack) in one frame run last first, as in Ashita |\n| `GetMemoryManager():GetParty():GetMemberName(i)` and friends | `vana.game.party().members[i + 1].name` |\n| a party member's or entity's **maximum** HP (Ashita has none: addons note the HP when the percent is full) | `vana.game.party().members[i + 1].hp_max`, `vana.game.entity(index).hp_max`, `vana.game.vitals(id).hp_max` ([Maximum HP and MP](04-game-data.md#maximum-hp-and-mp)); guard with `if vana then` to keep the addon running in real Ashita |\n| `GetMemoryManager():GetPlayer():GetMainJob()` | `vana.game.player().main_job` |\n| `GetMemoryManager():GetEntity():GetName(index)` | `vana.game.entity(index).name` |\n| `GetMemoryManager():GetTarget():GetTargetIndex(0)` | `vana.game.target().index` |\n| `GetMemoryManager():GetInventory():GetContainerItem(bag, i)` | `vana.game.container(bag)[i]` |\n| `GetMemoryManager():GetInventory():GetEquippedItem(slot)` | `vana.game.equipment()[slot]` |\n| `GetMemoryManager():GetRecast():GetSpellTimer(id)` | `vana.game.recasts().spells[id]` |\n| `GetPacketManager():AddIncomingPacket(id, data)` | `vana.packets.inject(true, id, data)` |\n| `GetResourceManager():GetString('spells.names', id)` | `vana.ashita.string('spells.names', id)` |\n| `ashita.memory.read_uint32(address)`, `find(...)` | `vana.memory.read_uint32`, `vana.memory.find` |\n| `ashita.memory.assembler` | `vana.memory.assembler` |\n| `ashita.regex.search(text, pattern)` | `vana.ashita.regex.search` |\n| `ashita.misc.open_url`, `play_sound` | `vana.system.open_url`, `vana.system.play_sound` |\n| `ashita.fs.exists`, `create_directory`, `get_directory` | `vana.fs.exists`, `vana.fs.create_dir`, `vana.fs.list` |\n| `require('settings')` | `vana.settings` ([Settings and files](08-settings-and-files.md)) |\n| `require('imgui')` | `vana.imgui` (the same calls) |\n| `ashita.tasks.once(delay, fn)` | `vana.tasks.once(delay, fn)` |\n| `addon.path` | `addon.path` (no trailing backslash here) |\n\n### From Windower\n\n| Windower | VanaCore |\n|----------|----------|\n| `windower.register_event('load', fn)` | `vana.on('load', fn)` |\n| `windower.register_event('prerender', fn)` | `vana.on('present', fn)` |\n| `windower.register_event('addon command', fn)` | `vana.on('command', ...)`, matching `//name` or `/name` yourself |\n| `windower.register_event('incoming chunk', fn)` | `vana.on('packet_in', fn)`: `e.id`, `e.data`, `e.data_modified`, return `true` to block |\n| `windower.register_event('incoming text', fn)` | `vana.on('text_in', fn)`: `e.message`, `e.message_modified` |\n| `windower.register_event('zone change' / 'job change' / 'login' / 'target change', fn)` | `vana.on('zone_change' / 'job_change' / 'login' / 'target_change', fn)` with a table `e` |\n| `windower.register_event('keyboard', fn)` | `vana.on('key_data', fn)` (DIK codes) or `vana.on('key', fn)` (virtual keys) |\n| `windower.add_to_chat(mode, text)` | `vana.chat.write(text, mode)` |\n| `windower.send_command(line)` | `vana.chat.run(line)` |\n| `windower.chat.input(text)` | `vana.chat.run(text)` |\n| `windower.ffxi.get_player()` | `vana.game.player()`, `vana.game.self()`, `vana.game.character()` |\n| `windower.ffxi.get_party()` | `vana.game.party()` |\n| `windower.ffxi.get_mob_by_index(i)` | `vana.game.entity(i)` |\n| `windower.ffxi.get_mob_by_target('t')` | `vana.game.entity(vana.game.target().index)` |\n| `windower.ffxi.get_info()` | `vana.game.world()`, `vana.game.player_zone(...)` |\n| `windower.ffxi.get_items(bag)` | `vana.game.container(bag)` |\n| `windower.ffxi.get_abilities()`, `get_spells()`, `get_key_items()` | `vana.game.abilities()`, `spells()`, `key_items()` (bit strings) |\n| `windower.packets.inject_incoming(id, data)` | `vana.packets.inject(true, id, data)` |\n| `windower.send_ipc_message(text)`, `'ipc message'` | `vana.ipc.send(text)`, `vana.on('ipc', ...)` |\n| `windower.text.create(...)`, `windower.prim.create(...)` | `vana.ui.text({...})`, `vana.ui.rect({...})`, `vana.ui.image({...})` |\n| `coroutine.schedule(fn, delay)` | `vana.tasks.once(delay, fn)` |\n| `coroutine.sleep(seconds)` | the same, inside a task |\n| `windower.addon_path`, `windower.windower_path` | `vana.paths.addon`, `vana.paths.addons` |\n| `windower.get_windower_settings()` | `vana.ui.screen()`, `vana.window.info()` |\n| `windower.open_url(url)`, `windower.play_sound(path)` | `vana.system.open_url`, `vana.system.play_sound` |\n| `config.load(defaults)` (the `config` library) | `vana.settings.register({ scope = 'character', defaults = defaults })` |\n\n### What changes in the move\n\n- **Events hand you a table** (`e`) for the game events, where Windower passed positional arguments. `key` and `mouse`\n  are positional in VanaCore too.\n- **Zero- and one-based.** `vana.game.party().members` is 1-based (slot 1 is you); container and equipment tables are\n  0-based, as the game's are.\n- **Names stay Shift-JIS** from `vana.game`; Windower's `res` tables gave UTF-8 for resources. `vana.encoding` converts.\n- **Settings are JSON**, not Lua, and can't hold functions.\n- **No `require` for the API.** `vana` is already there.\n\n## Where the layers are documented\n\n`docs/ashita-windower-compat.md` in the VanaCore repository describes both layers and the plugin hosts in depth:\nhow commands are routed, the packet pipeline, which Ashita manager is built on what, and what's not covered yet.\n", "docs/14-dev-workflow.md": "# 14. Developing and debugging\n\n## The loop\n\n1. Edit `addons\\vanacore\\<name>\\<name>.lua`.\n2. In the game: `/addon reload <name>`.\n3. Look at the chat log and `logs\\vanacore.log`.\n\nNo rebuild, no restart. `reload` runs your `unload` handlers, closes the Lua state, and loads the file again, so every\n`local` starts fresh. Settings stores are saved before and read after.\n\nBind the reload to a key while you work:\n\n```\n/bind ^f12 /addon reload myaddon\n```\n\n## Running Lua in a loaded addon\n\nTwo ways to poke at a running addon's state without editing the file:\n\n```\n/addon exec <name> <lua>       runs the Lua inside the addon; what it prints goes to the chat log\n/vana lua <name> <code>        the same, and says what the code returns (tried as an expression first)\n```\n\n```\n/vana lua myaddon #rows\n/vana lua myaddon config.data.scale\n/addon exec myaddon print(vana.game.self())\n```\n\n`/vana lua` without an addon name lists the loaded ones. Globals the code sets stay in the addon's state, so you can\nset a flag and watch what changes.\n\n## The MCP server\n\nWith `[mcp] enabled=1` in `vanacore.ini` (the /vana window's **Client > AI MCP**), VanaCore runs an MCP server inside\nthe game at `http://127.0.0.1:47800/mcp`, so an AI tool on this machine (Claude Code: `claude mcp add --transport http\nvanacore http://127.0.0.1:47800/mcp`) works in the live game: it reads the character, party and entities, dumps\npackets and the chat log, runs commands and Lua, reads and writes memory, disassembles, scans for patterns and values,\nsets hardware watchpoints, and takes screenshots.\n\nIts `lua` tool runs in a state of its own (the `mcp` addon), with the whole of `vana` and the FFI, so you can try an API\ncall or a memory read before writing it into your addon. To run code inside *your* addon from there, use its\n`run_command` tool with `/addon exec <name> <lua>`. The VanaCore README's MCP section lists every tool.\n\n## Logs\n\n`logs\\vanacore.log` next to `VanaCore.exe` has, for addons:\n\n- `Addons: loading ...`, `loaded ...`, `unloaded ...`, each with the kind.\n- Every error, with its traceback: `Addons: <name>: <event>: <message>` and the stack.\n- `Addons: <name> listens for the '<event>' event, which VanaCore doesn't raise yet`: a misspelled event name.\n- What you write with `vana.log(...)`, as `<name>: ...`.\n- `ImGui: check failed ...` and `ImGui: fixed at the frame's end ...`: ImGui misuse, logged once each.\n\nLogging is on by default (`[logging] enabled`). `print` goes to the chat log and the log both.\n\n## Errors\n\nAn error in a handler or task is reported once in the chat log (red) and in the log with its traceback, and the addon\nkeeps running. The same error again isn't repeated in the chat. The rest of the addon's handlers for that event still\nrun, and so do other addons'.\n\n**Five seconds of errors unload the addon.** An error that repeats on every frame (a `nil` in a `present` handler) for\n5 seconds in a row means the addon is broken, and VanaCore unloads it with the reason in the chat\n(`5 seconds of errors, the last: ...`). Bursts shorter than that are left alone: some addons fail for a moment as they\nstart.\n\n**A crash freezes the addon.** A hardware exception in your code (an access violation from a bad FFI pointer) is caught\nat the call's boundary and reported (`crashed: access violation reading 0x00000010 at FFXiMain.dll+0x1234 from\nVanaCore.Core.dll+0x5678 (myaddon.lua:42 in update)`: the faulting code, what called it, and your Lua line). The\naddon's Lua state is never entered again, its `unload` handlers don't run, and its memory stays allocated until the\ngame ends. What it made through `vana` is removed as usual. The game goes on; fix the code and load it again.\n\n## The addon window: `/vana stats`\n\n`/vana stats` opens VanaCore's statistics window. Its addons section lists each loaded addon with the time its events\ntake per frame, its Lua memory, how many errors it has reported, and which kinds of event it listens for (packets,\nchat text, mouse, keys). Pick one for its pane:\n\n- **Errors**: the distinct errors it has reported (the last 20 kinds), each with when, which event, the message and\n  traceback, and how often.\n- **Start profiling** / **Stop and show**: a sampling profile of the addon's Lua (LuaJIT's `jit.profile`, every\n  millisecond): the top lines and functions by sample, to find what's slow. One addon at a time.\n\n## Tracing an addon\n\n```\n/vana trace <addon>        logs what the addon does: the events it gets, the commands and packets it sees and blocks,\n                           the chat lines and commands it queues, and a line every 10 seconds summing up\n/vana trace <addon> 30     the same for 30 seconds (1 to 600), then a report of what it costs: see below\n/vana trace off            (ends a timed trace early, its report written with what it has)\n/vana trace list\n```\n\n`[logging] trace.addons=partyfinder,xiui` in `vanacore.ini` does the same from the start (the command writes it).\nNothing costs anything while no addon is traced. It's the tool for \"my handler never runs\": the trace shows whether the\nevent reached the addon, and whether another addon took it first.\n\n### Is it making the game lag? A timed trace\n\n`/vana trace <addon> <seconds>` traces one addon for that long (not written to `vanacore.ini`) and, at the end, writes\n`logs\\trace-<addon>-<date>-<time>.txt`, whether or not logging is on, and says the gist in the chat: its Lua's time a\nframe and share of the frame, the game's frame rate and hitches, how many of those it caused, and where the report is.\nThe report has:\n\n- **What it found**: how heavy it is (light, moderate, heavy: about how many fps it costs), whether it caused the\n  hitches, which event's handlers take most of its time, and the likely why from its profile and memory: Lua the JIT\n  couldn't compile, garbage made on every call, time in C (the API it calls), memory that keeps growing, ImGui windows\n  drawing tens of thousands of vertices.\n- **Its calls by event**: calls, calls a second, total, a frame, average and slowest, and how many took over 1 and 5 ms.\n- **Its slowest calls**: when, in which event, and its Lua memory over each (a drop: its garbage collector ran).\n- **The game's frames**: the frame rate, the average, median, 95% and 99% (the 1% low) frame times, the average frame's\n  parts (the game's Direct3D, its sleeps, VanaCore, the frame rate limit, Present, the rest), and the 15 slowest frames,\n  each with the addon's time in it and its slowest call.\n- **Every addon's Lua**, for comparison: calls, time a frame and share, slowest call, most in one frame.\n- **Its Lua profile** (LuaJIT's `jit.profile`, as /vana stats' Start profiling): the share compiled, interpreted, in C,\n  in garbage collection, and the top lines and functions. One addon is profiled at a time: if /vana stats is profiling\n  another, the report says so and has no profile.\n- **What it did** (packets given, blocked and added, chat lines, commands, its ImGui windows) and **the hardware** at the\n  end (CPU and GPU busy, clocks, memory, a GPU held down by power or heat).\n\nWhile it runs, every addon's calls and the frames' parts are timed, which costs a little.\n\n## Checking the game's state\n\n- `/vana debug` opens the Debug window (frame recording, debug views).\n- `/gamepad test` opens the Gamepad Test window (Client > Gamepads > Gamepad Test): the buttons pressed on each controller, its\n  sticks, triggers and stats, read from Windows, so it shows a controller the game isn't using as well. Its Record button\n  (`/gamepad record`) writes `logs\\gamepad-<time>.log`: each button, stick and key press with the time Windows had it, the time\n  the game read it, the first packet the game sent after it, slow frames, gaps in the game's input reads and in the server's\n  packets, and a summary that says which stage the lag is in. The keys the game gets are in it.\n- The MCP server's `game_state`, `entities`, `packets` and `chat_log` tools show what your addon reads.\n- `vana.log(vana.json.encode(t))` dumps a table to the log; `/vana lua <addon> <expression>` shows one in the chat.\n\n## Testing outside the game\n\n`tools\\luatest\\run.cmd` in the VanaCore repository runs Lua tests with the same LuaJIT VanaCore builds in, on the real\n`vana.lua` and `settings.lua` with stand-ins for the native functions. `settings_test.lua` is the model: pure Lua that\ndoesn't touch the game can be tested that way. Anything that reads the game runs in the game.\n\n## Writing for others\n\n- **`README.md` in the addon's folder.** What it does, its commands, and what it changes in the game's interface.\n  `/vana help <addon>` and the Addons page show it.\n- **`addon.desc`, `addon.version`, `addon.author`, `addon.link`.** Shown in `/addon info` and the Addons list; the\n  link opens with `/addon link <name>`.\n- **Check for what you need.** `vana.gameui ~= nil`, `vana.binds ~= nil`: an addon that says \"needs a newer VanaCore\"\n  beats one that errors. `vana.version` is text; compare parts, not strings.\n- **Don't leave things behind.** Binds you added, memory you patched, tasks that loop: undo them in `unload`. Boxes,\n  ImGui windows, game interface changes and settings are VanaCore's to clean up.\n- **Don't act on the player's behalf without being asked.** Sending commands or packets automatically is the server's\n  business to allow. A command that does one thing the player asked for is an addon; one that plays is a bot.\n- **Keep per-frame work small.** `present` runs 60 times a second. Read `vana.game.party()` when something changed,\n  not every frame, or every few frames; compare before setting a text box's text; don't walk 2,304 entities a frame.\n\n## For VanaCore developers\n\nThe native API is `src/core/lua_api.cpp` (every `vana.*` function the DLL provides), `src/core/lua/vana.lua` (events,\ntasks, `print`, the `vana.gameui` wrappers) and `src/core/lua/settings.lua` (`vana.settings`, `vana.json`), both Lua\nfiles built into `VanaCore.Core.dll` as resources and run in each addon before its file. `src/core/addons.cpp` hosts\nthe addons: loading, the events, errors and crashes, `boot.txt`. `src/core/gameevents.cpp` works out the game events;\n`src/core/lua_imgui.cpp` binds ImGui. The compatibility layers are `src/core/lua/compat/ashita.lua` and `windower.lua`.\n\nA new `vana.*` function goes in `lua_api.cpp` (or `vana.lua` when it's pure Lua), with a line in the\n[API reference](15-api-reference.md) and the page it belongs to. A new event goes in `addons.cpp`'s `kEvents` (so a\nlistener isn't logged as unraised) and in [Events](02-events.md). Lua in `src/core/lua` takes effect after a rebuild;\naddons under `addons/vanacore` are loose files.\n", "docs/15-api-reference.md": "# 15. API reference\n\nEvery function and field in `vana`, one line each, grouped by table. The page each belongs to has the details. A\n`→` gives what a function returns; `[x]` marks an optional argument.\n\n## `vana`\n\n| | |\n|---|---|\n| `vana.version` | VanaCore's version as text (`'0.8.47'`) |\n| `vana.log(...)` | A line in `logs\\vanacore.log` as `<addon>: ...` |\n| `print(...)` | A line in the chat log (and the log); global |\n\n## `vana.events` ([Events](02-events.md))\n\n| | |\n|---|---|\n| `vana.events.on(name, fn[, key]) → key` | Run `fn` each time `name` is raised; `key` names the handler (default `fn`) |\n| `vana.events.off(name, key) → bool` | Remove it |\n| `vana.on`, `vana.off` | The same |\n\nEvents: `load`, `unload`, `present`, `command`, `unhandled`, `text_in`, `text_out`, `packet_in`, `packet_out`, `key`,\n`mouse`, `key_state`, `key_data`, `xinput_button`, `dinput_button`, `xinput_state`, `beginscene`, `endscene`, `d3d_dp`,\n`d3d_dip`, `d3d_dpup`, `d3d_dipup`, `plugin_event`, `ipc`, `gameui_button`, `gameui_replaced`, `gameui_trigger`,\n`gameui_window`; game events `login`, `logout`, `zone_out`, `zone_change`, `job_change`, `subjob_change`,\n`level_change`, `target_change`, `menu_open`, `menu_close`, `main_menu_open`, `main_menu_close`, `action_menu_open`,\n`action_menu_close`, `chat_input_open`, `chat_input_close`.\n\n## `vana.tasks` and time ([Tasks and timing](03-tasks-and-timing.md))\n\n| | |\n|---|---|\n| `vana.tasks.once(delay, fn, ...) → task` | `fn(...)` once, `delay` seconds from now |\n| `vana.tasks.oncef(delay, fn, ...) → task` | `delay` frames from now |\n| `vana.tasks.repeating(delay, repeats, every, fn, ...) → task` | `repeats` times, `every` seconds apart |\n| `vana.tasks.repeatingf(delay, repeats, every, fn, ...) → task` | The same in frames |\n| `vana.tasks.spawn(fn, ...) → finished, ...` | Runs `fn` now as a task; its results if it didn't wait |\n| `vana.tasks.cancel(task)` | Stops it before its next run |\n| `vana.tasks.frame() → n` | Frames this addon has seen |\n| `coroutine.sleep(seconds)`, `coroutine.sleepf(frames)` | Inside a task: wait |\n| `vana.time.clock() → seconds` | High-resolution clock |\n\n## `vana.game` ([Game data](04-game-data.md))\n\n| | |\n|---|---|\n| `vana.game.character() → name, id` | The logged in character; `nil` before login |\n| `vana.game.self() → id, zone, job, level, subjob, sublevel, status, target_index, hp, mp, tp, hpp, mpp` | The player in numbers; `nil` before login and while the player isn't in the world |\n| `vana.game.player() → table` | `hp_max`, `mp_max`, `main_job`, `main_job_level`, `sub_job`, `sub_job_level`, `exp`, `exp_needed`, `stats`, `stat_modifiers`, `attack`, `defense`, `resists`, `title`, `nation`, `rank`, `rank_points`, `homepoint`, `residence`, `gil`, `limit_points`, `merit_points`, `merit_points_max`, `limit_breaker`, `exp_locked`, `limit_mode`, `assimilation_points`, `su_level`, `item_level`, `unity`, `mastery`, `mount_recast`, `buffs[32]`, `status_icons[32]`, `status_timers[32]`, `homepoints`, `data_loaded`, `sub_map` |\n| `vana.game.skills() → table` | `[skill id] = { name, skill, capped }` |\n| `vana.game.crafts() → table` | `[craft id] = { name, skill, rank, capped }` |\n| `vana.game.job_points() → table` | `[job id] = { capacity, points, spent }` |\n| `vana.game.jobs() → table` | `[job id] = { level, master_level }` |\n| `vana.game.pet() → table` | `index`, `id`, `name`, `hpp`, `mpp`, `tp`, `target_id`, `owner_index`, `owner_id`; `nil` without a pet |\n| `vana.game.missions() → table` | `nation`, `nation_mission`, `zilart`, `promathia`, `promathia_progress`, `crystalline_prophecy`, `moogle_kupo_detat`, `shantotto_ascension`, `adoulin`, `rhapsodies`, `voracious`, `declined` |\n| `vana.game.linkshell([slot]) → table` | Slot 1 (the default) or 2: `slot`, `name`, `message`, `poster`, `time`, `read_level`, `write_level`, `public_edit_level` (once its message has come), `rank`, `color`, `id`, `item`, `item_id` (while its pearl is equipped); `nil` for none |\n| `vana.game.merits() → table` | `[merit id] = { count, next }` |\n\n### `vana.gamedata` (static tables from the DATs and the server; [Game data](04-game-data.md#static-game-data-vanagamedata))\n\n| | |\n|---|---|\n| `vana.gamedata.<table>[id] → row` | `spells`, `abilities`, `weapon_skills`, `status_effects`, `zones`, `items`, `key_items`, `titles`, `jobs`, `skills`, `elements`, `merits`, `job_points`, `traits`, `mounts`, `monster_families`, `augments`, `slots`, `skill_caps`, `skill_ranks`; loaded on first use |\n| `vana.gamedata.find(table, name) → id \\| nil` | By name, case-insensitive (items by log name too) |\n| `vana.gamedata.all(table) → table` | Every part loaded, for `pairs()` (`items` is in parts) |\n| `vana.gamedata.tables() → { name = { rows, generated, part_size?, parts? } }` | What's shipped; a table kept in parts (`items`) has `part_size` and `parts` (`{ [part] = rows }`) |\n| `vana.gamedata.item_stats(id[, extra] \\| slot) → table \\| nil, why` | An item's stats as the Equipment window counts them: `id`, `name`, `description`, `source` (`'server'`, `'description'`, `'unread'`), `mods` and `server` (`{ NAME = value }`), `latents`, `sets`, `augments` (given its extdata, or a container's slot), `stats` (each name's `label`, `unit`, `percent`, `highest`, `shown`), `data` (`generated`, `source`) |\n| `vana.game.party() → table` | `members[18]`, `leader`, `party_leaders[3]`, `party_counts[3]`. A member has `hp`, `mp`, `tp`, `hpp`, `mpp` and the maximums the game never says: `hp_max`, `hp_max_low`, `hp_max_high`, `hp_max_source` (`'self'`, `'full'`, `'estimate'`, `'none'`), and the same for `mp` ([Maximum HP and MP](04-game-data.md#maximum-hp-and-mp)) |\n| `vana.game.vitals(id) → table \\| nil` | A party or alliance member's health by server id, also while they are in another zone: `id`, `party_slot`, `hp`, `hpp`, `mp`, `mpp`, `tp`, `hp_max`, `hp_max_low`, `hp_max_high`, `hp_max_source`, `mp_max`, `mp_max_low`, `mp_max_high`, `mp_max_source`. nil for anyone not in the party or alliance |\n| `vana.game.request_max_hp(ids, callback) → true \\| false, why` | Asks CatsEyeXI's server for the maximum HP of up to 8 entities by server id (a monster's too: the game has none). `callback(answers)` runs once, in a following frame, with `{ id, hp, hp_max, status }` for each id asked (`status`: `'ok'`, `'not_found'`, `'disabled'`, `'too_fast'`, `'hidden'`, `'no_answer'`). An answer's `hp_max` is also kept a minute as the entity's `hp_max` (`hp_max_source = 'server'`). Example, printing the current target's HP and maximum HP: [Asking the server](04-game-data.md#asking-the-server-monsters-too) |\n| `vana.game.entity_by_id(id) → table \\| nil` | The same table as `entity` for the entity with that server id (every slot is looked at: ask when it's needed, keep the index) |\n| `vana.game.entity(index) → table` | `index`, `id`, `name`, `x`, `y`, `z`, `heading`, `distance` (squared), `speed`, `hpp`, `type`, `race`, `status`, `spawn_flags`, `model_size`, `hitbox_size`, `claim`, `target_index`, `pet_index`, `render_flags`, `name_flags`, `valid_target`, `name_x`, `name_top`, `name_bottom` (its name on the screen, nil while it isn't drawn), `models[9]`; also `distance_yalms`, `is_pc`, `is_npc`, `is_monster`, `is_self`, `claim_id`, `claimed`, `anim_speed`, `door_id`, `render[9]`, `status_server`, `status_event`, `costume_id`, `zone_id`, `animations[10]`, `animation_time`, `animation_step`, `animation_play`, `emote_target_index`, `emote_id`, `linkshell_color`, `name_color`, `campaign_name_flag`, `mount_id`, `last_action_id`, `interaction_target_index`, `ballista_flags`, `fellow_index`, `trust_owner_index`, and for a party or alliance member `party_slot`, `hp`, `mp`, `tp`, `mpp`, `hp_max`, `hp_max_low`, `hp_max_high`, `hp_max_source`, `mp_max`, ... (`hp_max_source` is `'none'` for anyone else) |\n| `vana.game.entity_count() → n` | Entity slots (2304) |\n| `vana.game.target() → table` | `index`, `id`, `active`, `sub_index`, `sub_id`, `sub_active`, `is_sub_target`, `locked`, `menu_open`, `raw[2]` |\n| `vana.game.set_target(index) → bool` | Target that entity |\n| `vana.game.world() → table` | `server_time`, `weather`, `chat_open` |\n| `vana.game.zoning() → bool` | Between zones |\n| `vana.game.loading() → table?` | A zone (or the login's first zone) loading: `phase` (`server`, `zone`, `people`), `login`, `zone`, `previous`, `elapsed`, `ready`, `zone_files`, `zone_expected`, `people_files`, `people_expected`, `file`, `step` (`leaving`, `connecting`, `waiting`), `wait`, `answer`, `out_type`; nil when none is |\n| `vana.game.player_zone(listed) → zone` | The zone-in's zone until the party list has it |\n| `vana.game.zone_weathers(zone) → ids \\| nil` | The weathers (0x057's ids, lowest first) the zone's model DAT has a sky and light for, the DAT the game loads (pivot's overlays too); nil if it can't be read |\n| `vana.game.abilities() → bits` | 224 bytes: weapon skills from bit 0, job abilities from 0x200, pet commands from 0x400, traits from 0x600; `nil` until sent |\n| `vana.game.spells() → bits` | 128 bytes; `nil` until sent |\n| `vana.game.key_items() → bits` | 512 bytes; `nil` until sent |\n| `vana.game.recasts() → table` | `abilities[timer_id]`, `spells[spell_id]` in 1/60 s |\n| `vana.game.container(id) → table` | `capacity` (slot 0 included: 81 for an 80-slot bag), `[0..n] = { id, index, count, flags, price, extra }`; slot 0 is reserved (the gil, in the inventory) |\n| `vana.game.equipment() → table` | `[0..15] = { container, index }` |\n\n## `vana.chat` and text ([Chat and commands](05-chat-and-commands.md))\n\n| | |\n|---|---|\n| `vana.chat.write(text[, mode])` | A line in the chat log (mode 1 white, 2 green, 68 red, 104 yellow, 106 cream) |\n| `vana.chat.run(line[, mode])` | Run as typed, next frame |\n| `vana.chat.preview(key, value)` | VanaCore's own: a chat window's place previewed as /vana's slider drags |\n| `vana.encoding.to_shift_jis(utf8) → sjis` | |\n| `vana.encoding.from_shift_jis(sjis) → utf8` | |\n| `vana.ashita.parse_auto_translate(text, brackets) → text` | Phrases spelled out |\n| `vana.ashita.regex.search(text, pattern) → matches` | Every match, `{ { match, groups... }, ... }` or `nil` |\n| `vana.ashita.regex.match(text, pattern) → match` | The whole text, or `nil` |\n| `vana.ashita.regex.replace(text, pattern, with) → text` | `$1` for a group |\n| `vana.ashita.regex.split(text, pattern) → pieces` | |\n\n## `vana.ui` ([Drawing](06-drawing.md))\n\n| | |\n|---|---|\n| `vana.ui.text([props]) → box` | A text box |\n| `vana.ui.rect([props]) → box` | A filled rectangle |\n| `vana.ui.image(props) → box` | A picture (`file` required) |\n| `box.<property>`, `box:set(props)` | Read and write properties |\n| `box:show()`, `box:hide()`, `box:destroy()` | |\n| `box.destroyed` | True once destroyed |\n| `vana.ui.screen() → width, height` | VanaCore's interface size (0, 0 before the first frame) |\n| `vana.ui.icon(name) → glyph, font` | A Material Symbols icon by name; `nil` if none |\n| `vana.ui.add_image([path]) → path` | Copies a .png, .jpg, .bmp or .gif into VanaCore's images folder (over a file of that name) once it's known to decode; its path from VanaCore's folder (`images\\<name>`), as `[client] window.image` takes it. With no path, Windows' Open dialog asks for one. `nil, why` if it can't be used; `nil` if the dialog is cancelled |\n| `vana.ui.add_font([path]) → family` | Copies a .ttf, .otf, .ttc, .woff or .woff2 into VanaCore's fonts folder (it loads at every start) and loads it now; with no path, Windows' Open dialog asks for one. `nil, why` if it can't be used; `nil` if the dialog is cancelled |\n| `vana.ui.fonts() → { family, ... }` | The fonts in VanaCore's fonts folder (icon fonts left out) |\n| `vana.ui.remove_font(family) → true` | Takes a font added to VanaCore's fonts folder out: unloaded now, its file moved to the Recycle Bin. `nil, why` for an icon font or one not added |\n| `vana.ui.game_on_top([on])` | The game's windows are drawn over this addon's ImGui windows where they meet (on unless `false`; dropped on unload) |\n| `vana.ui.interface_hidden() → bool` | True while the game's interface is hidden (F11, `[ui] hide.key`) |\n| `vana.ui.set_interface_hidden(on) → bool` | Hides or shows the interface as F11 does (hiding works in the world only); true if it's hidden after |\n\nProperties: `x`, `y`, `right`, `visible`, `opacity`, `layer`, `block_mouse`; text: `text`, `font`, `size`, `bold`,\n`italic`, `color`, `background`, `padding`, `outline`, `stroke`, `stroke_color`, `color_codes`, `gradient`, `gradient_from`, `gradient_to`; rect: `width`, `height`,\n`color`, `radius`; image: `file`, `width`, `height`, `color`, `repeat_x`, `repeat_y`.\n\n## `vana.imgui` ([Drawing](06-drawing.md))\n\nDear ImGui 1.92 by its own names, with Ashita's Lua conventions (pointers as tables, vectors as `{x, y}` in and\nnumbers out). `vana.imgui.types.<Struct>.new()` makes ImGui structures.\n\n## `vana.layout` ([Drawing](06-drawing.md))\n\n| | |\n|---|---|\n| `vana.layout.windows() → list` | Addons' and plugins' ImGui windows: `{ name, owner, x, y, w, h, scale, shown, pinned, saved, locked, no_pointer }` |\n| `vana.layout.set(name, x, y, scale)` | Move or scale one (`nil` leaves a part) |\n| `vana.layout.flags(name, locked, no_pointer)` | Lock one (the mouse can't drag or resize it) and/or let the mouse through it (`nil` leaves a part) |\n| `vana.layout.reset(name)` | Forget what's set for it |\n| `vana.layout.highlight(name)` | Outline it this frame and the next |\n| `vana.layout.outline(what[, snap[, label[, anchor]]]) → drawn, x, y` | VanaCore's own (the HUD Manager): a game window's box |\n| `vana.layout.grid(pixels[, color, alpha, background, background_alpha, centre_alpha])` | VanaCore's own: a grid this frame |\n| `vana.layout.up(what) → up` | VanaCore's own (the HUD Manager's Open only): that box's window is open now; `nil` if it can't tell |\n| `vana.layout.clicked() → id` | VanaCore's own |\n| `vana.layout.box(name[, label[, snap[, picked]]]) → drawn, x, y, from_x, from_y` | VanaCore's own (the HUD Manager's Addon View): an addon window's yellow box, Shift + drag moving it |\n| `vana.layout.box_clicked() → name` | VanaCore's own |\n| `vana.layout.select(what)`, `vana.layout.selected() → ids` | VanaCore's own |\n\n## `vana.gameui` ([The game's interface](07-game-interface.md))\n\n| | |\n|---|---|\n| `vana.gameui.hide(element) → true` | Not drawn |\n| `vana.gameui.show(element) → true` | Drawn again |\n| `vana.gameui.move(element, x, y) → true \\| false, why` | Percents of the interface |\n| `vana.gameui.move(element) → true` | Back to the player's setting |\n| `vana.gameui.rect(element) → left, top, right, bottom \\| nil` | Where it is on the screen, in the interface's pixels; `'target_window'` for now, nil while nothing is targeted |\n| `vana.gameui.add(menu, label, fn[, colour]) → true` | Your button; `fn()` when chosen |\n| `vana.gameui.remove(menu) → true` | |\n| `vana.gameui.replace(item, fn) → true \\| false, why` | `fn()` instead of the game's action |\n| `vana.gameui.restore(item) → true` | |\n| `vana.gameui.image(element, file[, options]) → true \\| false, why` | Your picture (PNG, relative to your folder) in the game's place; options `width`, `height`, `x`, `y` (units), `color`, `opacity` |\n| `vana.gameui.image(element) → true` | The game's own picture again |\n| `vana.gameui.on(menu, event[, items], fn) → id` | `fn(e)` when the player does `event` in `menu` (`'select'`, `'cancel'`, `'up'`, `'down'`, `'left'`, `'right'`, `'menu'`, `'*'`); `e.menu`, `e.event`, `e.key`, `e.item`, `e.name`, `e.caught` |\n| `vana.gameui.catch(menu, event[, items], fn) → id` | The same, and the game's own action is left out |\n| `vana.gameui.off(id)` | The trigger taken out |\n| `vana.gameui.elements() → list` | `{ { id, name, actions }, ... }` |\n| `vana.gameui.hidden(element) → string \\| nil` | The addons and plugins that have it hidden, `'a, b'` (the player's own switch isn't in it); the HUD Manager shows it as the element's Hide, on and locked |\n| `vana.gameui.stats_dump() → n` | The Equipment window's stats worked out again into the log (`Stats dump:` lines): each equipped item's id, name and source, its modifiers, latent effects and augments, the sets, each stat's sum in the server's units and as shown. The items dumped; `-1` with `equip_mods.json` missing, `-2` while it's still being read (`/vana statsdump`) |\n| `vana.gameui.hide(window) → true` | Any of the game's windows by its name (`'configwi'`): drawn into nothing, still read by `window`, still worked by the keys, not by the mouse |\n| `vana.gameui.window(window) → table \\| nil` | `name`, `x`, `y`, `w`, `h`, `scale`, `cursor`, `count`, `focused`, `closing`, `hidden`, `drawn`; `rows` `{ id, text, x, y, w, h, cursor, disabled, drawn, state }`; `lines` `{ text, x, y, w, h, color }`; `pictures` `{ name, x, y, w, h, color }` |\n| `vana.gameui.windows() → list` | The names of the game's windows up |\n| `vana.gameui.press(window, row[, event]) → true \\| false, why` | Cursor on `row` (nil: where it is), then `event` (`'select'` left out) through the game's key input |\n| `vana.gameui.watch(window, fn) → id` | `fn(e)` in the frame the window is drawn: `e.what` `'open'`, `'change'` (anything it shows changed), `'close'`; `e.name`; `e.window` (`window()`'s table, whole; nil at close). `window` a name, `'main_menu'`, `'party_menu'`, `'config_menu'`, `'*'` or a list |\n| `vana.gameui.unwatch(id)` | The watch ended |\n\nElements: `chat_log`, `chat_input`, `party_list`, `alliance_lists`, `target_window`, `target_arrow` (hide, image),\n`status_icons`, `macro_bar`, `network_window`, `nameplates` (hide), `config_menu`, `party_menu.find_member`.\n\n## `vana.world` ([Widgets](18-widgets.md))\n\n| | |\n|---|---|\n| `vana.world.attach(box, index[, options])` | A `vana.ui` box at the name over target `index`: `side`, `x`, `y`, `scale`, `distance`, `walls` |\n| `vana.world.place(box, x, y, z[, options])` | A box at a point of the world: `up`, `pivot`, `x`, `y`, `scale`, `distance`, `range`, `over_ui`, `walls`; `facing` (`'camera'`, or laid in the world: `'upright'`, `'ground'`, `'wall'`) with `heading`, `width`, `height` (yalms); `toward` (yalms nearer the camera; an upright card stands out toward it) |\n| `vana.world.update(box, options)` | Changes some options of a placed box without placing it again (`index` for another name, `at` for another point too); cheap every frame |\n| `vana.world.placement(box) → table \\| nil` | How the box is placed now: `x`, `y`, `scale`, `walls`; at a name `side`, `distance`, `index`; at a point `up`, `distance`, `range`, `over_ui`, `facing`, `heading`, `width`, `height`, `toward`, `at`; `nil` if not placed |\n| `vana.world.detach(box)` | Back to being drawn at its `x` and `y` |\n| `vana.world.to_screen(x, y, z) → x, y, distance \\| nil` | A point of the world in the interface's pixels |\n| `vana.world.visible(x, y, z) → bool \\| nil` | Whether the zone's collision leaves the camera a clear line to the point |\n| `vana.world.pick(x, y) → x, y, z \\| nil` | The point of the zone under a pixel of the interface: where the camera's line through it first meets the zone's collision (the ground, a wall), as `vana.game.entity` has positions; nil when nothing is met within 150 yalms |\n| `vana.world.name_at(index) → x, top, bottom \\| nil` | Where the name over target `index` is, in the interface's pixels: the target's place across (its name is centred on it), the letters' top and bottom as drawn lately; nil when the name wasn't drawn in the last moments |\n| `vana.world.marks(list)` | Rings of light on the ground, this addon's whole set: each `{ x, y, z, radius, color, strength, shape, height, glyph, glyph_size, glyph_height }`; `shape` `'round'` or `'square'`, `height` a column of light rising from it, `glyph` A-D or 1-4 over its top, `glyph_height` how high it floats (a waymark); nil takes them off. Laid on the ground by the scene effects, hidden by what stands in front |\n\n## `vana.settings` and `vana.json` ([Settings and files](08-settings-and-files.md))\n\n| | |\n|---|---|\n| `vana.settings.register(options) → store` | `name`, `scope` (`'global'`, `'character'`), `defaults`, `changed` |\n| `store.data`, `store.ready`, `store.name`, `store.scope`, `store.defaults` | |\n| `store:save() → true \\| nil, why` | |\n| `store:reload() → data` | |\n| `store:reset() → true \\| nil, why` | |\n| `store:path() → path \\| nil` | |\n| `vana.settings.write(file, text[, scope]) → true \\| nil, why` | |\n| `vana.settings.read(file[, scope]) → text \\| nil, why` | |\n| `vana.settings.exists(file[, scope]) → bool` | |\n| `vana.settings.remove(file[, scope]) → true \\| nil, why` | |\n| `vana.settings.list([scope]) → names \\| nil, why` | |\n| `vana.settings.path(file[, scope]) → path \\| nil, why` | |\n| `vana.settings.folder([scope]) → path \\| nil, why` | |\n| `vana.settings.character() → name \\| nil` | |\n| `vana.json.encode(value[, compact]) → text \\| nil, why` | Indented for files; `compact` writes one line |\n| `vana.json.decode(text) → value \\| nil, why` | |\n\n## `vana.http`, `vana.ws`, `vana.promise`, `vana.async` ([HTTP, WebSockets and promises](17-http-and-websockets.md))\n\nNothing here blocks: a call returns a promise (or runs a callback `fn(res, err)` given last) and the answer comes in a later\nframe, on the game's thread.\n\n| | |\n|---|---|\n| `vana.http.get/head/delete(url[, options][, callback]) → promise` | `options`: `method`, `headers`, `query`, `body`, `json`, `form`, `auth`, `timeout`, `max_time`, `follow`, `max_redirects`, `max_size`, `save`, `insecure`, `strict` |\n| `vana.http.post/put/patch(url, body[, options][, callback]) → promise` | A table `body` is sent as JSON |\n| `vana.http.request(options_or_url[, options][, callback]) → promise` | Everything in one table |\n| `vana.http.json(url[, options][, callback]) → promise` | The decoded JSON; rejected unless 2xx |\n| `vana.http.download(url, path[, options][, callback]) → promise` | The body written to `path` whole or not at all; rejected unless 2xx |\n| `vana.http.pending() → n`, `vana.http.info() → table` | Requests going; `{ requests, sockets, waiting, workers }` |\n| `vana.http.encode(table) → text`, `.urlencode(text) → text`, `.basic_auth(user, password) → text` | Form and query text, `Basic ...` |\n| response | `ok`, `status`, `reason`, `url`, `headers` (lower case), `set_cookies`, `body`, `saved`, `res:json()`, `res:text()`, `res:header(name)` |\n| error | `code` (`timeout`, `dns`, `connect`, `tls`, `cancelled`, `too_large`, `redirect`, `file`, `http`, `json`, `invalid_request`, `invalid_url`, `busy`, `unavailable`, `failed`; a socket's also `handshake`, `closed`), `message`; `print(err)` shows the message |\n| `vana.ws.connect(url[, options]) → socket` | At once; `options`: `headers`, `protocols`, `timeout`, `keepalive`, `max_size`, `insecure`, `on_open`, `on_message`, `on_close`, `on_error` |\n| `socket:on(name, fn) → socket`, `socket:off(name, fn)` | `'open'(socket)`, `'message'(data, is_binary)`, `'close'(code, reason, clean)`, `'error'(err)` |\n| `socket:send(text \\| table) → bool, why`, `:send_binary(bytes)`, `:send_json(value)` | Sent before it opens, they wait |\n| `socket:close([code[, reason]])` | The closing handshake |\n| `socket:opened()`, `:closed()`, `:receive() → promise` | The socket; `{ code, reason, clean }`; the next message's data |\n| `socket.state`, `.protocol`, `.url`, `socket:is_open()`; `vana.ws.count() → n` | `'connecting'`, `'open'`, `'closing'`, `'closed'` |\n| `vana.promise.new(function (resolve, reject) end) → promise` | Also `vana.promise(fn)` |\n| `p:next(on_ok, on_err)`, `p:catch(fn)`, `p:finally(fn)` → promise | `p['then']` is `next` |\n| `p:await() → value` | In a task: waits, or raises the reason |\n| `p:cancel() → bool`, `p.state`, `p.value`, `p.reason` | Stops the request behind it |\n| `vana.promise.resolve(v)`, `.reject(r)`, `.all(list)`, `.allSettled(list)`, `.race(list)`, `.any(list)`, `.delay(seconds, v)`, `.is(x)` | |\n| `vana.async(fn, ...) → promise` | Runs `fn` now as a task |\n\n## `vana.fs`, `vana.paths`, `vana.config` ([Settings and files](08-settings-and-files.md))\n\n| | |\n|---|---|\n| `vana.fs.exists(path) → bool` | |\n| `vana.fs.is_dir(path) → bool` | |\n| `vana.fs.create_dir(path) → bool` | With parents |\n| `vana.fs.remove(path) → bool` | A file or an empty folder |\n| `vana.fs.write(path, data) → true \\| nil, why` | Whole or not at all |\n| `vana.fs.list(folder[, filter[, which]]) → names \\| nil, why` | `which`: `'files'`, `'folders'`, or `{ which, deep, case }` |\n| `vana.paths.install`, `.addons`, `.addon`, `.game` | Folders, no trailing backslash |\n| `vana.config.get(section, key[, default]) → text` | A `vanacore.ini` value |\n| `vana.config.set(section, key, value) → bool` | Writes it (`nil` removes) |\n| `vana.config.game(name) → text \\| nil` | A game setting as the ini hands it to the game |\n| `vana.config.reload() → bool` | Take the file up now |\n| `vana.config.info() → { upstream, changed, file }` | |\n\n## `vana.binds` and input ([Input](09-input.md))\n\n| | |\n|---|---|\n| `vana.binds.add(spec, command[, up]) → true \\| nil, why` | `/bind` |\n| `vana.binds.remove(spec[, up]) → bool`, `vana.binds.remove(bind) → bool` | `/unbind` |\n| `vana.binds.list() → list` | `{ key, vk, spec, command, up, when, ctrl, alt, shift, win, apps, fired_ago }` |\n| `vana.binds.base() → list \\| nil` | `list()`'s entries, for the binds there were when `scripts\\keybinds.txt` replayed; nil before |\n| `vana.binds.keys() → names` | |\n| `vana.binds.capture_begin()`, `vana.binds.capture_end()` | |\n| `vana.binds.capture() → { active, done, cancelled, key, vk, ctrl, alt, shift, win, apps }` | |\n| `vana.gamepad.list([refresh]) → controllers, xinput, xinput_reading` | DirectInput's controllers `{ guid, name, product, type, opened, reading, xinput }` each, which of XInput's four are connected, and which the game reads now |\n| `vana.gamepad.game() → { known, on, xinput }` | The game's own gamepad and XInput switches as they are now (`known` false on a client it wasn't written for) |\n| `vana.gamepad.select(guid) → true \\| false, why` | |\n| `vana.gamepad.apply({ mode, buttons, buttons_ex, guid }) → true \\| false, why` | |\n| `vana.gamepad.bindings() → { xinput, confirm, cancel, menu, options }` | |\n| `vana.gamepad.state() → { present, idle }` | |\n| `vana.gamepad.disable(off)`, `vana.gamepad.disabled() → bool` | |\n| `vana.gamepad.nav(on)` | Your window has the controller next frame |\n\n## `vana.packets` ([Packets](10-packets.md))\n\n| | |\n|---|---|\n| `vana.packets.inject(incoming, id, data)` | Into the next buffer |\n| `vana.packets.last(incoming, id) → data, at \\| nil` | The last of that id |\n| `vana.packets.queue(id, length, align, p1, p2, fill) → bool` | The game's own outgoing queue; `fill(pointer)` |\n\n## `vana.memory` ([Memory and FFI](11-memory-and-ffi.md))\n\n| | |\n|---|---|\n| `vana.memory.read_int8/uint8/int16/uint16/int32/uint32/int64/uint64/float/double(address) → value` | 0 if unreadable |\n| `vana.memory.read_string(address[, size]) → text` | |\n| `vana.memory.read_bytes(address, size) → text \\| nil` | |\n| `vana.memory.read_array(address, size) → bytes \\| nil` | |\n| `vana.memory.write_int8/uint8/int16/uint16/int32/uint32/int64/uint64/float/double(address, value) → bool` | `true` if written |\n| `vana.memory.write_string(address, text) → bool` | With a NUL |\n| `vana.memory.write_array(address, bytes) → bool` | |\n| `vana.memory.find(module \\| address, size, pattern[, offset[, count]]) → address \\| 0` | The `count`th match (0: the first) of a byte pattern (`'8B 0D ?? ??'`) plus `offset`; `size` 0 is the whole module |\n| `vana.memory.module([name]) → base, size \\| nil` | |\n| `vana.memory.alloc(size) → address \\| 0`, `vana.memory.free(address) → bool` | |\n| `vana.memory.protect(address, size, protection) → old \\| nil` | |\n| `vana.memory.unprotect(address, size) → bool` | |\n| `vana.memory.assembler.assemble(text[, base]) → bytes \\| nil, err` | |\n| `vana.memory.assembler.cave(text) → address \\| nil, err` | |\n| `vana.memory.assembler.release(address) → bool` | |\n| `vana.memory.assembler.call(address, target, nops)`, `.jmp(...)`, `.nop(address, count)` | |\n\n## System ([System](12 na.camera.free([on]) → on \\| false, why` | The `/freecam` camera on or off (the other way with nothing). `why`: the game's camera view wasn't found, or no character is in the world |\n| `vana.camera.float([on]) → on` | `/freecam float`: the floaty free camera, written to `[camera] freecam.float` |\n| `vana.camera.state() → table` | `on`, `have` (on and holding the pose taken from the game's view), `hold`, `float`, `lag`, `speed` |\n| `vana.camera.pose() → x, y, z, yaw, tilt \\| nil` | The free camera's pose: the eye, and the way it looks as radians (yaw about the world's up from the world's x toward z; tilt up from level). `nil` unless `have` |\n| `vana.camera.set_pose(x, y, z, yaw, tilt) → bool` | Puts it there; its speed and glide are dropped. `false` unless `have` |\n| `vana.camera.hold([on])` | While held, the keys, mouse and wheel move nothing, so a pose set every frame stays. Off with the free camera |\n| `vana.camera.speed([units]) → units` | The free camera's speed a second, set if given |\n| `vana.mcp.info() → { running, failed, port, client, idle, sessions }` | |\n| `vana.plugins.loaded() → list`, `vana.plugins.raise(name, data)` | `{ name, source, memory }` |\n| `vana.addons.loaded() → list` | `{ name, source, version, author, desc, link, file, state, memory }` |\n| `vana.ashita.object(name[, interface]) → userdata \\| nil` | |\n| `vana.ashita.item(id \\| name[, language]) → userdata \\| nil` | The resource manager's item (`GetItemById`, `GetItemByName`), for `compat\\ashita.lua`'s FFI; without its icon |\n| `vana.ashita.item_icon(id) → text` | The item's icon, read from its DAT; `''` for none |\n| `vana.ashita.string(table, index \\| text[, language]) → text \\| index` | |\n| `vana.ashita.win32(name, value) → number` | `SetFocus`, `SetForegroundWindow`, `GetSystemMetrics` |\n| `vana.ashita.execute(file[, parameters]) → bool` | |\n| `vana.ashita.console(show)` | |\n| `vana.ashita.gui_visible([visible]) → bool` | |\n| `vana.ashita.interface`, `vana.ashita.libs` | Numbers: 4.16 or 4.30 |\n\n## The `addon` table\n\n| | |\n|---|---|\n| `addon.name` | Lower case, set by VanaCore |\n| `addon.path` | The addon's folder, set by VanaCore |\n| `addon.author`, `addon.version`, `addon.desc`, `addon.link` | Yours to set |\n", "docs/16-character-menus-and-tables.md": "# 16. The character, the menus and the game's tables: how they work\n\nThree parts of the API that go together, each with its reference elsewhere in the series and its mechanics here:\n\n| Part | What an addon gets | Reference |\n|------|--------------------|-----------|\n| The character | Everything the game keeps about you: stats, skills, merits, missions, linkshells, the pet | [4. Game data](04-game-data.md) |\n| Menu triggers | A function run when the player does something in any of the game's menus, with the game's own action kept or dropped | [7. The game's interface](07-game-interface.md#triggers-on-catch-and-off) |\n| Game tables | The names, descriptions, costs and numbers behind every id, as Lua tables | [4. Game data](04-game-data.md#static-game-data-vanagamedata) |\n\nThe **API Explorer** addon describes every call on this page and runs them, showing what comes back:\n`/api` (it loads the addon when it isn't loaded). The last section says how to use it.\n\n## 1. The character\n\n```lua\nlocal p = vana.game.player()                     -- the game's status block: stats, exp, rank, gil, merits, item levels ...\nlocal skills, crafts = vana.game.skills(), vana.game.crafts()\nlocal jobs = vana.game.jobs()                    -- every job's level and master level\nlocal points = vana.game.job_points()\nlocal pet = vana.game.pet()                      -- nil without one\nlocal missions = vana.game.missions()\nlocal ls = vana.game.linkshell(1)                -- or 2\nlocal merits = vana.game.merits()                -- { [merit id] = { count, next } }\n```\n\nEvery call reads the game afresh and returns a new table, or `nil` when the data isn't there yet (before login, between\nzones). None of it is cached for you: a `present` handler that needs the player's stats every frame reads them once per\nframe and keeps the table.\n\n### Where it comes from\n\n**The status block.** The game keeps one 0x438-byte block for the player: the server's status packet (0x061: HP and MP\nmaximums, jobs, stats, resistances, title, rank, home point, nation) is copied in whole, and the other packets fill the\nrest as they come: experience points, skills (0x062), merit and limit points, job points, the status timers (0x063),\nthe home points known. `vana.game.player()` copies the block and hands you its fields by name; `skills()`, `crafts()` and\n`job_points()` are views of the same block (a skill is the level in its low 15 bits with a capped bit on top; a craft's\nrank sits in its low 5 bits and its level above). A read is one memory copy, cheap enough for every frame.\n\n**Job levels.** The game has a function that answers \"what level is job n\" (the one Ashita's `GetJobLevel` calls) and\nanother for the master level. `vana.game.jobs()` calls both for every job. A job not unlocked is 0.\n\n**The pet.** The game keeps its last pet status packet (0x068) as 24 bytes: the pet's index, HP%, MP%, TP and target.\n`vana.game.pet()` reads them, and adds the pet's entity name and id when the entity is in range. A released pet leaves an\nindex of 0 behind, which reads as no pet.\n\n**Missions.** The server's mission log (0x056, its \"current\" log) is copied by the game into one block: the nation and\nits current mission, Zilart, Promathia and its chapter progress, the three add-ons, Adoulin, Rhapsodies, and which\nexpansions the player declined. `vana.game.missions()` reads it; it's `nil` until the log has come (at login). Quests and\ncompleted missions are in other logs the game keeps as bitmaps and aren't exposed.\n\n**Linkshells and merits: VanaCore keeps the packets.** The game shows a linkshell's name in its windows and the merit\nlist in its menu, but keeps neither anywhere an addon can read. So VanaCore keeps them itself from the packets as they\narrive:\n\n- Each linkshell message packet (0x0CC) carries the slot it's for, the message, who set it and when, the permissions,\n  and the linkshell's name packed six bits a letter. VanaCore decodes the name and keeps one record per slot until\n  logout. The equipped pearl (a linkshell, pearlsack or linkpearl marked equipped in the inventory) carries the same\n  packed name in its extra data, plus the linkshell's id and colour, so `vana.game.linkshell(slot)` finds the pearl by\n  name and adds its `rank`, `color` and `id`. A slot with no message yet but a pearl still answers, from the pearl.\n- The merit list (0x08C) comes at login in several packets, each a run of `{ id, next cost, count }`, and again for\n  the merits that change. VanaCore keeps every entry by id; `vana.game.merits()` is that list. The points to spend and\n  the cap are in `player()` (`merit_points`, `merit_points_max`).\n\nBoth stores are cleared at logout, so they're right for the next character.\n\n### Ids\n\nEverything is numbers: a skill 9, a buff 33, a zone 245, a merit 128. The game tables (section 3) turn them into names\nand the rest: `vana.gamedata.skills[9].name`, `vana.gamedata.status_effects[33].name`, `vana.gamedata.zones[245].name`.\n\n## 2. Menu triggers\n\n```lua\nlocal id = vana.gameui.on(menu, event[, items], fn)     -- hear it; the game acts as well\nlocal id = vana.gameui.catch(menu, event[, items], fn)  -- hear it; the game's own action doesn't happen\nvana.gameui.off(id)\n```\n\n`menu` is a window's name as `menu_open` gives it (`'menuwind'`, `'prty1'`, `'inventor'`), an alias (`'main_menu'` for\nboth pages of the main menu, `menuwind` and `socialme`; `'party_menu'`, `prty1`; `'config_menu'`, `configwi`), `'*'` for\nevery menu, or a list of those. `event` is\n`'select'`, `'cancel'`, `'up'`, `'down'`, `'left'`, `'right'`, `'menu'` (the menu key pressed while a menu is up), or `'*'`.\n`items` narrows the trigger to item ids, or names VanaCore knows (the main menu's two pages and the Party list are named\nin [7. The game's interface](07-game-interface.md#triggers-on-catch-and-off)). The function is always last and gets\n`e`: `menu` (the window's own name, never the alias), `event` (the event's name, or the game's number for one without a\nname), `key` (the event's number), `item`, `name` (`''` when VanaCore has no name for it), `caught`.\n\n```lua\n-- the player picks Equipment in the main menu: our window, not the game's\nvana.gameui.catch('main_menu', 'select', 'equipment', function (e)\n    open_my_equipment()\nend)\n\n-- every choice in every menu, to find the ids of a menu nobody has named yet\nvana.gameui.on('*', 'select', function (e)\n    print(('%s: item %d%s'):format(e.menu, e.item, e.name ~= '' and ' (' .. e.name .. ')' or ''))\nend)\n```\n\n### How it works\n\nEvery one of the game's menus is a window made from a layout, with a handler object behind it that does what its items\ndo. When the player presses a key, clicks an item or moves the stick, the window acts first (moves its cursor, marks\nthe item, plays the sound, closes itself on cancel) and then hands the event and the cursor's item to its handler,\nthrough one function that every window shares. That hand-over is the whole of what a menu does when chosen, so it's\nwhere VanaCore sits:\n\n1. **The hook goes in at the first trigger.** VanaCore finds the hand-over in the game's code by its bytes and replaces\n   the call into the handler with a call to its own stub. Nothing is patched until an addon sets a trigger, and the\n   patch is five bytes.\n2. **Each hand-over asks the registry.** The stub gives VanaCore the window, the event and the item. VanaCore reads the\n   window's layout name (`menuwind`, `prty1`), then goes through every loaded addon's triggers: those whose menus, event\n   and items match are hit.\n3. **Observers are queued, catches decide now.** Each hit addon gets a `gameui_trigger` event at the next frame, which\n   `vana.gameui` turns into your function's call with `e` filled in. If any hit is a catch, the stub returns to the game\n   as the handler would have, without calling it; otherwise it jumps into the handler as the game would have.\n4. **The window has already done its part.** A caught select looks like the game's own: the cursor moved, the item\n   lit, the sound played. Only the action behind it (opening the Equipment window, say) is left out. A caught cancel\n   still closes the window, since the window closes itself before the hand-over.\n\nKeyboard, controller and mouse all come through the same hand-over (the manager's key dispatch and the mouse frame\nboth call it), so a trigger sees every way of choosing. Two addons can hear the same event, and one catch among them\nis enough for the game's action to be left out; every listener's `e.caught` says so.\n\nA trigger lasts until `off(id)` or the addon goes. `/addon reload` is a go, so an addon sets its triggers in its `load`\nhandler, not at the top of the file. Your function runs at the next frame, like every event, so it can't veto a choice\nafter the fact: a catch is declared, not decided in the handler.\n\n**Finding a menu's items.** `vana.gameui.on('*', 'select', ...)` with a `print` names the window and item id of\nwhatever you pick, and the `menu_open` event names each window as it opens. With the player's **Single main menu** on,\npage 2's items are `menuwind`'s 16 to 27 and keep page 2's names, so `'main_menu'` with an item name works either way.\n\n**Not covered.** The windows VanaCore draws itself (ImGui), the chat line, and anything the game does without a menu\n(a macro, a typed command). An addon that wants those listens for `command` or `key`.\n\n## 3. The game's tables\n\n```lua\nlocal id = vana.gamedata.find('spells', 'Cure IV')        -- 4\nlocal s = vana.gamedata.spells[id]                        -- name, mp, cast_time, recast, jobs = { [3] = 41, ... }, ...\nlocal item = vana.gamedata.items[26963]                   -- Onca Suit: level, item_level, slot_names, mods = { STR = 93 }\nvana.gamedata.status_effects[33].name                     -- Haste\nfor id, zone in pairs(vana.gamedata.zones) do ... end\nvana.gamedata.tables()                                    -- what's shipped, with row counts and dates\n```\n\nTwenty tables: `spells`, `abilities`, `weapon_skills`, `status_effects`, `zones`, `items`, `key_items`, `titles`, `jobs`,\n`skills`, `elements`, `merits`, `job_points`, `traits`, `mounts`, `monster_families`, `augments`, `slots`, `skill_caps`,\n`skill_ranks`. [4. Game data](04-game-data.md#static-game-data-vanagamedata) lists each one's fields.\n\n### Where they come from\n\nNothing in these is read from the running game. They're generated, by `tools/gen_gamedata.py` in CatsEyeXI's [CatsAndBoats/dats](https://github.com/CatsAndBoats/dats) repository, from the two\nplaces the facts live:\n\n- **The game's DATs**, for what the client shows: names, descriptions, help texts, the item records (level, slots,\n  races, jobs, damage, delay, flags, the description), the spell and command records (icons, menu order). The script\n  reads them through xi-tools' library, the same decoders its model viewer uses.\n- **CatsEyeXI's server**, for what the server decides: a spell's MP, cast time, recast and the level each job learns\n  it at; an ability's recast and its timer id; a weapon skill's skillchain properties; an item's mods, auction house\n  category and base price; a zone's type and music; a status effect's flags. The script parses the server's `.sql`\n  dumps directly (no database running) and takes the names for the numbers from the server's own headers (modifier\n  names, target and status flags, skillchains, zone types), so a renamed enum shows up on the next run.\n\nWhere the two name the same thing the client's name is used (it's what the player reads) and the server's kept beside\nit (`server_name`). Ids are the ones the game uses on the wire, which are also Windower's and Ashita's: spell 4 is\nCure IV everywhere, ability 16 Mighty Strikes, status 33 Haste. The game's own command records sit at `id + 0x200` for\njob abilities and pet commands; the script does that arithmetic so you don't.\n\n### How they load\n\nThe tables are Lua files under `addons\\vanacore\\libs\\gamedata\\`, one `return { [id] = { ... }, ... }` each. `vana.gamedata`\nis empty until an addon touches a table; the first `vana.gamedata.spells` runs the file and keeps the result. Spells\ntake a few milliseconds. Items would be 18 MB in one file, so they're written in parts of 4,096 ids: `items_6.lua` holds\nids 24576 to 28671, and `vana.gamedata.items[26963]` loads that part alone, in about 50 ms. `pairs()` on `items` sees the\nparts loaded so far; `vana.gamedata.all('items')` loads every part first (about a second) and `find()` does the same the\nfirst time it's asked, to build its name index. Every addon's Lua state has its own copy, as each has its own copy of\nanything it loads.\n\nText is UTF-8 as the client shows it, with the element icons as `{Fire}`, `{Ice}` and so on; to print a description to\nthe chat, pass it through `vana.encoding.to_shift_jis` first. Times are seconds where the server keeps milliseconds\n(`cast_time`, `recast`); an item's own `cast_time` and delays are the client's numbers as they are.\n\nTo regenerate after a DAT or server change, from the dats repository with xi-tools' Python (its `.env` names the game\ninstall):\n\n```\n<xi-tools>\\.venv\\Scripts\\python.exe tools\\gen_gamedata.py --out <VanaCore>\\addons\\vanacore\\libs\\gamedata [--only spells,items]\n```\n\n## 4. The API Explorer\n\n`/api` (or `/apiexplorer`) shows or hides it; `/api show` and `/api hide` only show or only hide it. The addon isn't\nloaded at start: `/api` loads it and shows it then. The window has two tabs, each with a list down the left (drag its right edge to widen it), and o
