name: VanaCore Promote (vcdev to vanacore)
run-name: VanaCore promote vcdev to vanacore (${{ inputs.deploy }})

# Makes the vcdev build on R2 the one every player gets, once it's been tested: copies vcdev's files, as they are on R2
# (the exact files tested, signed as they were pushed), to the vanacore build (.github/scripts/push_build.py
# --promote-from), then publishes the draft GitHub release release.yaml made of that build, marked latest (the
# README's Download button). Nothing is built.
#
# The draft is release.yaml's newest, and it must be the build vcdev holds: its VanaCore.exe and VanaCore.Core.dll are
# checked against vcdev's on R2 before anything is copied. Older drafts, of builds never promoted, are deleted after.
#
# What other repositories publish to the vanacore build (CatsEyeXI's plugins and addons, push_build.py's EXTERNAL) is
# vanacore's own and left alone; DLSS 5's DLL goes across when vcdev's differs (push_build.py's KEEP).
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Promote vcdev to vanacore (dry run lists what would change and publishes nothing)
        type: choice
        options: [dry run, push]
        default: push
      deletes:
        description: Also remove files from vanacore that vcdev doesn't have
        type: boolean
        default: false
      release:
        description: Publish the build's draft GitHub release (unticked, R2 only)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  promote:
    name: Promote vcdev to vanacore
    # push_build.py compares the build's paths as Windows ones
    runs-on: windows-latest
    timeout-minutes: 60
    # One writer of launcher.json and the build states at a time (release.yaml is in this group too). Never cancelled
    # in progress: a half-finished publish is worse than a queued one.
    concurrency:
      group: r2-publish
      cancel-in-progress: false

    steps:
      - name: Checkout the push script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts/push_build.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The newest draft release, and that it's the build vcdev holds
      - name: Find the build's draft release
        id: draft
        if: inputs.release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $drafts = @(gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json |
            Where-Object { $_.draft -and $_.name -like 'VanaCore *' } | Sort-Object { [datetime]$_.created_at } -Descending)
          if (-not $drafts) { throw 'No draft release: run release.yaml with push (and release ticked) first, or untick release here' }
          $draft = $drafts[0]
          $asset = @($draft.assets | Where-Object name -like 'VanaCore-*.zip')[0]
          if (-not $asset) { throw "$($draft.name) has no zip" }
          $zip = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -UseBasicParsing -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream' } `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases/assets/$($asset.id)" -OutFile $zip
          $unzipped = Join-Path $env:RUNNER_TEMP draft
          Expand-Archive -Path $zip -DestinationPath $unzipped
          # vcdev's state on R2 (a fresh copy past the CDN's), as push_build.py reads it: gzip, path=first 6 hex of SHA-1
          $state = Join-Path $env:RUNNER_TEMP vcdev.gz
          Invoke-WebRequest -UseBasicParsing -Uri "https://launcher.catseyexi.com/launcher/build_vcdev_vanacore.gz?v=$([guid]::NewGuid())" -OutFile $state
          $text = python -c "import gzip,sys; print(gzip.decompress(open(sys.argv[1],'rb').read()).decode())" $state
          $hashes = @{}
          foreach ($line in $text -split "`n") { $k, $v = $line.Trim() -split '=', 2; if ($k) { $hashes[$k.ToLower()] = $v.ToLower() } }
          foreach ($file in 'VanaCore.exe', 'VanaCore.Core.dll') {
            $mine = (Get-FileHash -Algorithm SHA1 -LiteralPath (Join-Path $unzipped "VanaCore/$file")).Hash.Substring(0, 6).ToLower()
            if ($hashes[$file.ToLower()] -ne $mine) {
              throw "$($draft.name)'s $file ($mine) isn't vcdev's ($($hashes[$file.ToLower()])): vcdev holds another build. Nothing promoted"
            }
          }
          "$($draft.name) is the build vcdev holds"
          "tag=$($draft.tag_name)" >> $env:GITHUB_OUTPUT
          "name=$($draft.name)" >> $env:GITHUB_OUTPUT
          "older=$(($drafts | Select-Object -Skip 1 | ForEach-Object id) -join ' ')" >> $env:GITHUB_OUTPUT

      - name: Promote
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }} # push_build.py reads cexi-addons' list of addons from GitHub
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          $flags = @()
          if ('${{ inputs.deploy }}' -ne 'push') { $flags += '--dry-run' }
          if ('${{ inputs.deletes }}' -eq 'true') { $flags += '--deletes' }
          $folder = Join-Path $env:RUNNER_TEMP vcdev
          python .github/scripts/push_build.py vanacore/vanacore --promote-from vcdev/vanacore --folder $folder @flags
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Publish the release
        if: inputs.deploy == 'push' && inputs.release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit '${{ steps.draft.outputs.tag }}' --draft=false --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($id in '${{ steps.draft.outputs.older }}' -split ' ' | Where-Object { $_ }) {
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          }
          "## ${{ steps.draft.outputs.name }} promoted to vanacore and released" >> $env:GITHUB_STEP_SUMMARY

      - name: Summary (R2 only or dry run)
        if: inputs.deploy != 'push' || !inputs.release
        shell: pwsh
        run: |
          "## vcdev promoted to vanacore$(if ('${{ inputs.deploy }}' -ne 'push') { ' (dry run: nothing changed)' })" >> $env:GITHUB_STEP_SUMMARY
